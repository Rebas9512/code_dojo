<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; script-src 'self'; form-action 'none'; base-uri 'none'">
  <title>code-dojo</title>
  <link rel="stylesheet" href="startup.css">
  <script src="startup.js" defer></script>
</head>
<body>
  <header>code-dojo</header>
  <main>
    <h1 id="heading" aria-live="polite">正在打开…</h1>
    <progress id="progress" max="100" hidden aria-label="题库下载进度"></progress>
    <p id="note" role="status" hidden></p>
    <form id="unlock" hidden>
      <label for="password">解锁密码</label>
      <input type="password" id="password" autocomplete="off" required>
      <div class="actions"><button id="unlockButton">解锁</button><button type="button" class="quiet manual">改用令牌</button></div>
    </form>
    <form id="tokens" hidden>
      <label for="code">代码仓库令牌（只读）</label>
      <input type="password" id="code" autocomplete="off" required>
      <label for="sync">进度仓库令牌（读写）</label>
      <input type="password" id="sync" autocomplete="off" placeholder="共用同一令牌时留空">
      <button id="save">保存</button>
    </form>
    <div id="recovery" class="actions" hidden><button id="retry">重启</button><button class="quiet manual">改用令牌</button></div>
    <a id="installer" target="_blank" rel="noreferrer" hidden>下载新版安装包</a>
    <p id="ai" hidden></p>
  </main>
</body>
</html>
