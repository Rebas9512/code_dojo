<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; script-src 'self'; form-action 'none'; base-uri 'none'">
  <title>code-dojo</title>
  <link rel="stylesheet" href="startup.css">
  <script src="startup.js" defer></script>
</head>
<body>
  <header>code-dojo <button type="button" id="done" hidden>完成</button></header>
  <main>
    <h1 id="heading" aria-live="polite">正在打开…</h1>
    <progress id="progress" max="100" hidden aria-label="题库下载进度"></progress>
    <form id="connect" hidden>
      <p>做题记录保存在本机。输入同步码，可以把记录同步到进度仓库，换电脑接着练。</p>
      <label for="code">同步码</label>
      <input type="password" id="code" autocomplete="off" aria-describedby="note" required>
      <button id="enable">开启同步</button>
    </form>
    <div id="connected" hidden>
      <p>已开启进度同步</p>
      <button id="disable">关闭同步</button>
      <div id="confirm" hidden>
        <p>关闭进度同步？做题记录会保留在本机。</p>
        <button id="cancel">取消</button>
        <button id="confirmDisable">确认关闭</button>
      </div>
    </div>
    <p id="note" role="status" hidden></p>
    <button id="retry" hidden>重启</button>
    <a id="installer" target="_blank" rel="noreferrer" hidden>下载新版安装包</a>
    <section id="agents" aria-labelledby="ai" hidden>
      <h2 id="ai"></h2>
      <p id="path-help">在终端运行 <code>command -v claude</code> 或 <code>command -v codex</code> 可查看路径。</p>
      <template id="agent-row">
        <form class="agent">
          <div class="agent-heading"><label></label><span class="agent-state" role="status"></span></div>
          <div class="path-controls">
            <input type="text" placeholder="命令的完整路径" autocomplete="off" spellcheck="false" required>
            <button type="button" class="browse">浏览…</button>
            <button type="submit">保存</button>
          </div>
          <button type="button" class="auto" hidden>改回自动查找</button>
          <p class="agent-note" role="status" hidden></p>
        </form>
      </template>
    </section>
  </main>
</body>
</html>
