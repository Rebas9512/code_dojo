name: 发布桌面安装包
'on':
  push:
    tags: ['app-v*']

permissions:
  contents: read

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODE_DOJO_AI_PROVIDER: 'off'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - name: 校验安装包版本
        run: python -c "import os; from bootstrap import VERSION; assert os.environ['GITHUB_REF_NAME'] == 'app-v' + VERSION"
      - name: 构建并检查独立 Python 安装包
        if: runner.os != 'Linux'
        env:
          CODE_DOJO_SEALED_TOKENS: ${{ secrets.CODE_DOJO_SEALED_TOKENS }}
        run: python scripts/desktop/build.py --output dist app
      - name: 在虚拟显示器中检查 Linux Tk 和判题子进程
        if: runner.os == 'Linux'
        env:
          CODE_DOJO_SEALED_TOKENS: ${{ secrets.CODE_DOJO_SEALED_TOKENS }}
        run: xvfb-run -a python scripts/desktop/build.py --output dist app
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/code-dojo-*
          if-no-files-found: error
  publish-app:
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: dist
      - name: 发布三个系统的安装包
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest --title "code-dojo ${GITHUB_REF_NAME#app-v}" --generate-notes
