name: 跨平台判题

# 仓库 2026-11-23 起公开，标准机器不计费。推送 main 只跑 Linux，让更新包早点发；三系统完整测试手动触发（gh workflow run ci.yml），改判题、启动器或发版前跑一次。
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CODE_DOJO_AI_PROVIDER: 'off'
      CODE_DOJO_JUDGE: local
      CODE_DOJO_DATA: ${{ github.workspace }}/.ci-data
      CODE_DOJO_JUDGE_ENVS: ${{ github.workspace }}/.ci-data/judge-envs
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.14
      - name: 安装 SQL 校验依赖
        working-directory: scripts/curriculum
        run: npm ci
      - run: uv run --no-sync pytest -q
      - name: 基础题
        run: uv run --no-sync python ../scripts/verify_bank.py --judge local --only py-0a- --jobs 2
      - name: 深树与记忆化递归
        run: |
          uv run --no-sync python ../scripts/verify_bank.py --judge local --only algo-3-005-
          uv run --no-sync python ../scripts/verify_bank.py --judge local --only algo-3-012-
          uv run --no-sync python ../scripts/verify_bank.py --judge local --only algo-4-030-
        shell: bash
      - name: 数据科学题
        if: runner.os == 'Linux'
        run: uv run --no-sync python ../scripts/verify_bank.py --judge local --only wrangle-1-002-
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
