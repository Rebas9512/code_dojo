wrong_examples:
- why: 在终点又开启一轮跳跃。
  code: |
    def min_jumps(nums: list[int]) -> int:
        end = reach = jumps = 0
        for i in range(len(nums)):
            reach = max(reach, i + nums[i])
            if i == end:
                jumps += 1
                end = reach
        return jumps
