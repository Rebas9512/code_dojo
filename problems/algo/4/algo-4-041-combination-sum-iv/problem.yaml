- why: 漏掉和为零的那种空步序。
  code: |
    def ordered_sums(nums: list[int], target: int) -> int:
        ways = [0] * (target + 1)
        for total in range(1, target + 1):
            for step in nums:
                if step <= total:
                    ways[total] += ways[total - step]
        return ways[target]
hints:
- 先固定最后选的数。以不同数为最后一步的方案彼此没有重叠。
