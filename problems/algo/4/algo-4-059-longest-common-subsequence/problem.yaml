wrong_examples:
- why: 失配就清零，算成连续片段。
  code: |
    def lcs_length(a: str, b: str) -> int:
        previous = [0] * (len(b) + 1)
        for x in a:
            row = [0]
            for j, y in enumerate(b, 1):
                if x == y:
                    row.append(previous[j - 1] + 1)
                else:
                    row.append(0)
            previous = row
        return previous[-1]
