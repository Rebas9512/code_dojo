wrong_examples:
- why: 递归调用没有缓存，同一参数会多次进入函数体。
  code: |
    from functools import cache


    def fib_visits(n: int) -> list[int]:
        visits = 0

        def fib(i):
            nonlocal visits
            visits += 1
            if i < 2:
                return i
            return fib(i - 1) + fib(i - 2)

        value = fib(n)
        return [value, visits]
