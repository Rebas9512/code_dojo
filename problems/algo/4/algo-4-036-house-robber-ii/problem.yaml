entry: circle_loot
signature: 'def circle_loot(nums: list[int]) -> int:'
compare: exact
wrong_examples:
- why: 把整圈当直线，可能同时选首尾。
  code: |
    def circle_loot(nums: list[int]) -> int:
        if len(nums) == 1:
            return nums[0]

        def line(values):
            two = one = 0
            for value in values:
                two, one = one, max(one, two + value)
            return one

        return max(line(nums), line(nums[1:]))
