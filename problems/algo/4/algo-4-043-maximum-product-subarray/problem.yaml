entry: max_product
signature: 'def max_product(nums: list[int]) -> int:'
compare: exact
wrong_examples:
- why: 只记上一格的最大积，漏掉负负得正。
  code: |
    def max_product(nums: list[int]) -> int:
        low = high = best = nums[0]
        for value in nums[1:]:
            a, b = low * value, high * value
            low = min(value, a, b)
            high = max(value, b)
            best = max(best, high)
        return best
