wrong_examples:
- why: 只尝试分成两块。
  code: |
    def break_product(n: int) -> int:
        best = [0] * (n + 1)
        for total in range(2, n + 1):
            for first in range(1, total):
                rest = total - first
                best[total] = max(best[total], first * rest, first * rest)
        return best[n]
