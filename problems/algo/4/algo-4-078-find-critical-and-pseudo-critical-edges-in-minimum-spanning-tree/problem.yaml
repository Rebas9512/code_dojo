- why: 把所有非必选边都归到可选边，包含了太贵的线路。
  code: |
    def classify_edges(n: int, edges: list[list[int]]) -> list[list[int]]:
        ranked = sorted(range(len(edges)), key=lambda i: edges[i][2])

        def tree_cost(skip=-1, force=-1):
            parent = list(range(n))

            def root(node):
                while node != parent[node]:
                    parent[node] = parent[parent[node]]
                    node = parent[node]
                return node

            cost = used = 0
            if force >= 0:
                u, v, cost = edges[force]
                parent[u] = v
                used = 1
            for i in ranked:
                if i == skip or i == force:
                    continue
                u, v, weight = edges[i]
                a, b = root(u), root(v)
                if a != b:
                    parent[a] = b
                    cost += weight
                    used += 1
            return cost if used == n - 1 else float("inf")

        minimum = tree_cost()
        must, may = [], []
        for i in ranked:
            if tree_cost(skip=i) > minimum:
                must.append(i)
            else:
                may.append(i)
        return [must, may]
