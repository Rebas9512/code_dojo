wrong_examples:
- why: 漏掉起点处尚未走步的那一种方案。
  code: |
    def climb(n: int) -> int:
        previous, current = 0, 1
        for step in range(2, n + 1):
            previous, current = current, previous + current
        return current
- why: 分别计算两条来路，每次都重新展开相同台阶的调用树。
  code: |
    def climb(n: int) -> int:
        if n < 2:
            return 1
        return climb(n - 1) + climb(n - 2)
