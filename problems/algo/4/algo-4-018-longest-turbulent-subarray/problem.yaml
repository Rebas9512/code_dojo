signature: 'def turbulence(nums: list[int]) -> int:'
compare: exact
wrong_examples:
- why: 把两个相等元素也认作新的交替段。
  code: |
    def turbulence(nums: list[int]) -> int:
        up = down = best = 1
        for i in range(1, len(nums)):
            if nums[i] > nums[i - 1]:
                up, down = down + 1, 1
            elif nums[i] < nums[i - 1]:
                up, down = 1, up + 1
            else:
                up = down = 2
            best = max(best, up, down)
        return best
