entry: flight_cost
signature: 'def flight_cost(n: int, flights: list[list[int]], src: int, dst: int, k: int) -> int:'
compare: exact
wrong_examples:
- why: 原地更新会让一轮连用多段航班。
  code: |
    def flight_cost(n: int, flights: list[list[int]], src: int, dst: int, k: int) -> int:
        price = [float("inf")] * n
        price[src] = 0
        for _ in range(k + 1):
            updated = price
            for u, v, fare in flights:
                updated[v] = min(updated[v], price[u] + fare)
            price = updated
        return -1 if price[dst] == float("inf") else price[dst]
hints:
- 第 1 轮只准坐一段航班。下一轮松弛时从上一轮的价格表读取，整轮结束才替换。
