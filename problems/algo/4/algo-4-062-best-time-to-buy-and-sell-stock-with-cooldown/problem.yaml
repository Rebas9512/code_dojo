- why: 刚卖完的第二天就再次买入。
  code: |
    def cooldown_profit(prices: list[int]) -> int:
        holding = -prices[0]
        sold = float("-inf")
        free = 0
        for price in prices[1:]:
            holding, sold, free = (max(holding, free - price, sold - price),
                                   holding + price, max(free, sold))
        return max(sold, free)
