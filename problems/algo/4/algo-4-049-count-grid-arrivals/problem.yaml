wrong_examples:
- why: 把左边一步看成了左上方的斜走。
  code: |
    def path_table(rows: int, cols: int) -> list[list[int]]:
        table = [[1] * cols for _ in range(rows)]
        for r in range(1, rows):
            for c in range(1, cols):
                table[r][c] = table[r - 1][c] + table[r - 1][c - 1]
        return table
