wrong_examples:
- why: 优先保留开始最早的长段。
  code: |
    def erase_overlaps(intervals: list[list[int]]) -> int:
        end = None
        removed = 0
        for start, stop in sorted(intervals, key=lambda span: span[0]):
            if end is None or start >= end:
                end = stop
            else:
                removed += 1
        return removed
hints:
- 设想有两种保留方案。从结束较早的那一段之后开始，原本能参加的后续时段仍然都能参加。
