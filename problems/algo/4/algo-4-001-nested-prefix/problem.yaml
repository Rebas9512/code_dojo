entry: has_prefix
signature: 'def has_prefix(words: list[str], prefix: str) -> bool:'
compare: exact
wrong_examples:
- why: 只承认已经完整入柜的词。
  code: |
    def has_prefix(words: list[str], prefix: str) -> bool:
        root = {}
        for word in words:
            node = root
            for letter in word:
                node = node.setdefault(letter, {})
            node["#"] = True
        node = root
        for letter in prefix:
            if letter not in node:
                return False
            node = node[letter]
        return prefix in words
