- why: 遇到较短的字母范围，把当前段提前截断。
  code: |
    def partition_sizes(s: str) -> list[int]:
        last = {letter: i for i, letter in enumerate(s)}
        start = end = 0
        sizes = []
        for i, letter in enumerate(s):
            end = last[letter]
            if i == end:
                sizes.append(end - start + 1)
                start = i + 1
        return sizes
hints:
- 第一次遇到一个字母时，整段至少要延伸到它的最后出现位置。中途遇到的新字母也有自己的最后位置。
