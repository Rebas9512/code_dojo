wrong_examples:
- why: 找到候选起点后，漏验全程总油量。
  code: |
    def gas_start(gas: list[int], cost: list[int]) -> int:
        total = tank = start = 0
        for i in range(len(gas)):
            gain = gas[i] - cost[i]
            total += gain
            tank += gain
            if tank < 0:
                start = i + 1
                tank = 0
        return start
