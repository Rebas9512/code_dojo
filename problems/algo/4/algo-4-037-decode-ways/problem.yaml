wrong_examples:
- why: 把单独的零也当作一个字母。
  code: |
    def decode_count(s: str) -> int:
        two, one = 1, int(s[0] != "0")
        for i in range(1, len(s)):
            ways = one
            if "10" <= s[i - 1:i + 1] <= "26":
                ways += two
            two, one = one, ways
        return one
