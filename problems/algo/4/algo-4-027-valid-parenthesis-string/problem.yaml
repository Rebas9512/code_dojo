entry: valid_stars
signature: 'def valid_stars(s: str) -> bool:'
compare: exact
wrong_examples:
- why: 只检查右括号是否太多，漏查收尾的左括号。
  code: |
    def valid_stars(s: str) -> bool:
        low = high = 0
        for ch in s:
            if ch == "(":
                low += 1
                high += 1
            elif ch == ")":
                low = max(0, low - 1)
                high -= 1
            else:
                low = max(0, low - 1)
                high += 1
            if high < 0:
                return False
        return high >= 0
