wrong_examples:
- why: 把相等的值放到了已有末尾之后。
  code: |
    import bisect


    def lis_length(nums: list[int]) -> int:
        tails = []
        for value in nums:
            i = bisect.bisect_right(tails, value)
            if i == len(tails):
                tails.append(value)
            else:
                tails[i] = value
        return len(tails)
hints:
- 按子序列长度分别记当前最小末尾。新值可替换第一个不小于它的末尾，使将来的延长更容易。
