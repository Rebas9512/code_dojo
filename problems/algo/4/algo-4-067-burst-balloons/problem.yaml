- why: 计算最后一戳时漏乘两侧尚在的气球。
  code: |
    def burst_score(nums: list[int]) -> int:
        values = [1] + nums + [1]
        n = len(values)
        best = [[0] * n for _ in range(n)]
        for gap in range(2, n):
            for left in range(n - gap):
                right = left + gap
                sides = values[left] * values[right]
                for last in range(left + 1, right):
                    score = best[left][last] + values[last] + best[last][right]
                    best[left][right] = max(best[left][right], score)
        return best[0][-1]
hints:
- 反过来想，在两个还没破的边界之间，谁最后被戳破？那一刻左右邻居的值已经确定。
