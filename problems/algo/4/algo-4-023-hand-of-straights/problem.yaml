wrong_examples:
- why: 同时开多组时每种牌面却只扣一张。
  code: |
    from collections import Counter


    def group_runs(hand: list[int], size: int) -> bool:
        if len(hand) % size:
            return False
        counts = Counter(hand)
        for start in sorted(counts):
            copies = counts[start]
            if copies == 0:
                continue
            for value in range(start, start + size):
                if counts[value] < copies:
                    return False
                counts[value] -= 1
        return True
