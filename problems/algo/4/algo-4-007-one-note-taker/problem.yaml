- why: 把上一场离开的一刻也算成占用。
  code: |
    def can_attend(meetings: list[list[int]]) -> bool:
        ordered = sorted(meetings)
        for i in range(1, len(ordered)):
            if ordered[i][0] <= ordered[i - 1][1]:
                return False
        return True
