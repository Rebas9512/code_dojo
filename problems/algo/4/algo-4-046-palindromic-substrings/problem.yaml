- why: 偶数长的对称段没有参与计数。
  code: |
    def palindrome_count(s: str) -> int:
        count = 0
        for center in range(len(s)):
            for left, right in [(center, center)]:
                while left >= 0 and right < len(s) and s[left] == s[right]:
                    count += 1
                    left -= 1
                    right += 1
        return count
hints:
- 固定中心，每次向两边成功伸一格，就新找到一对起止位置。
