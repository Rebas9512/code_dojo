entry: fewest_coins
signature: 'def fewest_coins(coins: list[int], amount: int) -> int:'
compare: exact
wrong_examples:
- why: 不让一枚等额硬币完成最后一步。
  code: |
    def fewest_coins(coins: list[int], amount: int) -> int:
        missing = amount + 1
        best = [0] + [missing] * amount
        for total in range(1, amount + 1):
            for coin in coins:
                if coin < total:
                    best[total] = min(best[total], best[total - coin] + 1)
        return -1 if best[amount] == missing else best[amount]
