- why: 让刚投过票的代表抢在下一位之前再投。
  code: |
    from collections import deque


    def senate_winner(senate: str) -> str:
        radiant = deque()
        dire = deque()
        for i, party in enumerate(senate):
            if party == "R":
                radiant.append(i)
            else:
                dire.append(i)
        while radiant and dire:
            r = radiant.popleft()
            d = dire.popleft()
            if r < d:
                radiant.append(r)
            else:
                dire.append(d + len(senate))
        return "Radiant" if radiant else "Dire"
