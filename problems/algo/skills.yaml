# 阶段 1–5 的知识卡先写要点，做到该阶段时再扩写。
track: algo
skills:
  # ===================== 阶段 1：数组与哈希、栈、链表 =====================
  - id: algo.hash-seen
    name: 集合记录"见过"
    stage: "1"
    group: 1
    prereqs: [py.set-basics]
    card: |
      从左到右检查时，`seen` 保存当前位置**之前**出现过的不同值。
      ```python
      seen = set()
      for x in [8, 2, 8]:
          if x in seen:
              print(x)  # 第三步发现 8
              break
          seen.add(x)
      ```
      集合中查一个整数平均 O(1)，扫完整列平均 O(n)，最多记 n 个值。
      常见坑：先添加再查询，每个新值都会被自己认作重复。要保留下标时，改用字典。

  - id: algo.hash-index-map
    name: 字典记录 值 → 下标
    stage: "1"
    group: 1
    prereqs: [py.dict-basics, py.enumerate]
    card: |
      需要知道“值在哪里”时，用值当键，用位置当字典的值。位置从 0 起。
      ```python
      pos = {}
      for i, x in enumerate([6, 2, 6]):
          if x not in pos:
              pos[x] = i
      print(pos[6])  # 0
      ```
      每次查位置平均 O(1)。若要最近一次的位置，就在每轮覆盖。
      两数配对时先查以前有没有补数，再登记自己；同一个下标不能使用两次。

  - id: algo.counter
    name: collections.Counter
    stage: "1"
    group: 1
    prereqs: [py.dict-counting]
    card: |
      把每个值当作标签，标签旁记录它出现的次数。打乱顺序后这些次数仍然相同。
      ```python
      from collections import Counter
      counts = Counter("纸笔纸")
      print(counts["纸"], counts["墨"])  # 2 0
      ```
      处理 n 个字符平均 O(n)，存储量取决于不同字符数。用 `a == b` 比较两张计数表。
      常见坑：转成集合会丢失次数，例如“纸纸笔”和“纸笔笔”的集合完全相同。

  - id: algo.defaultdict
    name: collections.defaultdict
    stage: "1"
    group: 1
    prereqs: [py.dict-grouping]
    card: |
      要把多个项目装进同一组，用稳定、可作字典键的标签标识该组。
      ```python
      from collections import defaultdict
      groups = defaultdict(list)
      for word in ["tea", "ate"]:
          groups["".join(sorted(word))].append(word)
      print(groups["aet"])  # ['tea', 'ate']
      ```
      传入 `list` 后，首次按键取值才会新建一个独立列表。排序长度 m 的词需要 O(m log m)。
      常见坑：`sorted(word)` 得到列表，不能直接当键；只想查询是否已有分组时用 `key in groups`。

  - id: algo.bucket
    name: 按频率分桶
    stage: "1"
    group: 1
    prereqs: [py.list-concat-repeat, py.dict-counting]
    card: |
      桶是一组按整数下标存放的小列表。频率作下标，出现该次数的值装进同一桶。
      ```python
      buckets = [[] for _ in range(4)]  # 有三个输入，次数最多是 3
      buckets[2].append(8)
      buckets[1].append(5)
      print(buckets)  # [[], [5], [8], []]
      ```
      先计数，再分桶，最后从高频向低频收集，合计平均 O(n) 时间、O(n) 空间。
      常见坑：`[[]] * 4` 的四个位置共享同一个列表。频率上限很小时才值得直接开桶。

  - id: algo.class-design
    name: 设计题：用内置结构实现接口
    stage: "1"
    group: 1
    prereqs: [py.class-methods, py.dict-basics]
    card: |
      操作序列里的每一步都作用在同一个对象上。`self` 上的数据会保留到下一次调用。
      ```python
      class Bag:
          def __init__(self):
              self.items = []
          def add(self, x):
              self.items.append(x)
      bag = Bag()
      bag.add(4)
      print(bag.items)  # [4]
      ```
      向列表末尾添加通常只处理一个元素，按值查找却可能扫完整列。先读接口的时间要求。
      常见坑：在每次 add 时新建列表，会丢失上次记录；把列表写在类上，多个实例又会共用它。

  - id: algo.stack-matching
    name: 栈做匹配
    stage: "1"
    group: 2
    prereqs: [py.stack-list, py.dict-basics]
    card: |
      栈里从底到顶依次是尚未关闭的左括号，栈顶必须最先被关闭。
      ```python
      pairs = {")": "(", "]": "["}
      stack = ["(", "["]
      closing = "]"
      print(bool(stack) and stack.pop() == pairs[closing])  # True
      print(stack)  # ['(']，还有一层待关闭
      ```
      遇左括号就压栈，遇右括号先检查栈非空，再弹出并核对类型。读完时还需检查栈空。
      每个括号最多入栈、出栈一次，时间 O(n)。只数左右个数无法发现交叉配对。

  - id: algo.monotonic-stack
    name: 单调栈
    stage: "1"
    group: 2
    prereqs: [py.stack-list]
    card: |
      找右边第一个更大值时，把还没等到答案的**下标**入栈。它们对应的数从栈底到栈顶非递增。
      ```python
      nums = [9, 4, 7]
      pending = [0, 1]
      while pending and nums[pending[-1]] < nums[2]:
          print(pending.pop())  # 下标 1 等到了 7
      pending.append(2)
      ```
      同一位置只入栈、出栈各一次，全部操作 O(n)，最多保存 n 个下标。
      常见坑：题目要“严格更大”时，相等的数还要继续等。求等待距离要用下标相减。

  - id: algo.ll-traverse
    name: 链表遍历
    stage: "1"
    group: 3
    prereqs: [py.node-class, py.while]
    card: |
      一个节点包含值 `val` 和下一个节点的引用 `next`。表头 `head` 指向第一格；空表的头是 None。
      ```python
      cur = head
      while cur is not None:
          print(cur.val)
          cur = cur.next
      ```
      给 cur 重新赋值只移动观察位置，head 还在原处。走 n 个节点需要 O(n) 时间，只用一个游标。
      常见坑：写成 `while cur.next` 会漏掉尾节点，空头还会报错。这个遍历模板要求链无环。

  - id: algo.ll-dummy
    name: 哨兵（dummy）节点
    stage: "1"
    group: 3
    prereqs: [algo.ll-traverse]
    card: |
      哨兵是放在真头前面的辅助节点。真头有了前驱，删除头部和删除中间节点的写法就一样。
      ```python
      dummy = ListNode(0, head)
      if dummy.next:
          dummy.next = dummy.next.next  # 摘掉旧头
      head = dummy.next
      ```
      已知前驱时摘一个节点只改一根箭头，O(1)；为找到它而遍历仍需 O(n)。
      常见坑：交回 dummy 会把辅助值算进结果；交回旧 head 可能重新带回已删除的头。用 dummy.next。

  - id: algo.ll-reverse
    name: 反转链表
    stage: "1"
    group: 3
    prereqs: [algo.ll-traverse, py.multi-assign]
    card: |
      将链拆成两段：prev 是已翻转段的头，cur 是还没处理段的头。每轮把 cur 接到 prev 前面。
      ```python
      prev, cur = None, head
      while cur:
          nxt = cur.next
          cur.next = prev
          prev, cur = cur, nxt
      ```
      cur 走空时，prev 指向新头。共翻转 n 根箭头，时间 O(n)，额外空间 O(1)。
      常见坑：先改 cur.next 再找下一格，读到的已经是回头路。保留 nxt 后才动箭头。

  - id: algo.fast-slow
    name: 快慢指针
    stage: "1"
    group: 3
    prereqs: [algo.ll-traverse]
    card: |
      从同一头节点出发，快指针每轮走两步，慢指针走一步。无环链中，快指针走完时慢指针在中间。
      ```python
      slow = fast = head
      while fast and fast.next:
          slow = slow.next
          fast = fast.next.next
      ```
      偶数长度时这段代码取靠后的中点。有环时，进入环后快指针每轮相对慢指针追近一格。
      找中点和判环均为 O(n) 时间、O(1) 空间。判环应在前进后比较两个节点的身份，值相等还可能是两格。

  - id: algo.doubly-linked
    name: 双向链表 + 哈希（LRU）
    stage: "1"
    group: 3
    prereqs: [algo.ll-dummy, algo.class-design]
    card: |
      给节点同时连上前驱 prev 和后继 next。已知中间节点时，把两位邻居互相接上就能摘掉它。
      ```python
      a, b = node.prev, node.next
      a.next = b
      b.prev = a
      ```
      头尾各放一个固定的哨兵，就能保证真节点有两个邻居。字典把键直接映射到节点，
      查找后摘下、移到头部都不必遍历，平均 O(1)。LRU 用链头记最近访问、链尾记最久未访问。
      常见坑：只改 next，向前看似正确，后续通过 prev 删除相邻节点时才会接错。

  # ===================== 阶段 2：核心套路 =====================
  - id: algo.two-pointers
    name: 对向双指针
    stage: "2"
    group: 1
    prereqs: [py.two-index, py.sorted, py.swap-reverse]
    card: |
      两端夹逼找有序列表中的一对数。左端配最大值仍嫌小，就能排除左端的所有配对。
      ```python
      nums, target = [1, 3, 6], 9
      left, right = 0, 2
      if nums[left] + nums[right] < target:
          left += 1
      print(left, right)  # 1 2，这两格的和是 9
      ```
      每轮只向内移，时间 O(n)，额外空间 O(1)。相遇时只剩一格，不能拿同一位置凑一对。

  - id: algo.read-write-pointer
    name: 同向读写指针
    stage: "2"
    group: 1
    prereqs: [py.two-index]
    card: |
      原地筛选时，write 指向下一个保留位置。它左边是已经整理好的部分。
      ```python
      nums, write = [0, 8, 0, 3], 0
      for value in nums:
          if value != 0:
              nums[write] = value
              write += 1
      print(nums[:write])  # [8, 3]
      ```
      读完 n 格共 O(n) 时间，整理时额外空间 O(1)。尾部仍可能有旧值；写指针只在保留元素时前进。

  - id: algo.window-fixed
    name: 定长滑动窗口
    stage: "2"
    group: 2
    prereqs: [py.prefix-sum]
    card: |
      求连续 k 项的和或计数时，先登记第一个完整窗口，再一进一出地更新。
      ```python
      nums, k = [3, 1, 8, 2], 2
      total = sum(nums[i] for i in range(k))
      for i in range(k, len(nums)):
          total += nums[i] - nums[i - k]
          print(total)  # 依次是 9、10
      ```
      更新一格只需常数次加减，扫描所有窗口 O(n)。求最大和时从第一个窗口起算，全负数也有真实的最大值。

  - id: algo.window-variable
    name: 可变滑动窗口
    stage: "2"
    group: 2
    prereqs: [algo.window-fixed, py.dict-counting]
    card: |
      连续段长度未知时，先找一种能靠移走左端恢复的约束。求最长合法段时，右端进入、左端反复退出，合法后再记长度。
      ```python
      nums, left, zeros = [0, 1, 0], 0, 0
      for right, value in enumerate(nums):
          zeros += value == 0
          while zeros > 1:
              zeros -= nums[left] == 0
              left += 1
      print(left, right)  # 1 2，窗口里只剩一个零
      ```
      所有收缩加起来不超过 n 次，维护零的个数共 O(n) 时间。负数会破坏“多加一项只会使和变大”的前提。

  - id: algo.binary-search
    name: 二分查找
    stage: "2"
    group: 4
    prereqs: [py.while, py.floordiv-mod]
    card: |
      在先假后真的判定里找第一真。待检查的位置为左闭右开区间 [lo,hi)，hi 可以等于列表长度。
      ```python
      nums, x = [2, 5, 5], 5
      lo, hi = 0, len(nums)
      while lo < hi:
          mid = (lo + hi) // 2
          if nums[mid] < x:
              lo = mid + 1
          else:
              hi = mid
      print(lo)  # 1
      ```
      每轮折半，时间 O(log n)。所有值小于 x 时返回 n。精确查找要再判断 `lo < len(nums) and nums[lo] == x`。

  - id: algo.binary-search-answer
    name: 二分答案
    stage: "2"
    group: 4
    prereqs: [algo.binary-search, py.helper-func]
    card: |
      求最小可行值，先验证“某值可行后，更大值都可行”。在候选值的半开区间里找第一真。
      ```python
      piles = [3, 5]
      lo, hi = 1, max(piles) + 1
      while lo < hi:
          mid = (lo + hi) // 2
          if sum((p + mid - 1) // mid for p in piles) <= 3:
              hi = mid
          else:
              lo = mid + 1
      print(lo)  # 3
      ```
      每堆单独向上取整。n 堆、M 档速度，最多 O(n log(M+1)) 时间。非单调条件无法排除半边。

  - id: algo.prefix-hash
    name: 前缀和 + 哈希
    stage: "2"
    group: 3
    prereqs: [py.prefix-sum, py.dict-counting]
    card: |
      区间两端是两个切口。当前切口的合计为 cur，要得到区间和 k，就数以前有几次合计为 cur−k。
      ```python
      counts = {0: 1}
      cur = answer = 0
      for x in [2, -2, 0]:
          cur += x
          answer += counts.get(cur, 0)  # 目标为 0
          counts[cur] = counts.get(cur, 0) + 1
      print(answer)  # 3
      ```
      先查再登记，避免把空段算进去。初始的 0 代表第一格之前的切口。平均 O(n) 时间，最多保存 n+1 种合计。

  - id: algo.math-module
    name: math 模块与数学技巧
    stage: "2"
    group: 5
    prereqs: [py.floordiv-mod]
    card: |
      要找能同时整除两数的最大长度，可用辗转相除。用 (b,a%b) 替换 (a,b) 后，能整除它们的数完全相同。
      ```python
      import math
      a, b = 30, 18
      while b:
          a, b = b, a % b
      print(a, math.gcd(30, 18))  # 6 6
      print(math.isqrt(35))  # 5，平方不超过 35 的最大非负整数
      ```
      正数的取余轮数是对数级。做字符串公约数题时，长度只给出候选长度，还要检查重复后内容是否相同。

  - id: algo.bit-ops
    name: 位运算
    stage: "2"
    group: 6
    prereqs: [py.floordiv-mod]
    card: |
      将最低位编号为 0。与 & 取交集，或 | 取并集，异或 ^ 只留不同位；左移、右移可改变位的位置。
      ```python
      print((6 >> 1) & 1)  # 1，取 110 的第 1 位
      print(6 ^ 3 ^ 6)  # 3，相同整数异或两次会抵消
      word = -2 & 0xffffffff
      print(word & 15)  # 14，低四位 1110
      print(-1 >> 1)  # -1
      ```
      Python 的负数右移会延续符号位。数固定 32 位中的 1 时先截取低 32 位，再用 `word &= word - 1` 清亮位，最多 32 次。
      读回有符号值时，若最高位为 1，就从无符号值减去 2³²。

  # ===================== 阶段 3：树、堆、回溯、图 =====================
  - id: algo.tree-basics
    name: 二叉树与递归遍历
    stage: "3"
    group: 1
    prereqs: [py.node-class, py.recursion]
    card: |
      一个节点有值、左孩子和右孩子。树里的每个孩子又是一个更小问题的入口。
      用 `TreeNode(8, TreeNode(3), TreeNode(9))` 手建三节点树。计数先给空位置 0，再返回左右计数之和加 1。
      先记根、左右之间记根、最后记根，分别得到前序、中序、后序。每点走一次是 O(n)，调用栈深度是树高。
      **易错**：叶子仍有一个值；只有 None 是空树。层序数组中的 null 占据一个缺失的孩子位置。

  - id: algo.tree-postorder
    name: 自底向上返回信息
    stage: "3"
    group: 1
    prereqs: [algo.tree-basics, py.tuple]
    card: |
      等两棵子树都算完，再合并它们的回执，适合求高度、平衡或最长路径。先说清每个返回值的含义。
      若左右子树高度分别为 2、3，经过当前点的路径长 5 条边，向上延伸的高度是 4 个节点。
      用元组同时交回高度和内部最佳值，每个节点只合并一次，时间 O(n)，递归栈 O(h)。
      **易错**：父亲只能接一支；把已经拐弯的两支一起向上交，会把分叉算进一条路。

  - id: algo.tree-bfs
    name: 层序遍历（BFS）
    stage: "3"
    group: 1
    prereqs: [algo.tree-basics, py.deque]
    card: |
      当答案按深度分组，把根放进 deque，从左端取节点，把非空孩子从左到右放到右端。
      每轮用 `for _ in range(len(q))` 冻结本层宽度。若本轮开始有 2 项，即使新进了 3 项，也只取 2 项。
      层序遍历花 O(n) 时间，额外空间随最大层宽增长。每层最后取出的值构成右视图。
      **易错**：用“直到队列清空”划分一层，会把下一层一起取走。

  - id: algo.bst
    name: 二叉搜索树
    stage: "3"
    group: 1
    prereqs: [algo.tree-basics]
    card: |
      严格搜索树按整棵子树划分值域：左边都小，右边都大，中序访问得到递增序列。
      找 7 时遇到 10 就走左边。查找和插入走一条路径，代价 O(h)，斜树上可能达到 O(n)。
      验证时把祖先留下的开区间带下去。根 8 左侧的 3 若有右孩子，它必须落在 (3,8) 内。
      **易错**：只比较当前父子，会让这个位置错误地接受 10。

  - id: algo.nested-func
    name: 嵌套函数与 nonlocal
    stage: "3"
    group: 1
    prereqs: [py.recursion]
    card: |
      递归中多次更新同一份记录时，可在入口函数里定义 visit，让每次入口调用各管自己的一份状态。
      例如先令 `best = root.val`，在 visit 里声明 `nonlocal best`，然后比较并更新最大值。
      读外层变量或向外层列表 append 都无需重新绑定名字。遍历 n 个节点做 n 次比较。
      **易错**：初值设为 0，会把全负树的最大值算成树中不存在的数。

  - id: algo.heapq
    name: heapq 最小堆
    stage: "3"
    group: 2
    prereqs: [py.list-basics, py.tuple]
    card: |
      反复选当前最小项时，用 heapify 在 O(n) 时间建堆，再用 heappush / heappop 花 O(log n) 增删。
      堆顶 h[0] 最小，兄弟之间无需排序。先取最大整数时存负数，例如 −9 会在 −4 之前弹出。
      元组依次比较各字段。优先级相等时可放入唯一序号，避免继续比较无法排序的节点对象。
      **易错**：直接取 h[1] 当第二小，可能错过另一个孩子中更小的值。

  - id: algo.heap-topk
    name: 大小为 k 的堆
    stage: "3"
    group: 2
    prereqs: [algo.heapq]
    card: |
      求流中的前 k 大，把入围值存进最小堆。压入后若超过 k 项，淘汰最弱者。
      k=2 时读入 3、9、5，留下 5、9，堆顶 5 正是第二大。相同数值也各占一个名次。
      处理 n 项最多花 O(n log(k+1)) 时间，空间 O(k)。要求前 k 小时，淘汰方向相反。
      **易错**：装满 k 项就弹，会只留下 k−1 项；弹出的条件是超额。

  - id: algo.backtracking
    name: 回溯
    stage: "3"
    group: 3
    prereqs: [py.recursion-multi, py.list-pop, py.aliasing]
    card: |
      要列出全部可能时，先定义一条路径和每层能选的候选。选择、探索、撤销后，路径应回到本层起点。
      子集决定取舍，组合从 start 往后选，排列标记已用下标。重号先排序，仅在同层跳过等值候选。
      长 n 的 01 串有 2ⁿ 种，输出就需 O(n·2ⁿ)；未完成的路径长至多 n。
      **易错**：answers.append(path) 保存的是同一列表，路径改变时旧答案也变。存 path[:] 或拼好的字符串。

  - id: algo.grid-dfs
    name: 网格 DFS / BFS
    stage: "3"
    group: 4
    prereqs: [py.matrix-traverse, py.recursion]
    card: |
      求连通区域时，从种子向四邻扩展。先检查行列范围、地形和访问标记，再认领格子。
      入栈前标记，用列表反复 pop 是迭代 DFS；用 deque 从左端取是 BFS。都能数面积，不受通道递归深度影响。
      对每片未标陆地启动一次就能数岛。R×C 地图每格检查常数个方向，总时间 O(RC)。
      **易错**：对角相邻并不共享边；等搜索结束才涂色会在两个相邻陆格间来回走。

  - id: algo.graph-adj-list
    name: 邻接表建图
    stage: "3"
    group: 4
    prereqs: [py.dict-grouping]
    card: |
      边清单适合登记，邻接表适合回答“这个点能直接走到谁”。为每个点准备独立列表，包括孤立点。
      例如无向边 1—3 同时向表 1 添 3、向表 3 添 1。有向先后关系按箭头只记一次。
      全图遍历要用 visited；建表和遍历各花 O(V+E) 时间。没有边的编号仍算一个连通分量。
      **易错**：无向边只写一端会让连通答案依赖起点。

  - id: algo.graph-bfs
    name: BFS 求最短步数
    stage: "3"
    group: 4
    prereqs: [algo.graph-adj-list, py.deque]
    card: |
      每步等价且要最少步数时，用 deque 按距离从近到远扩展。起点距离为 0。
      第一次发现邻居时写入当前距离加 1，随即入队。多个出口同时以 0 入队，得到离最近出口的距离。
      邻接表上每点进队一次，时间 O(V+E)，队列和距离表用 O(V) 空间。
      **易错**：出队才标记会让一个点被重复安排。路有不同费用时，最少步数也可能更贵。

  - id: algo.topo-sort
    name: 拓扑排序
    stage: "3"
    group: 4
    prereqs: [algo.graph-bfs]
    card: |
      处理先后依赖时，入度表示还欠多少前置。先把全部入度为零的点加入队列。
      做完一个点，给它的后继逐一减 1；刚减为零才可加入。两门先修课须等两次解除。
      处理数小于 V 说明有环。邻接表上耗时 O(V+E)；同时就绪的点可任选，合法顺序可能很多。
      **易错**：只看有没有第一门可修，会漏掉别处卡住的一圈。

  - id: algo.union-find
    name: 并查集
    stage: "3"
    group: 4
    prereqs: [py.helper-func, py.list-basics]
    card: |
      边不断加入、查询是否同组时，每个成员保留父编号。沿 parent 走到认自己作父亲的代表。
      合并前先找两个代表；若不同，把小组的根接到大组的根，并累计大小。查找途中把父指针指向祖父能缩短以后路径。
      两个代表相同就已连通。按大小合并配合路径压缩，一串操作的均摊代价接近常数，额外空间 O(n)。
      **易错**：两个成员的直属父亲不同，仍可能有共同代表；普通并查集也不能直接撤销旧边。

  # ===================== 阶段 4：进阶 =====================
  - id: algo.trie
    name: 字典树
    stage: "4"
    group: 1
    prereqs: [py.dict-basics, py.class-basic]
    card: |
      **什么时候用**：常要查一批词的开头，或者在字格里同时找许多词时，让共同前缀共享节点。
      **怎样走**：从空根出发，每个字母沿一个字典键下降；插入时补建缺少的节点，在最后一层做词尾标记。
      插入 pear 和 pea 后，走到 pe 只能确定有这个前缀；走到 pea 能读到词尾，仍能沿 r 继续。
      普通查找平均只走词长 L 步，空间随不同前缀的数量增长。通配符要试多个分支，耗时随候选数增长。

  - id: algo.dijkstra
    name: Dijkstra 最短路
    stage: "4"
    group: 6
    prereqs: [algo.heapq, algo.graph-adj-list]
    card: |
      **什么时候用**：道路用时非负且长短不同，要问同一起点到各站的最低耗时。
      **怎样走**：距离表记目前的最低耗时。堆里取累计耗时最小的记录，若与表中不同就跳过；沿出边试算，更短才更新并入堆。
      直达要 8 分钟，绕行两段只要 2+1 分钟；第一次发现终点时还不能定案。
      普通图的堆实现约用 O((V+E) log V) 时间。负权会破坏出堆时定案的依据。

  - id: algo.mst
    name: 最小生成树
    stage: "4"
    group: 6
    prereqs: [algo.union-find, algo.heapq]
    card: |
      **什么时候用**：双向网络中只要把所有点接通，目标是所选边的总造价最低。
      **Prim**：从一个点建网，每步从跨越网内外的边中选最便宜的一条。接入新点后再添候选，跳过两端都已接入的旧记录。
      **Kruskal**：把边按造价排序，用并查集检验两端，属于不同组才连接。接通 n 个点恰需 n−1 条边。
      边价为 4、6、1 的三角形只付 1+4。排序选边用 O(E log E) 时间，Prim 的堆键是一条边的价格。

  - id: algo.memo-cache
    name: 记忆化搜索（@cache）
    stage: "4"
    group: 4
    prereqs: [py.recursion-multi, algo.nested-func]
    card: |
      **什么时候用**：递归树的不同分支反复询问同一个子问题，答案由参数完整决定。
      **四步**：定义状态 fib(i)，写出前两项相加的转移，给出 0、1 两个初值，再从目标递归到更小的 i。
      从 functools 导入 cache，给函数加 `@cache`。算 fib(5) 时只进入六种参数的函数体，时间、缓存及递归栈均为 O(n)。
      参数需可哈希。若剩余容量也会影响答案，应把它写进参数；换题或换输入时要使用对应的新缓存。

  - id: algo.dp-1d
    name: 一维 DP
    stage: "4"
    group: 4
    prereqs: [algo.memo-cache, py.list-concat-repeat]
    card: |
      **什么时候用**：用一个下标、前缀长度或金额就能说清子问题，许多选择会回到同一状态。
      **四步**：先写出 dp[i] 的含义，再列所有来路、给定起点的答案、按照依赖顺序计算。最后确认要读的下标。
      例如隔柜取物，前 i 柜最优值等于“不拿末柜”和“拿末柜加前 i−2 柜最优值”中的较大者。
      每柜只比较两项，总时间 O(n)。用两个变量同时更新可省去整张表。求计数时合并方案用加法，可达性用“或”。

  - id: algo.dp-2d
    name: 二维 DP
    stage: "4"
    group: 5
    prereqs: [algo.dp-1d, py.nested-list, py.list-comp]
    card: |
      **什么时候用**：一个位置不足以标识状态，例如需要行和列、区间的左右端，或某一天和持仓状态。
      **四步**：定义格子的两个坐标，列出来源，标好边界，画出依赖箭头决定先算谁。
      网格只许向下或向右时，到一格的路线数是上方加左方，起点为 1。m×n 格共用 O(mn) 时间。
      每行单独建列表。区间题往往先算短区间；交易题更新当天各状态时要同时读取昨天的值。

  - id: algo.dp-knapsack
    name: 背包 DP
    stage: "4"
    group: 5
    prereqs: [algo.dp-2d]
    card: |
      **什么时候用**：物品有重量或面值，要凑出目标容量，求是否可达、方案数或最优值。
      **四步**：状态是前 i 件与容量 s；转移为选或不选；只有空集时能凑出 0；再按物品逐轮填表。
      一件重量 3 的物品只能用一次，容量须倒序更新，否则刚得到的 3 又会被用来得到 6。供应无限则容量正序更新。
      n 件、目标 S 的表最多 O(nS) 次更新，滚动后占 O(S) 空间。计数组合时把面值放外层，以免把拿取顺序重复计数。

  - id: algo.dp-string
    name: 字符串 DP
    stage: "4"
    group: 5
    prereqs: [algo.dp-2d]
    card: |
      **什么时候用**：要比较两串文字，允许跳字、编辑或交错读取，子问题取决于两边已经读了多少字。
      **四步**：用 (i,j) 表示两个前缀的长度，按末字的关系写转移，留出空前缀的边界行列，再从短前缀往长前缀算。
      ax 与 ab 的最长公共后缀为 0；公共子序列允许跳过 x、b，长度为 1。先写清“连续”还是“可跳”，转移才有依据。
      两边各长 m、n 时有 O(mn) 对前缀。若只依赖上行和本行，可以滚动保存；需要还原路径时仍可能要留表。

  - id: algo.greedy
    name: 贪心
    stage: "4"
    group: 3
    prereqs: [py.sorted, py.running-max]
    card: |
      **什么时候用**：可以证明舍弃一个候选后，无论后面如何延伸，它都无法胜过留下的候选。
      **怎样走**：给当前最优写一句明确的含义，逐项更新，再与历史纪录比较。求非空连续段时，结尾最佳要在“只取当前数”和“接上旧段”中选。
      如 4、−8、5，前两项结尾最佳为 −4，遇到 5 应重开。每项一次比较，总时间 O(n)，只留常数个变量。
      换题要重新证明选择：面值 1、3、4 凑 6，先拿 4 就要三枚，最少只需两枚 3。

  - id: algo.intervals
    name: 区间问题
    stage: "4"
    group: 2
    prereqs: [py.sort-key]
    card: |
      **什么时候用**：覆盖范围、日程占用或最少删除时段，可以把每项抽成一对端点。
      **怎样走**：合并闭区间按起点排，维护当前最远右端；若新区间被包含，右端取较大值。排序加扫描用 O(n log n) 时间。
      [1,4] 与 [4,6] 共用刻度 4，可以合并。日程在结束时释放房间，开始等于上场结束就能交接。
      想保留最多个不冲突的时段，优先选结束早的；想求房间数，按起点扫描并用堆维护仍在占用的结束时间。

  # ===================== 阶段 5：面试混合 =====================
  - id: algo.try-except
    name: 异常处理
    stage: "5"
    prereqs: [py.helper-func]
    card: |
      **什么时候用**：用户输入的文字可能不合格式，但调用者需要一个可用的默认值。
      例如 `int("8盏")` 会抛出 ValueError。把转换放进 try，在 except ValueError 中返回默认值。转换成功会跳过 except，包括成功读到 0 的情况。
      只包住可能因输入出错的几行。过宽的捕获会把程序自己写错的变量名也当成输入错误。分隔一行长 n 的配置需要 O(n) 时间。

  - id: algo.generator
    name: 生成器（yield）
    stage: "5"
    prereqs: [py.genexp]
    card: |
      **什么时候用**：下一项的来源已知，调用者可能只读开头几项。调用含 yield 的函数会得到一个可逐次读取的生成器。
      `yield x` 交出一个值并暂停，下一次 next 从暂停处继续。用 for 可以一直读到结束。递归时用 yield from 依次交出子生成器的值。
      例如按层嵌套的 [1, [2, 3]] 会依次交出 1、2、3。遍历全部节点用 O(n) 时间，递归只须保存深度 h 的调用位置。想从头再读，应重新创建生成器。

  - id: algo.oop-design
    name: 多级递进设计
    stage: "5"
    prereqs: [algo.class-design]
    card: |
      **什么时候用**：一串调用共享数据，新需求还要遵守旧接口。先写出操作前后必须成立的约定，再决定对象保存哪些字段。
      键值库先用字典做读写，平均 O(1)。例如 set("a", 0) 后仍然有键 a，不能根据值的真假判断键是否存在。
      加 TTL 时，每条记录还要记失效时刻；读取、删除和前缀筛选应对同一时刻得出一致的可见性。保存快照时复制记录和剩余寿命，否则后续修改会污染旧快照。
