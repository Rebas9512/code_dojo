id: algo-2-l06-bit-width
title: 只看需要的那些二进制位
track: algo
skills:
- algo.bit-ops
steps:
- type: read
  skill: algo.bit-ops
  md: |-
    看到开关、成对抵消或固定宽度寄存器，可以把整数按二进制逐位看。最低位编号为 0。与 & 只留下两边都亮的格，或 | 保留任一边亮的格，异或 ^ 保留两边不同的格。例如 110 和 011 的与、或、异或依次是 010、111、101。相同整数异或两次会抵消。左移在低端补零，取第 i 位可写 (x >> i) & 1。

    数亮位时，x & (x-1) 每轮清掉最低的一个 1。循环次数等于亮位数；固定 32 位最多 32 轮。一串 n 个固定宽度整数逐个异或要 O(n) 时间、O(1) 额外空间。Python 的整数可随数值变长，不能把任意长整数的位操作都看成常数开销。

    **负数右移足够久会变成零**在 Python 中会出错：-1 >> 1 仍是 -1。题意指定 32 位时先取 x & 0xffffffff，只处理低 32 位；若要读回有符号数，最高位为 1 时从结果减 2³²。示例用 4 位让每一格都看得见。
- type: example
  skill: algo.bit-ops
  code: |
    # ① 只留下低四位：-2 的低四位是 1110
    word = -2 & 0b1111
    print(word, -1 >> 1)
    # ② 每次清掉最低的一个亮位
    while word:
        word = word & (word - 1)
        print(word)
    # ③ 再取 1110 的第 1 位
    print((14 >> 1) & 1)

    # 输出
    # 14 -1
    # 12
    # 8
    # 0
    # 1
  md: |-
    | 清除次数 | 0 | 1 | 2 | 3 |
    |---|---|---|---|---|
    | 剩余的四位 | 1110 | 1100 | 1000 | 0000 |

    把掩码从 0b1111 改成 0b111，再看需要清几次。
- type: quiz
  skill: algo.bit-ops
  q: 原样对 -1 反复右移一位，最终会怎样？
  options:
  - 一次后变成 0
  - 一直是 -1
  answer: 1
  explain: 负数右移会延续符号位。要数固定宽度的位，先用该宽度的掩码。
- type: quiz
  skill: algo.bit-ops
  q: 要找两个都只出现一次的编号，其余都成对，只返回全部数的异或够吗？
  options:
  - 够，异或值就是两个编号
  - 不够，异或值合并了两个编号的信息
  answer: 1
  explain: 3 和 5 异或是 6；2 和 4 异或也为 6，还需要额外分组才能区分。
