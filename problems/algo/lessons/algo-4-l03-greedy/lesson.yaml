id: algo-4-l03-greedy
title: 一个选择能否一直保留
track: algo
skills:
- algo.greedy
steps:
- type: read
  skill: algo.greedy
  md: |
    需要最大收益或最少步数时，先问能不能在当前位置就排除一类选择。只有能解释“以后接上同一段，刚刚被丢弃的选择一定不会更好”，才能放心只留一个候选。求非空连续段的最大和时，把终点固定在今天：昨天结束的两段若一大一小，再加今天的同一个数，大小不会反转。昨天的最佳和若为负，还不如从今天重新开始。

    扫描时分别记“必须在这里结束”的收益与“到目前为止出现过”的最高收益。每项看一次，时间 O(n)，额外空间 O(1)。结论依赖这个问题的结构，换成凑最少硬币，优先拿面值最大的币就可能输给两枚较小的币。
- type: example
  skill: algo.greedy
  code: |
    # ① 第一项本身就是一个合法的非空段
    nums = [-3, 5, -8, 4]
    ending = best = nums[0]
    for x in nums[1:]:
        # ② 在接上旧段与从这里起步之间挑选
        ending = max(x, ending + x)
        # ③ 在所有结束位置间更新纪录
        best = max(best, ending)
        print(ending, best)

    # 输出
    # 5 5
    # -3 5
    # 4 5
  md: |
    | 读到 | 接上会得 | 重开会得 | 这里结束的最优 |
    |---|---|---|---|
    | 5 | 2 | 5 | 5 |
    | −8 | −3 | −8 | −3 |
    | 4 | 1 | 4 | 4 |

    把列表换为三个负数，检查历史纪录从哪一项开始。
- type: quiz
  skill: algo.greedy
  q: 刚读完 −8，结尾最佳为 −3，历史最佳为 5。下一项 4 到来时可以接在哪个值后面？
  options:
  - 5，因为历史收益最高
  - −3，因为旧段必须与 4 相邻
  answer: 1
  explain: 接上历史最佳会跨过 −8，使区间中间断开。
- type: quiz
  skill: algo.greedy
  q: 用 1、3、4 凑 6 且要枚数最少，先拿 4 行吗？
  options:
  - 总能得到最少枚数
  - 这次会多用一枚
  answer: 1
  explain: 4+1+1 用三枚，3+3 只用两枚。
