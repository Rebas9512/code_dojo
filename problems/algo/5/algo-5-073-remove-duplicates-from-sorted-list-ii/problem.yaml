wrong_examples:
- why: 保留了重复组的最后一份。
  code: |
    def singles(head: ListNode | None) -> ListNode | None:
        dummy = ListNode(0, head)
        tail = dummy
        while head:
            first = head
            while head.next and head.next.val == first.val:
                head = head.next
            if first is head:
                tail = head
            else:
                tail.next = head
            head = head.next
        return dummy.next
