- why: 追加写被实现为覆盖，文件只剩最后一段。
  code: |
    class Archive:
        def __init__(self):
            self.root = {}

        def _directory(self, path):
            node = self.root
            for name in path.split("/"):
                if name:
                    node = node[name]
            return node

        def mkdir(self, path: str) -> None:
            node = self.root
            for name in path.split("/"):
                if name:
                    node = node.setdefault(name, {})

        def ls(self, path: str) -> list[str]:
            node = self._directory(path)
            if isinstance(node, list):
                return [path.rsplit("/", 1)[-1]]
            return sorted(node)

        def addContentToFile(self, path: str, content: str) -> None:
            parent, _, name = path.rpartition("/")
            directory = self._directory(parent)
            directory[name] = [content]

        def readContentFromFile(self, path: str) -> str:
            return "".join(self._directory(path))
