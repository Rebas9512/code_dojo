- why: 沿着下降的一侧寻找峰顶。
  code: |
    def find_peak(nums: list[int]) -> int:
        lo, hi = 0, len(nums) - 1
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] > nums[mid + 1]:
                lo = mid + 1
            else:
                hi = mid
        return lo
