  code: |
    class MemoryStore:
        def __init__(self):
            self.records = {}

        def set(self, key: str, value: int) -> None:
            self.records[key] = value

        def get(self, key: str) -> int | None:
            return self.records.get(key)

        def delete(self, key: str) -> bool:
            return self.records.pop(key, None) != 0
