- why: 把单个刻度也输出成区间。
  code: |
    def ranges(nums: list[int]) -> list[str]:
        out = []
        i = 0
        while i < len(nums):
            first = nums[i]
            while i + 1 < len(nums) and nums[i + 1] == nums[i] + 1:
                i += 1
            last = nums[i]
            out.append(f"{first}->{last}" if first == last else f"{first}->{last}")
            i += 1
        return out
