wrong_examples:
- why: 把共享端点的闭区间当成需要分开扫描。
  code: |
    def fewest(spans: list[list[int]]) -> int:
        point = None
        count = 0
        for a, b in sorted(spans, key=lambda span: span[1]):
            if point is None or a >= point:
                point = b
                count += 1
        return count
