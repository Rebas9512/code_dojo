- why: 比较原值忽略负数平方后的大小。
  code: |
    def squares(nums: list[int]) -> list[int]:
        left, right = 0, len(nums) - 1
        out = [0] * len(nums)
        for i in range(right, -1, -1):
            if nums[left] > nums[right]:
                out[i] = nums[left] ** 2
                left += 1
            else:
                out[i] = nums[right] ** 2
                right -= 1
        return out
