- why: 只选总和更小的组合，忽略与目标的距离。
  code: |
    def closest(nums: list[int], target: int) -> int:
        nums.sort()
        best = sum(nums[:3])
        for i in range(len(nums) - 2):
            left, right = i + 1, len(nums) - 1
            while left < right:
                total = nums[i] + nums[left] + nums[right]
                if total < best:
                    best = total
                if total == target:
                    return total
                if total < target:
                    left += 1
                else:
                    right -= 1
        return best
