- why: 更新了两轮状态，却只交回一轮利润。
  code: |
    def profit(prices: list[int]) -> int:
        buy1 = buy2 = -prices[0]
        sell1 = sell2 = 0
        for price in prices:
            buy1 = max(buy1, -price)
            sell1 = max(sell1, buy1 + price)
            buy2 = max(buy2, sell1 - price)
            sell2 = max(sell2, buy2 + price)
        return sell1
