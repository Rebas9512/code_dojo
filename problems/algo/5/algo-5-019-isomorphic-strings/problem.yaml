wrong_examples:
- why: 只查同一源字符的一致性，遗漏目标端冲突。
  code: |
    def same_shape(s: str, t: str) -> bool:
        forward = {}
        taken = set()
        for a, b in zip(s, t):
            if a in forward:
                if forward[a] != b:
                    return False
            else:
                if a in forward:
                    return False
                forward[a] = b
                taken.add(b)
        return True
