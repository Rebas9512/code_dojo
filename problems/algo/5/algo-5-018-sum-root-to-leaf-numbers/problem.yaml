- why: 沿路累加数字，没有给前缀升位。
  code: |
    def sum_numbers(root: TreeNode) -> int:
        def visit(node, prefix):
            if node is None:
                return 0
            current = prefix + node.val
            if not node.left and not node.right:
                return current
            return visit(node.left, current) + visit(node.right, current)

        return visit(root, 0)
