- why: 相接端点被误当成冲突。
  code: |
    import bisect


    def earn(start: list[int], end: list[int], pay: list[int]) -> int:
        jobs = sorted(zip(end, start, pay))
        ends = []
        best = [0]
        for finish, begin, fee in jobs:
            count = bisect.bisect_left(ends, begin)
            best.append(max(best[-1], best[count] + fee))
            ends.append(finish)
        return best[-1]
