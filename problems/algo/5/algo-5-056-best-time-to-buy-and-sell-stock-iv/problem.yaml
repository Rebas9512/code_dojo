- why: 再次买入时没有消耗新的交易额度。
  code: |
    def profit(k: int, prices: list[int]) -> int:
        if k >= len(prices) // 2:
            return sum(max(0, b - a) for a, b in zip(prices, prices[1:]))
        buy = [-prices[0]] * (k + 1)
        sell = [0] * (k + 1)
        for price in prices:
            for t in range(1, k + 1):
                buy[t] = max(buy[t], sell[t] - price)
                sell[t] = max(sell[t], buy[t] + price)
        return sell[k]
