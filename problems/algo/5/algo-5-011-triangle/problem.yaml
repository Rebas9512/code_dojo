- why: 每层只允许直下，遗漏另一条合法路线。
  code: |
    def min_total(rows: list[list[int]]) -> int:
        best = rows[-1].copy()
        for row in reversed(rows[:-1]):
            for j, value in enumerate(row):
                best[j] = value + best[j]
        return best[0]
