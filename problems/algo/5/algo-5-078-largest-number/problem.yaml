- why: 只比较卡面字典序，在一张卡是另一张前缀时会排错。
  code: |
    from functools import cmp_to_key


    def largest(nums: list[int]) -> str:
        def compare(a, b):
            if a > b:
                return -1
            if a + b < b + a:
                return 1
            return 0

        parts = sorted((str(n) for n in nums), key=cmp_to_key(compare))
        return "0" if parts[0] == "0" else "".join(parts)
