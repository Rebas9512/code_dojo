  code: |
    def roman(value: int) -> str:
        symbols = [
            (1000, "M"),
            (900, "CM"),
            (500, "D"),
            (400, "CD"),
            (100, "C"),
            (90, "XC"),
            (50, "L"),
            (40, "XL"),
            (10, "X"),
            (9, "VIIII"),
            (5, "V"),
            (4, "IV"),
            (1, "I"),
        ]
        out = []
        for size, mark in symbols:
            copies, value = divmod(value, size)
            out.append(mark * copies)
        return "".join(out)
