wrong_examples:
- why: 从出口扩展时少算一步。
  code: |
    from collections import deque


    def fill_exits(grid: list[list[int]]) -> None:
        queue = deque((r,c) for r,row in enumerate(grid) for c,v in enumerate(row) if v == 0)
        while queue:
            r, c = queue.popleft()
            for dr, dc in ((0,1), (0,-1), (1,0), (-1,0)):
                nr, nc = r + dr, c + dc
                if (0 <= nr < len(grid) and 0 <= nc < len(grid[0])
                        and grid[nr][nc] == 2147483647):
                    grid[nr][nc] = grid[r][c]
                    queue.append((nr,nc))


    def run_case(grid: list[list[int]]) -> list[list[int]]:
        fill_exits(grid)
        return grid
- why: 从每个空位单独出发找出口，多次经过同样的格子。
  code: |
    from collections import deque


    def fill_exits(grid: list[list[int]]) -> None:
        rows, cols = len(grid), len(grid[0])
        def distance(r, c):
            seen = {(r,c)}
            queue = deque([(r,c,0)])
            while queue:
                r, c, steps = queue.popleft()
                if grid[r][c] == 0:
                    return steps
                for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)):
                    nr, nc = r+dr, c+dc
                    if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != -1 and (nr,nc) not in seen:
                        seen.add((nr,nc))
                        queue.append((nr,nc,steps+1))
            return 2147483647
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] == 2147483647:
                    grid[r][c] = distance(r,c)


    def run_case(grid: list[list[int]]) -> list[list[int]]:
        fill_exits(grid)
        return grid
