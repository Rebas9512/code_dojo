entry: tree_max
signature: 'def tree_max(root: TreeNode) -> int:'
compare: exact
convert:
  args:
    '0': treenode
wrong_examples:
- why: 把最大值初始化为零。
  code: |
    def tree_max(root: TreeNode) -> int:
        best = 0
        def visit(node):
            nonlocal best
            if node:
                best = max(best, node.val)
                visit(node.left)
                visit(node.right)
        visit(root)
        return best
