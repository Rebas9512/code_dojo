- why: 把每一个节点都当作单独的一层。
  code: |
    from collections import deque


    def levels(root: TreeNode | None) -> list[list[int]]:
        if root is None:
            return []
        queue = deque([root])
        result = []
        while queue:
            layer = []
            for _ in range(1):
                node = queue.popleft()
                layer.append(node.val)
                if node.left:
                    queue.append(node.left)
                if node.right:
                    queue.append(node.right)
            result.append(layer)
        return result
