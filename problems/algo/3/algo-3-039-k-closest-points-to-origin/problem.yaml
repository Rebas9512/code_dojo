- why: 堆顶放最近点，超限反而淘汰了它。
  code: |
    import heapq


    def closest(points: list[list[int]], k: int) -> list[list[int]]:
        kept = []
        for x, y in points:
            heapq.heappush(kept, (x*x + y*y, x, y))
            if len(kept) > k:
                heapq.heappop(kept)
        return [[x, y] for _, x, y in kept]
hints:
- 比较平方距离就足够。需要淘汰的是最远点，堆里的距离该取什么符号？
