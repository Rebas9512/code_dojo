wrong_examples:
- why: 弹出第一个节点前就跳过了一个名次。
  code: |
    def kth_value(root: TreeNode, k: int) -> int:
        stack = []
        node = root
        while node or stack:
            while node:
                stack.append(node)
                node = node.left
            node = stack.pop()
            k -= 1
            if k == 1:
                return node.val
            node = node.right
