wrong_examples:
- why: 同值牌即使前一枚已经被使用也跳过。
  code: |
    def arrangements(nums: list[int]) -> list[list[int]]:
        nums = sorted(nums)
        result, path = [], []
        used = [False] * len(nums)
        def fill():
            if len(path) == len(nums):
                result.append(path[:])
                return
            for i, value in enumerate(nums):
                if used[i]:
                    continue
                if i > 0 and value == nums[i - 1] :
                    continue
                used[i] = True
                path.append(value)
                fill()
                path.pop()
                used[i] = False
        fill()
        return result
