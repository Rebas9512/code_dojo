wrong_examples:
- why: 一条分支占用的位置在退回后仍被标记。
  code: |
    def arrangements(nums: list[int]) -> list[list[int]]:
        result, path = [], []
        used = [False] * len(nums)
        def fill():
            if len(path) == len(nums):
                result.append(path[:])
                return
            for i, value in enumerate(nums):
                if used[i]:
                    continue
                used[i] = True
                path.append(value)
                fill()
                path.pop()
                pass
        fill()
        return result
