wrong_examples:
- why: 只比对候选根的值。
  code: |
    def same(a: TreeNode | None, b: TreeNode | None) -> bool:
        if a is None or b is None:
            return a is b
        return a.val == b.val and same(a.left, b.left) and same(a.right, b.right)

    def contains_tree(root: TreeNode | None, sub: TreeNode) -> bool:
        if root is None:
            return False
        return root.val == sub.val or contains_tree(root.left, sub) or contains_tree(root.right, sub)
hints:
- 只要候选根匹配，还要把两侧的形状一路比到空位置。值出现多次时，每个匹配位置都可能是起点。
