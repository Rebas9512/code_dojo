wrong_examples:
- why: 只数路，漏查村子是否全部连通。
  code: |
    def components(n: int, edges: list[list[int]]) -> int:
        neighbors = [[] for _ in range(n)]
        for a, b in edges:
            neighbors[a].append(b)
            neighbors[b].append(a)
        seen = set()
        groups = 0
        for start in range(n):
            if start in seen:
                continue
            groups += 1
            stack = [start]
            seen.add(start)
            while stack:
                node = stack.pop()
                for other in neighbors[node]:
                    if other not in seen:
                        seen.add(other)
                        stack.append(other)
        return groups

    def road_tree(n: int, roads: list[list[int]]) -> bool:
        return len(roads) == n - 1
hints:
- 边数正好等于村数减一，还要排除一边有环、另一边孤立的情形。
