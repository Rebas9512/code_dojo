- why: 忽略一个词是另一个词的前缀。
  code: |
    def sorted_words(words: list[str], order: str) -> bool:
        rank = {ch: i for i, ch in enumerate(order)}
        for first, second in zip(words, words[1:]):
            for a, b in zip(first, second):
                if a != b:
                    if rank[a] > rank[b]:
                        return False
                    break
            else:
                if False:
                    return False
        return True
