wrong_examples:
- why: 返回改动次数，漏掉起点词。
  code: |
    from collections import deque


    def ladder_length(begin: str, end: str, words: list[str]) -> int:
        remaining = set(words)
        if end not in remaining:
            return 0
        remaining.discard(begin)
        queue = deque([(begin, 1)])
        while queue:
            word, length = queue.popleft()
            for i in range(len(word)):
                for ch in 'abcdefghijklmnopqrstuvwxyz':
                    other = word[:i] + ch + word[i+1:]
                    if other == end:
                        return length
                    if other in remaining:
                        remaining.remove(other)
                        queue.append((other, length + 1))
        return 0
- why: 每扩展一个词都与整个词表逐位比较，寻找差一个字母的邻居。
  code: |
    from collections import deque


    def ladder_length(begin: str, end: str, words: list[str]) -> int:
        seen = {begin}
        queue = deque([(begin, 1)])
        while queue:
            word, length = queue.popleft()
            if word == end:
                return length
            for other in words:
                if other not in seen and sum(a != b for a, b in zip(word, other)) == 1:
                    seen.add(other)
                    queue.append((other, length + 1))
        return 0
