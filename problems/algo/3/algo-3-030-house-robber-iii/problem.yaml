wrong_examples:
- why: 选父节点时也选两个孩子。
  code: |
    def rob(root: TreeNode | None) -> int:
        def choose(node):
            if not node:
                return 0, 0
            left_skip, left_take = choose(node.left)
            right_skip, right_take = choose(node.right)
            skip = max(left_skip, left_take) + max(right_skip, right_take)
            take = node.val + left_take + right_take
            return skip, take
        return max(choose(root))
- why: 对同一孙子树反复尝试取与不取，长链中出现大量重复调用。
  code: |
    def rob(root: TreeNode | None) -> int:
        if not root:
            return 0
        take = root.val
        for child in (root.left, root.right):
            if child:
                take += rob(child.left) + rob(child.right)
        return max(take, rob(root.left) + rob(root.right))
hints:
