wrong_examples:
- why: 把异或换成普通加法。
  code: |
    def subset_xor_sum(nums: list[int]) -> int:
        def visit(i, value):
            if i == len(nums):
                return value
            return visit(i + 1, value) + visit(i + 1, value + nums[i])
        return visit(0, 0)
