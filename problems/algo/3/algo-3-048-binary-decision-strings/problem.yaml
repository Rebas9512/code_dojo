wrong_examples:
- why: 只探索 1 开头的选择。
  code: |
    def bit_strings(n: int) -> list[str]:
        answers, path = [], []
        def visit():
            if len(path) == n:
                answers.append(''.join(path))
                return
            for digit in '1':
                path.append(digit)
                visit()
                path.pop()
        visit()
        return answers
