wrong_examples:
- why: 把空路线的零分当作有效答案。
  code: |
    def max_path_sum(root: TreeNode) -> int:
        best = 0
        def gain(node):
            nonlocal best
            if node is None:
                return 0
            left = max(0, gain(node.left))
            right = max(0, gain(node.right))
            best = max(best, node.val + left + right)
            return node.val + max(left, right)
        gain(root)
        return best
hints:
- 分开记录能向上接的单支和能在当前点拐弯的路径。全是负数时仍要取一个真实节点。
