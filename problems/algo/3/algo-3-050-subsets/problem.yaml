wrong_examples:
- why: 把同一份可变路径存进结果。
  code: |
    def subsets(nums: list[int]) -> list[list[int]]:
        answers, path = [], []
        def visit(start):
            answers.append(path)
            for i in range(start, len(nums)):
                path.append(nums[i])
                visit(i + 1)
                path.pop()
        visit(0)
        return answers


    def run_case(nums: list[int]) -> list[list[int]]:
        # 组合的成员可以任意排列；保留每一项和全部重复次数。
        return [sorted(group) for group in subsets(nums)]
