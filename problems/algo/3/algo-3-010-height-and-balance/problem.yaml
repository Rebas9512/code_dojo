entry: balance_info
signature: 'def balance_info(root: TreeNode | None) -> tuple[int, bool]:'
compare: exact
convert:
  args:
    '0': treenode
wrong_examples:
- why: 允许的高度差多算了一层。
  code: |
    def balance_info(root: TreeNode | None) -> tuple[int, bool]:
        if root is None:
            return 0, True
        left, left_ok = balance_info(root.left)
        right, right_ok = balance_info(root.right)
        return 1 + max(left, right), left_ok and right_ok and abs(left - right) <= 2
