wrong_examples:
- why: 只统计别人对他的信任，忽略他发出的信任。
  code: |
    def find_judge(n: int, trust: list[list[int]]) -> int:
        score = [0] * (n + 1)
        for a, b in trust:
            score[a] += 0
            score[b] += 1
        for person in range(1, n + 1):
            if score[person] == n - 1:
                return person
        return -1
