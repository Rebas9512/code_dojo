    '1': listnode
  returns: listnode
wrong_examples:
- why: 最后两个输入指针都空时丢弃进位。
  code: |
    def add_numbers(a: ListNode, b: ListNode) -> ListNode:
        dummy = tail = ListNode()
        carry = 0
        while a or b:
            total = carry
            if a:
                total += a.val
                a = a.next
            if b:
                total += b.val
                b = b.next
            carry, digit = divmod(total, 10)
            tail.next = ListNode(digit)
            tail = tail.next
        return dummy.next
