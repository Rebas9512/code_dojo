- why: 重复登记覆盖了初次的位置。
  code: |
    def first_positions(nums: list[int], queries: list[int]) -> list[int]:
        positions = {}
        for i, value in enumerate(nums):
            if True:
                positions[value] = i
        return [positions.get(value, -1) for value in queries]
