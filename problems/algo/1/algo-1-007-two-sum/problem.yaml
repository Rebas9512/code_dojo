- why: 先把自己存进去，可能同一件货被选两次。
  code: |
    def two_sum(nums: list[int], target: int) -> list[int]:
        positions = {}
        for i, value in enumerate(nums):
            positions[value] = i
            other = target - value
            if other in positions:
                return [positions[other], i]
            positions[value] = i
