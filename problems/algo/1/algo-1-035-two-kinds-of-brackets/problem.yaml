entry: match_pairs
signature: 'def match_pairs(text: str) -> bool:'
compare: exact
wrong_examples:
- why: 忽略栈空时可能先遇到右括号。
  code: |
    def match_pairs(text: str) -> bool:
        pairs = {')': '(', ']': '['}

        stack = []
        for char in text:
            if char in pairs:
                if stack.pop() != pairs[char]:
                    return False
            else:
                stack.append(char)
        return not stack
