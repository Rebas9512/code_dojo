wrong_examples:
- why: 把栈顶值当作整栈最小值。
  code: |
    class MinStack:
        def __init__(self):
            self.stack = []

        def push(self, val: int) -> None:
            smallest = min(val, self.stack[-1][1]) if self.stack else val
            self.stack.append((val, smallest))

        def pop(self) -> None:
            self.stack.pop()

        def top(self) -> int:
            return self.stack[-1][0]

        def getMin(self) -> int:
            return self.stack[-1][0]
