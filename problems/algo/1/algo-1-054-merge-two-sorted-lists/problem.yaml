wrong_examples:
- why: 只接共同处理的部分，遗漏较长一边的尾部。
  code: |
    def merge_lists(a: ListNode | None, b: ListNode | None) -> ListNode | None:
        dummy = tail = ListNode()
        while a and b:
            if a.val <= b.val:
                tail.next = a
                a = a.next
            else:
                tail.next = b
                b = b.next
            tail = tail.next
        tail.next = None
        return dummy.next
