entry: longest_consecutive
signature: 'def longest_consecutive(nums: list[int]) -> int:'
compare: exact
wrong_examples:
- why: 从每个数重新数到尾，连续长段会超时。
  code: |
    def longest_consecutive(nums: list[int]) -> int:
        values = set(nums)
        best = 0
        for start in values:
            end = start
            while end in values:
                end += 1
            best = max(best, end - start)
        return best
