signature: 'def describe_list(head: ListNode | None) -> list:'
compare: exact
convert:
  args:
    '0': listnode
wrong_examples:
- why: 要求还有后继才处理，最后一个节点被漏掉。
  code: |
    def describe_list(head: ListNode | None) -> list:
        values = []
        node = head
        while node is not None and node.next is not None:
            values.append(node.val)
            node = node.next
        return [len(values), values]
