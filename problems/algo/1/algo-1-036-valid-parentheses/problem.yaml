entry: is_valid
signature: 'def is_valid(text: str) -> bool:'
compare: exact
wrong_examples:
- why: 把取栈顶写成从栈底取。
  code: |
    def is_valid(text: str) -> bool:
        pairs = {')': '(', ']': '[', '}': '{'}

        stack = []
        for char in text:
            if char in pairs:
                if not stack or stack.pop(0) != pairs[char]:
                    return False
            else:
                stack.append(char)
        return not stack
