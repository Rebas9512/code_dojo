- why: 出栈还有人在排队时就把新队尾压上去。
  code: |
    class MyQueue:
        def __init__(self):
            self.inbox = []
            self.outbox = []

        def push(self, x: int) -> None:
            self.inbox.append(x)

        def _prepare(self) -> None:
            if self.inbox:
                while self.inbox:
                    self.outbox.append(self.inbox.pop())

        def pop(self) -> int:
            self._prepare()
            return self.outbox.pop()

        def peek(self) -> int:
            self._prepare()
            return self.outbox[-1]

        def empty(self) -> bool:
            return not self.inbox and not self.outbox
