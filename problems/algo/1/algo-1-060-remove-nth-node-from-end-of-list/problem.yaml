wrong_examples:
- why: 删除旧头后仍返回旧头。
  code: |
    def remove_nth(head: ListNode, n: int) -> ListNode | None:
        dummy = ListNode(0, head)
        front = back = dummy
        for _ in range(n):
            front = front.next
        while front.next:
            front = front.next
            back = back.next
        back.next = back.next.next
        return head
