- why: 重复使用同一个列表作所有桶。
  code: |
    from collections import Counter


    def frequency_buckets(nums: list[int]) -> list[list[int]]:
        counts = Counter(nums)
        buckets = [[]] * (len(nums) + 1)
        for value, count in counts.items():
            buckets[count].append(value)
        return buckets
