- why: 条件写反，第一次加入会被跳过。
  code: |
    class TinySet:
        def __init__(self):
            self.values = []

        def contains(self, x: int) -> bool:
            return x in self.values

        def add(self, x: int) -> None:
            if self.contains(x):
                self.values.append(x)
