wrong_examples:
- why: 仍返回可能已经删除的旧头。
  code: |
    def unlink_value(head: ListNode | None, x: int) -> ListNode | None:
        dummy = ListNode(0, head)
        previous = dummy
        while previous.next:
            if previous.next.val == x:
                previous.next = previous.next.next
            else:
                previous = previous.next
        return head
