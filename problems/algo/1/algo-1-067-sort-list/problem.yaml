    def sort_list(head: ListNode | None) -> ListNode | None:
        if not head or not head.next:
            return head
        slow = head
        fast = head.next
        while fast and fast.next:
            slow = slow.next
            fast = fast.next.next
        second = slow.next
        slow.next = None
        return sort_list(head)
- why: 每插入一个节点都从有序链的头开始找位置，递增输入使查找总耗时呈平方增长。
  code: |
    def sort_list(head: ListNode | None) -> ListNode | None:
        dummy = ListNode()
        while head:
            following = head.next
            previous = dummy
            while previous.next and previous.next.val <= head.val:
                previous = previous.next
            head.next = previous.next
            previous.next = head
            head = following
        return dummy.next
