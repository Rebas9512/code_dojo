- why: 多转一圈，使旧队首仍在最前。
  code: |
    from collections import deque


    class MyStack:
        def __init__(self):
            self.queue = deque()

        def push(self, x: int) -> None:
            self.queue.append(x)
            for _ in range(len(self.queue)):
                self.queue.append(self.queue.popleft())

        def pop(self) -> int:
            return self.queue.popleft()

        def top(self) -> int:
            return self.queue[0]

        def empty(self) -> bool:
            return not self.queue
