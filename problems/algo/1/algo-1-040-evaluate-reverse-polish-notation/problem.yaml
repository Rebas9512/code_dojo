wrong_examples:
- why: 用向下取整处理了负数除法。
  code: |
    def eval_rpn(tokens: list[str]) -> int:
        stack = []
        for token in tokens:
            if token not in ('+', '-', '*', '/'):
                stack.append(int(token))
                continue
            right = stack.pop()
            left = stack.pop()
            if token == '+':
                value = left + right
            elif token == '-':
                value = left - right
            elif token == '*':
                value = left * right
            else:
                value = left // right
            stack.append(value)
        return stack.pop()
