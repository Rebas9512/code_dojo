wrong_examples:
- why: 用值相等判定相遇，多个节点可保存一样的值。
  code: |
    def has_cycle(head: ListNode | None) -> bool:
        slow = fast = head
        while fast and fast.next:
            slow = slow.next
            fast = fast.next.next
            if fast and slow.val == fast.val:
                return True
        return False


    def run_case(head: ListNode | None, pos: int) -> bool:

        nodes = []
        node = head
        while node:
            nodes.append(node)
            node = node.next
        if pos >= 0:
            nodes[-1].next = nodes[pos]
        return has_cycle(head)
