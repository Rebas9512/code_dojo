signature: 'def find_duplicate(nums: list[int]) -> int:'
compare: exact
wrong_examples:
- why: 第一次快慢相遇就结束，可能落在环内其他号码。
  code: |
    def find_duplicate(nums: list[int]) -> int:
        slow = nums[0]
        fast = nums[nums[0]]
        while slow != fast:
            slow = nums[slow]
            fast = nums[nums[fast]]
        probe = slow
        while probe != slow:
            probe = nums[probe]
            slow = nums[slow]
        return probe
