- why: 用一次 if 替代循环，同一新值只唤醒一个位置。
  code: |
    def next_greater(nums: list[int]) -> list[int]:
        answer = [-1] * len(nums)
        pending = []
        for i, value in enumerate(nums):
            if pending and nums[pending[-1]] < value:
                previous = pending.pop()
                answer[previous] = value
            pending.append(i)
        return answer
