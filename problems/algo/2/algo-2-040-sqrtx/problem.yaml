wrong_examples:
- why: 把第一个过大的数直接当根。
  code: |
    def integer_sqrt(x: int) -> int:
        lo, hi = 0, x + 1
        while lo < hi:
            mid = (lo + hi) // 2
            if mid * mid <= x:
                lo = mid + 1
            else:
                hi = mid
        return lo
