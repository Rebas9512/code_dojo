  code: |
    def lower_bound(nums: list[int], x: int) -> int:
        lo, hi = 0, len(nums)
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] < x:
                lo = mid + 1
            else:
                hi = mid
        return lo


    def search(nums: list[int], target: int) -> int:
        pos = lower_bound(nums, target)
        if pos < len(nums):
            return pos
        return -1
hints:
- 先按 [lo,hi) 手写查第一个不小于目标的位置。
- 返回前还要核对下标和数值，可以用课里的例子追踪每一步。
