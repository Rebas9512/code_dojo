wrong_examples:
- why: 最后一人漏发船。
  code: |
    def boat_count(people: list[int], limit: int) -> int:
        weights = sorted(people)
        left, right = 0, len(weights) - 1
        boats = 0
        while left < right:
            if weights[left] + weights[right] <= limit:
                left += 1
            right -= 1
            boats += 1
        return boats
