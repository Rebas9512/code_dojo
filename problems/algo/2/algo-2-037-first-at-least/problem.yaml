wrong_examples:
- why: 把相等位置一并越过。
  code: |
    def lower_bound(nums: list[int], x: int) -> int:
        lo, hi = 0, len(nums)
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] <= x:
                lo = mid + 1
            else:
                hi = mid
        return lo
