- why: 误把第一个数和末项比较。
  code: |
    def distinct_values(nums: list[int]) -> list[int]:
        ordered = sorted(nums)
        result = []
        for i, value in enumerate(ordered):
            if ordered[i - 1] != value:
                result.append(value)
        return result
