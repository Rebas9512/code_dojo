wrong_examples:
- why: 少查最左列。
  code: |
    def search_rows_cols(matrix: list[list[int]], target: int) -> bool:
        row, col = 0, len(matrix[0]) - 1
        while row < len(matrix) and col > 0:
            value = matrix[row][col]
            if value == target:
                return True
            if value < target:
                row += 1
            else:
                col -= 1
        return False
hints:
- 右上角是本行最大值、也是本列最小值。比较一次能排除整行或整列。
