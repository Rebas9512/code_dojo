wrong_examples:
- why: 把恰好用完预算也判作超限。
  code: |
    def longest_uniform(text: str, k: int) -> int:
        counts = {}
        left = best = 0
        for right, ch in enumerate(text):
            counts[ch] = counts.get(ch, 0) + 1
            while right - left + 1 - max(counts.values()) >= k and left < right:
                counts[text[left]] -= 1
                left += 1
            best = max(best, right - left + 1)
        return best
