- why: 只拷贝，原位置留下重复值。
  code: |
    def move_zeroes(nums: list[int]) -> None:
        write = 0
        for read in range(len(nums)):
            if nums[read] != 0:
                nums[write] = nums[read]
                write += 1


    def run_case(nums: list[int]) -> list:
        move_zeroes(nums)
        return nums
