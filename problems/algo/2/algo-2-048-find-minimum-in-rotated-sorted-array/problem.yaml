- why: 把末端自己也划到旋转前的高值段。
  code: |
    def rotated_min(nums: list[int]) -> int:
        lo, hi = 0, len(nums)
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] >= nums[-1]:
                lo = mid + 1
            else:
                hi = mid
        return nums[lo]
hints:
- 用末项作参照，判断哪些位置已经进入旋转后的低值段。
