wrong_examples:
- why: 把全负数的窗口输给虚构的零分。
  code: |
    def max_average(nums: list[int], k: int) -> float:
        total = sum(nums[i] for i in range(k))
        best = 0
        for end in range(k, len(nums)):
            total += nums[end] - nums[end - k]
            best = max(best, total)
        return best / k
- why: 每次都从头求窗口的和。
  code: |
    def max_average(nums: list[int], k: int) -> float:
        best = sum(nums[:k])
        for start in range(1, len(nums) - k + 1):
            total = sum(nums[start:start + k])
            best = max(best, total)
        return best / k
