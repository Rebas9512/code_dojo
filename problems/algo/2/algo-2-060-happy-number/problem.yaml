entry: is_happy
signature: 'def is_happy(n: int) -> bool:'
compare: exact
wrong_examples:
- why: 算成数位和。
  code: |
    def is_happy(n: int) -> bool:
        seen = set()
        while n != 1 and n not in seen:
            seen.add(n)
            total = 0
            while n:
                n, digit = divmod(n, 10)
                total += digit
            n = total
        return n == 1
