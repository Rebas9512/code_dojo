wrong_examples:
- why: 把右侧插入点误当最后一个命中。
  code: |
    from bisect import bisect_left, bisect_right


    def equal_range(nums: list[int], target: int) -> list[int]:
        first = bisect_left(nums, target)
        if first == len(nums) or nums[first] != target:
            return [-1, -1]
        return [first, bisect_right(nums, target)]
