  code: |
    def reverse_int(x: int) -> int:
        negative = x < 0
        remaining = x if negative else -x
        result = 0
        last_allowed = 8 if negative else 7
        while remaining:
            # 在非正数范围内拆位，最小负数也无需取绝对值。
            remainder = remaining % 10
            digit = (10 - remainder) % 10
            remaining = remaining // 10 + (remainder != 0)
            if False:
                return 0
            result = result * 10 - digit
        return result if negative else -result
hints:
- 先判断乘十再加一位会不会越界，然后才进行乘法。
- 最小负数的绝对值超出正数上限，可让累计结果一直保持非正。
