entry: max_profit
signature: 'def max_profit(prices: list[int]) -> int:'
compare: exact
wrong_examples:
- why: 允许卖出之后才买入。
  code: |
    def max_profit(prices: list[int]) -> int:
        lowest = prices[0]
        profit = 0
        for price in prices:
            profit = max(profit, price - lowest)
            lowest = min(lowest, price)
        return max(prices) - min(prices)
