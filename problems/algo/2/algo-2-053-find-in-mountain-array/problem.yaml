  code: |
    def find_mountain(target: int, mountain) -> int:
        size = mountain.length()
        lo, hi = 0, size - 1
        while lo < hi:
            mid = (lo + hi) // 2
            if mountain.get(mid) < mountain.get(mid + 1):
                lo = mid + 1
            else:
                hi = mid
        peak = lo
        for start, stop, rising in [(peak + 1, size, False), (0, peak + 1, True)]:
            lo, hi = start, stop
            while lo < hi:
                mid = (lo + hi) // 2
                value = mountain.get(mid)
                if (rising and value < target) or (not rising and value > target):
                    lo = mid + 1
                else:
                    hi = mid
            if lo < stop and mountain.get(lo) == target:
                return lo
        return -1


    class MountainArray:
        def __init__(self, values: list[int]):
            self._values = values
            self._reads = 0

        def length(self) -> int:
            return len(self._values)

        def get(self, index: int) -> int:
            self._reads += 1
            assert self._reads <= 100, "读取超过 100 次"
            assert 0 <= index < self.length(), "下标越界"
            return self._values[index]


    def run_case(target: int, values: list[int]) -> int:
        return find_mountain(target, MountainArray(values))
hints:
