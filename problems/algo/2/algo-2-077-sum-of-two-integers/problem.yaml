entry: add_words
signature: 'def add_words(a: int, b: int) -> int:'
compare: exact
wrong_examples:
- why: 把最高位为 1 的结果当成非负数。
  code: |
    def add_words(a: int, b: int) -> int:
        mask = 0xffffffff
        a &= mask
        b &= mask
        while b:
            partial = (a ^ b) & mask
            carry = ((a & b) << 1) & mask
            a, b = partial, carry
        return a
hints:
- 异或得到还没进位的和。对应位同时为 1 的部分需要左移一格作为进位。
- 每次进位只保留低 32 位。最终符号位为 1 时，可用按位取反得到有符号值。
