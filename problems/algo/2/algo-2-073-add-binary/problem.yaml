  code: |
    def add_binary(a: str, b: str) -> str:
        i, j = len(a) - 1, len(b) - 1
        carry = 0
        digits = []
        while i >= 0 or j >= 0:
            total = carry
            if i >= 0:
                total += int(a[i])
                i -= 1
            if j >= 0:
                total += int(b[j])
                j -= 1
            digits.append(str(total & 1))
            carry = total >> 1
        return "".join(reversed(digits))
