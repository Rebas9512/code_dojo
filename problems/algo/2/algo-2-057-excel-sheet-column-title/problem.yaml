- why: 漏掉每一步从一基换成零基。
  code: |
    def column_name(n: int) -> str:
        letters = []
        while n:
            n, digit = divmod(n, 26)
            letters.append(chr(ord("A") + digit))
        return "".join(reversed(letters))
