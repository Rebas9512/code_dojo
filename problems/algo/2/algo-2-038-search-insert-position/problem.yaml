wrong_examples:
- why: 把可插在末尾的位置排除在答案之外。
  code: |
    def insert_position(nums: list[int], x: int) -> int:
        lo, hi = 0, len(nums) - 1
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] < x:
                lo = mid + 1
            else:
                hi = mid
        return lo
