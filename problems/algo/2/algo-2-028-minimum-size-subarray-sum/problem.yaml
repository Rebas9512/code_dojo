  code: |
    def min_length(target: int, nums: list[int]) -> int:
        left = total = 0
        best = len(nums) + 1
        for right, value in enumerate(nums):
            total += value
            while total > target:
                best = min(best, right - left + 1)
                total -= nums[left]
                left += 1
        return best if best <= len(nums) else 0
