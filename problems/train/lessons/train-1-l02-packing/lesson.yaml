id: train-1-l02-packing
title: 洗牌与变长拼批
track: train
skills:
  - train.shuffle
  - train.pad
steps:
  - type: read
    skill: train.shuffle
    md: |-
      连续记录常常恰好排好序，第一批可能只有一种标签。洗牌让各批看到不同的样本。比如把行号 [0,1,2] 排成 [2,0,1]，值列和标签列都要按这同一串行号读取。

      给 DataLoader 设置 shuffle=True，并传入 torch.Generator().manual_seed(seed)。生成器保存抽签进度；重建同种子的生成器，第一次遍历就能重现。继续用原生成器会接着抽。

      **TR03 常见误解**　单独打乱两列会拆散样本，即使两列长度依旧相等。
  - type: example
    skill: train.shuffle
    code: |
      import torch
      from torch.utils.data import DataLoader
      # ① 每次重建抽签器
      def order(seed):
          g = torch.Generator().manual_seed(seed)
          return [x.tolist() for x in DataLoader(range(6), batch_size=3, shuffle=True, generator=g)]
      # ② 比较两次完整遍历
      print(order(4) == order(4))  # 输出 True
    md: 把第二个种子改成 9，再比较两批的顺序。
  - type: quiz
    skill: train.shuffle
    q: 要复现一次洗牌，哪种做法可靠？
    options:
      - 重建同种子的生成器
      - 接着用上次已经抽完的生成器
    answer: 0
    explain: 重建生成器才把抽签进度放回起点。
  - type: read
    skill: train.pad
    md: |-
      拼批是把几条样本排成一个矩形。句子 [4,0] 和 [8] 分别长 2 和 1，第二行少一格。补齐（padding）只给批内空位安排占位符，好让模型一次处理整批。

      DataLoader 会把本批的样本列表交给 collate_fn。先保存每行原长，再用 pad_sequence(..., batch_first=True, padding_value=...) 在右边补齐。原长能区分真实的零与补出来的零。

      **TR04 常见误解**　认识数据里的缺失表示尚无观测；补齐格同样不能当作真实观测参与统计。数非零项会把真实的零也删掉。
  - type: example
    skill: train.pad
    code: |
      import torch
      from torch.nn.utils.rnn import pad_sequence
      # ① 标出两个句子的实际长度
      rows = [torch.tensor([4, 0]), torch.tensor([8])]
      print([len(row) for row in rows])  # 输出 [2, 1]
      # ② 让句子各占一行
      print(pad_sequence(rows, batch_first=True, padding_value=-1).tolist())  # 输出 [[4, 0], [8, -1]]
    md: 把占位符改为 0，再看原长能提供什么信息。
  - type: quiz
    skill: train.pad
    q: 真实句子 [0,5,0] 有几个有效位置？
    options:
      - '1'
      - '3'
    answer: 1
    explain: 零也可以是观测值，三个位置都有效。
