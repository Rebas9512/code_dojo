id: train-3-l04-diagnose
title: 读损失记录
track: train
skills:
  - train.curves
steps:
  - type: read
    skill: train.curves
    md: |-
      每轮各记一个训练误差和一个验证误差，顺着轮次读，就能看到学习过程。两条曲线有不同来源：一条来自用来更新的数据，另一条来自留出的数据。验证变差时，先找它开始偏离的轮次。

      训练误差 0.8→0.4→0.1、验证误差 0.8→0.5→0.7，最佳验证点在第 2 轮。训练仍在进步、验证开始回升，是过拟合的线索。两条都高要结合容量对照，两条都暴涨要检查学习率；脚本错误需要查看更新记录。

      **TR18 常见误解**　孤立的一个数通常分不清原因。比较只改变一个条件的两次运行，再核对权重是否真的发生更新。
  - type: example
    skill: train.curves
    code: |
      # ① 按轮记录验证损失
      valid = [0.8, 0.5, 0.7]
      # ② 找到最低值首次出现的轮次
      best = min(valid)
      print(valid.index(best) + 1, best)  # 输出 2 0.5
    md: 再添加一次 0.5，看看首次最佳轮是否改变。
  - type: quiz
    skill: train.curves
    q: 训练误差继续降，验证先降后连续升，应重点检查什么？
    options:
      - 模型在记训练样本
      - 最后一轮一定最好
    answer: 0
    explain: 分叉表明继续训练只改善了训练集，可以回看最佳验证轮。
