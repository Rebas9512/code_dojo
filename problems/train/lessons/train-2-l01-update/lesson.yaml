id: train-2-l01-update
title: 一次参数更新
track: train
skills:
  - train.loop
  - train.ce
steps:
  - type: read
    skill: train.loop
    md: |-
      模型有一组可以调的数，叫参数。把一批输入交给模型得到预测，称为前向；预测和目标之间的差距用一个标量 loss 表示。一次更新要回答两个问题：往哪里改，这一次改多少。

      预测 1，目标 3，平方误差是 4，对预测的梯度是 −4。若参数本身就是预测，学习率 0.25 会把 1 更新为 2。代码先前向、算 loss，然后 zero_grad 清旧账、backward 算本步梯度、step 用它更新。

      **TR06 常见误解**　backward 会把梯度加到已有的 .grad。清得太晚会连这一步刚算的方向也抹掉。
  - type: example
    skill: train.loop
    code: |
      import torch
      # ① 一个参数本身就是预测
      p = torch.tensor(1.0, requires_grad=True)
      optimizer = torch.optim.SGD([p], lr=0.25)
      # ② 算误差，清旧梯度，再反向和更新
      loss = (p - 3) ** 2
      optimizer.zero_grad()
      loss.backward()
      optimizer.step()
      print(loss.item(), p.item())  # 输出 4.0 2.0
    md: 把学习率改为 0.5，再比较更新前的误差与更新后的参数。
  - type: quiz
    skill: train.loop
    q: backward 刚结束，此时应做什么？
    options:
      - 清梯度
      - 用 step 更新参数
    answer: 1
    explain: step 读取刚算出的梯度，若先清零就失去本次更新方向。
  - type: read
    skill: train.ce
    md: |-
      分类模型每行给每个候选类一个原始分数，叫 logits。交叉熵把正确类别得到的支持换成损失，正确类分数相对越高，损失越小。两个类的分数都是 0 时，两类机会相同，损失约为 0.693。

      两条样本、三个候选类时，分数形状是 (2,3)。采用类别下标的写法，每行只交一个从 0 开始的整数，标签形状 (2,)，类型 torch.long。CrossEntropyLoss 会在内部稳定地处理归一化。

      **TR07 常见误解**　先 softmax 再交给交叉熵，相当于把概率当成新分数，同一预测会得到另一份损失和梯度。
  - type: example
    skill: train.ce
    code: |
      import torch
      # ① 两条记录，每条有两个原始分数
      scores = torch.tensor([[0., 0.], [0., 0.]])
      target = torch.tensor([1, 0])
      # ② 按类别下标算平均损失
      print(round(torch.nn.CrossEntropyLoss()(scores, target).item(), 3))  # 输出 0.693
    md: 只把第一行正确类的分数提高到 4，观察平均损失。
  - type: quiz
    skill: train.ce
    q: 有三条记录、五个候选类，类别下标张量应是什么形状？
    options:
      - (3, 5)
      - (3, 1)
      - (3,)
    answer: 2
    explain: 每条只需一个类别编号，批轴以外没有第二维。
