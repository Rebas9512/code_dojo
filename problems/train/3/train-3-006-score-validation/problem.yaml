wrong_examples:
  - why: 把每批当作一条样本。
    code: |
      import torch


      def accuracy(model, batches):
          model.eval()
          correct = total = 0
          with torch.no_grad():
              for x, y in batches:
                  pred = torch.argmax(model(x), dim=1)
                  correct += torch.sum(pred == y).item()
                  total += 1
          return correct / total if total else 0.0
