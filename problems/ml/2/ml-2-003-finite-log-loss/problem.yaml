wrong_examples:
  - why: 先转成浮点概率再取 log，端点会出现 log(0)。
    code: |
      import numpy as np


      def binary_loss(z, y):
          z = np.asarray(z, dtype=float)
          y = np.asarray(y)
          p = 1 / (1 + np.exp(-z))
          return -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))
entry: binary_loss
signature: 'def binary_loss(z, y):'
compare: allclose
