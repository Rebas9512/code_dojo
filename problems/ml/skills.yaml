track: ml
skills:
  - id: ml.affine
    name: 点积预测与偏置
    stage: '1'
    group: 1
    prereqs:
      - math.dot
      - math.matrix-vector
      - tensor.broadcast
    card: |-
      一行特征记录一个样本，例如一趟送货的公里数和箱数。权重表示每多一公里或一箱增加多少费用，偏置表示即使两项都为零也要收的起步费。两项分别乘权重，再相加，就是数学线里的点积。

      若特征为 [2, 3]，权重为 [4, 1]，起步费为 5，总价是 2×4 + 3×1 + 5 = 16。把多趟记录叠成矩阵，每行得到一个数，所有行共用同一个偏置。
  - id: ml.mse
    name: 均方误差
    stage: '1'
    group: 1
    prereqs:
      - ml.affine
      - math.expectation
    card: |-
      为了比较两张报价表，可以先看每条预测与实测相差多少。直接把差相加会让高估与低估抵消。均方误差（MSE）先逐项平方，再取样本平均，误差越大，付出的代价越高。

      若预测为 [3, 3]，实测为 [1, 5]，两个残差为 2 和 −2。平方后都是 4，平均仍是 4。把记录复制一份会让误差总和翻倍，均方误差保持相同。
  - id: ml.normal
    name: 用正规方程拟合直线
    stage: '1'
    group: 2
    prereqs:
      - ml.mse
      - math.matrix-product
    card: |-
      有很多带答案的记录时，可以反过来找一组让均方误差最小的权重。把每行特征末尾添一个 1，得到设计矩阵 A；最后一个权重乘 1，刚好充当偏置。

      例如特征 0、1、2 的实测值为 1、3、5，直线的斜率为 2、偏置为 1。一般的记录可能不在同一直线上。最小平方误差处梯度为零，整理得 AᵀA θ = Aᵀy。把左右两项交给 solve 就能直接求 θ；本组保证列独立。
  - id: ml.descent
    name: 全批与小批梯度下降
    stage: '1'
    group: 2
    prereqs:
      - ml.mse
      - math.descent-plane
    card: |-
      当样本很多时，可以从猜测的权重出发，逐步降低损失。梯度给出损失上升的方向；学习率决定往相反方向走多远。对无截距线性模型，批次内平均平方损失的梯度是 2 Xᵀ(Xw−y)/批内样本数。

      若 x=1、y=3、w=1，残差是 −2，梯度为 −4。学习率 0.1 更新一次得到 1.4。全批用全部记录算一次梯度；小批先更新，再用新的权重读下一批，最后一批可能较短。
  - id: ml.standardize
    name: 按特征标准化
    stage: '1'
    group: 3
    prereqs:
      - math.spread
      - ml.affine
    card: |-
      距离与梯度都受计量单位影响。为了让不同单位的列能放在一起比较，可以给每列建立自己的刻度：减去该列均值，再除以总体标准差（平方差的平均值开方）。

      一列读数为 2、6 时，中心是 4，标准差是 2，两个读数就变成 −1、1。若整列一直是 7，中心化后全为零，约定除数用 1。统计方向始终沿样本轴，每列单独计算。
  - id: ml.trajectory
    name: 用损失轨迹检查学习率
    stage: '1'
    group: 3
    prereqs:
      - ml.descent
    card: |-
      每次更新之前记下损失，就得到按时间排列的训练轨迹。光看最后一个数，容易错过方向写反、漏了首步或跨过最低点等问题。

      模型只学一个数 w，目标为 1，损失是 (w−1)²。从 w=0 出发，学习率 0.25 时，更新后距离目标减半，损失剩四分之一；学习率 1.5 时距离翻倍且符号反转，损失从 1 变 4，再变 16。即使方向正确，走得太远也会发散。
  - id: ml.logistic
    name: 逻辑回归与二元交叉熵
    stage: '2'
    group: 1
    prereqs:
      - ml.affine
      - ml.descent
      - math.cross-entropy
    card: |-
      分类时模型仍能给出一个线性分数 z，但正负分数没有概率的单位。sigmoid(z)=1/(1+exp(−z)) 把它压到 0 与 1 之间，得到预测为正类的概率 p。z=0 对应 p=0.5，因此把 p≥0.5 判为正类，相当于把 z≥0 的点划到正类一侧。

      标签为 1 时交叉熵是 −log(p)，标签为 0 时是 −log(1−p)。例如给正确类别 0.5 的概率，损失约为 0.693。极端分数会让浮点概率舍入到端点，可直接从分数算 logaddexp(0,z)−y*z。平均损失对 z 的梯度来自 p−y。
  - id: ml.multiclass
    name: 多分类 softmax 回归
    stage: '2'
    group: 1
    prereqs:
      - ml.logistic
      - math.softmax
    card: |-
      三个类别需要三个分数。把每个类别的权重排成一列，XW+b 就能为每条样本各算一行分数。对同一行做 softmax，得到三个非负概率，总和为 1。行与行代表不同样本，应独立归一化。

      例如一行分数是 [8,8,8]，三个类别一样有把握，概率各为三分之一。减去本行最大值 8 后得到三个零，概率不变；这一步让 1000 这样的公共偏移也不会造成指数溢出。
  - id: ml.knn
    name: k 个近邻的多数表决
    stage: '2'
    group: 2
    prereqs:
      - math.distance
      - wrangle.rank-index
    card: |-
      有些分类器直接用已知样本作参照。要判一个新点，先找距离最近的 k 个带标签点，再让它们各投一票。欧氏距离开方前后顺序相同，用各维差的平方和即可排序。

      例如新点为 3，参照位置为 1、4、6，对应标签为 0、1、1。最近的是 4，第二近是 1。取两票时票数相同，本组约定选编号小的类；距离相同的参照点按原行号先后。
  - id: ml.lloyd
    name: k-means 的分配与更新
    stage: '3'
    group: 1
    prereqs:
      - math.distance
      - ml.standardize
    card: |-
      没有标签时，可以让位置相近的点形成一组。k-means 先放 k 个中心，把每个点分配给最近的中心，然后把每个中心移到自己收到的点的均值。一次分配加一次移动，才是一轮。

      点 0、2、8 配给初始中心 0、6，标签就是 [0,0,1]；第一轮新中心为 1、8。先分完所有点，再同时移动中心。这里等距选下标小的中心，空簇沿用旧位置，这样每一步都有确定结果。
  - id: ml.impurity
    name: 基尼不纯度与信息增益
    stage: '3'
    group: 2
    prereqs:
      - math.log
      - math.expectation
    card: |-
      一组标签越混杂，猜其中一条越难。基尼不纯度 G=1−Σp²；二分类各半时 G=0.5，只有一种标签时 G=0。另一把尺叫熵 H=−Σp·log₂p，只累加非零比例。各半时熵为 1 比特，纯组为 0 比特。

      分裂的价值要看子组的大小。4 条各半的记录，若分成两个纯组，加权子熵为零，信息增益为 1。若有三条落在同一组，那组的熵占四分之三。比较基尼下降时也用同样的样本权重。
  - id: ml.stump
    name: 用阈值长出决策桩
    stage: '3'
    group: 2
    prereqs:
      - ml.impurity
    card: |-
      一层决策树称作决策桩。只问一个问题：特征值是否不超过阈值？两个答案分别通向一片叶子，叶子投票给本组的多数类。可在排序后相邻的不同取值中间试切，选加权子基尼最小的一刀。

      温度 [1,2,5,8] 对应标签 [0,0,1,1]。切在 3.5，两边正好各自纯净。切在 1.5 时右边仍混有两类。同样好的阈值按本组约定选较小值。
  - id: ml.tree
    name: 按深度递归建树
    stage: '3'
    group: 3
    prereqs:
      - ml.stump
      - py.recursion
    card: |-
      一刀可能无法分开全部标签。把左右子组分别作为新问题，重新选各自最合适的一刀，就得到一棵树。深度预算限制一条路径最多能问几次。在预算用尽、标签相同或特征再也分不开时，用多数类做叶子。

      例如 x=0、1、2 的标签是 0、1、0。根切在 0.5 后左侧已经纯净，右侧还可以切在 1.5。两层能区分三段。递归时必须传入当前子组，每走一条边都要扣一次深度。
  - id: ml.split
    name: 可复现的训练测试划分
    stage: '4'
    group: 1
    prereqs:
      - wrangle.array
      - math.frequency
    card: |-
      训练集是拿来学习参数的已知记录，测试集用来估计模型遇到新记录时的表现。同一条记录不能同时出现在两边。先给行号洗牌，再切成两段，可避免按原表顺序取样的偏向。

      若行号洗牌后是 [2,0,3,1]，留两条作测试，就用 2、0 号评估，用 3、1 号训练。特征与标签共用这一串行号。随机数生成器从相同种子开始，就能复现同一次划分。
  - id: ml.leakage
    name: 只在训练集拟合标准化
    stage: '4'
    group: 1
    prereqs:
      - ml.standardize
      - ml.split
    card: |-
      测试集模拟还没有到来的观测。如果先用全体数据定下中心和尺度，未来数据就影响了模型准备过程，这种情况叫数据泄漏。划分以后，在训练行上求每列的均值、标准差；训练行和测试行都使用这同一套数。

      训练列 [0,2] 的均值为 1、标准差为 1。新来的数 5 应换算为 4。只拿新点自己去中心化会得到 0，把它和训练数据混算又会得到另一种刻度。两种做法都会改变评估的含义。
  - id: ml.confusion
    name: 按真实行、预测列计数
    stage: '4'
    group: 2
    prereqs:
      - ml.logistic
    card: |-
      看总共猜对几条，还分不清哪些类别经常混在一起。混淆矩阵为每一种真实标签和预测标签的配对留一个计数格。本组约定行是真实类，列是预测类。二分类中左上、右上、左下、右下依次是真负 TN、假正 FP、假负 FN、真正 TP。

      若三个真实标签为 [0,0,1]，都预测为 1，那么格 (0,1) 增加两次，格 (1,1) 增加一次。矩阵对角线是猜对的条数，所有格子的和是样本数。
  - id: ml.metrics
    name: 准确率、精确率、召回率和 F1
    stage: '4'
    group: 2
    prereqs:
      - ml.confusion
    card: |-
      准确率问所有判断里猜对了多少。精确率问报为正类的记录里有多少是真的；召回率问所有真正的正类里找回多少。两者关心的分母不同。F1 是精确率与召回率的调和平均，直接用计数也能算：2TP/(2TP+FP+FN)。

      若 TP=2、FP=2、FN=1、TN=5，准确率是 7/10，精确率是 2/4，召回率是 2/3。没有报正或没有真阳性样本时，分母可能为零，这组约定对应指标记作 0。
  - id: ml.auc
    name: 排序画 ROC 与计算 AUC
    stage: '4'
    group: 3
    prereqs:
      - ml.metrics
      - wrangle.rank-index
    card: |-
      当分数达到阈值就报正时，阈值从高到低移动会逐渐召回更多正例，也可能带来误报。ROC 的横坐标为负例中误报的比例，纵坐标为正例中召回的比例。从 (0,0) 起步，相同分数必须同时加入。

      曲线下方面积 AUC 也可以用排序来理解：任取一对正负样本，正例得分高计 1 分，平手计半分。正分 [2,1]、负分 [1] 得 (1+0.5)/2=0.75。升序扫过同分组时，每个正例胜过之前所有负例，并与本组负例平手。
  - id: ml.crossval
    name: k 折交叉验证
    stage: '4'
    group: 4
    prereqs:
      - ml.split
      - ml.mse
    card: |-
      只留一次验证集，分数会受到恰好选中哪些样本的影响。k 折把记录分成 k 个互不重叠的块，轮流留一个块做验证，其余块重新训练模型。每条记录恰好验证一次。

      五条记录分三折，约定多出来的记录先分给前几折，折大小依次为 2、2、1。若用训练目标的均值做最简单的预测器，每一折都要重算均值，再在当前验证行测误差。这里输入已经排好，保持顺序即可。
  - id: ml.value
    name: 标量节点与局部导数
    stage: '5'
    group: 1
    prereqs:
      - math.chain-rule
      - py.class-methods
    card: |-
      普通浮点数只留下计算结果。想知道改动输入会怎样影响输出，还要记下结果从哪里来。用一个 Value 节点装数值 data、累积梯度 grad，以及指向各输入的边。每条边还带一份局部导数，表示只改动这个输入时结果的变化率。

      例如 a=2、b=3，乘积是 6。a 多一点，积会按 b=3 的倍数增加，所以通向 a 的边写 3，通向 b 的边写 2。加法的两条边都写 1。tanh 把数压到 −1 与 1 之间，若输出为 t，它的输入边写 1−t²。同一个输入用两次，就留下两条边。
  - id: ml.reverse
    name: 拓扑排序与反向累积
    stage: '5'
    group: 2
    prereqs:
      - ml.value
      - tensor.accumulate
      - py.recursion
    card: |-
      最终结果对自己的导数是 1。反向传播从这里出发，把每个节点收到的梯度乘上边的局部导数，再加到输入的 grad。若一个中间量参与多条路径，要等所有路径的贡献收齐，才能把它的梯度向前传。

      以 x=2、h=x*x、y=h+h 为例，y 的两条边让 h.grad=2；h 的两条乘法边再给 x 各加 2×2，得到 8。深度优先先访问父节点、最后登记自己，可得到拓扑顺序。反过来走此顺序就满足等待条件；节点只登记一次，边仍逐条累加。

      核对梯度时，可以在 x 两侧各挪开同样小的一步 ε，用 [y(x+ε)−y(x−ε)]/(2ε) 估算斜率。例如 y=2x²，x=2，取 2.01 与 1.99，算出的斜率恰好是 8。
  - id: ml.mlp-forward
    name: 两层 MLP 的前向
    stage: '5'
    group: 3
    prereqs:
      - ml.affine
      - ml.value
      - tensor.linear
    card: |-
      多层感知机（MLP）把一次线性预测的结果当成下一层的输入。第一层在每个样本上算出若干隐藏特征。给隐藏特征逐项加上非线性 tanh，网络就能表达一条直线表示不了的变化。第二层把隐藏特征重新加权，给出最终预测。

      一条输入为 [1,2]，第一层权重为 [[1],[0]]、偏置为 0，则隐藏层只有一格 tanh(1)≈0.762。若第二层权重为 2、偏置为 −1，输出约 0.523。批量输入始终保留行轴，偏置沿行共享。
  - id: ml.mlp-backward
    name: 两层 MLP 的手写梯度
    stage: '5'
    group: 3
    prereqs:
      - ml.mlp-forward
      - ml.reverse
      - math.matrix-product
    card: |-
      反向传播把输出的变化传回每一层。用 G 表示每个输出收到的上游梯度。共享的偏置对每个样本都加了一次，因此偏置梯度沿样本轴求和。权重梯度累加“该输入值乘该输出的梯度”，可把整批写成输入矩阵的转置乘梯度矩阵。

      两条样本的隐藏值为 0.25、0.75，输出梯度为 1、−1，则读出权重梯度是 0.25−0.75=−0.5，偏置梯度为 0。回到隐藏层先乘 W2ᵀ，再逐项乘上 1−h²，随后用同样的规则算第一层各输入和参数的梯度。
  - id: ml.torch-parity
    name: 同一网络的 PyTorch 对拍
    stage: '5'
    group: 4
    prereqs:
      - ml.mlp-backward
      - tensor.backward
      - tensor.boundary
    card: |-
      同一组参数交给手写网络和 PyTorch，可以交叉核对前向与反向。用双精度、同一批输入、同一个标量目标，才能逐项比较。张量设置 requires_grad=True 后参与运算，调用标量的 backward()，就能从每个输入的 grad 取出累计梯度。

      若 y=x·w，x=2、w=3，给输出上游梯度 4 就等于对 4y 求导，得到 dx=12、dw=8。两层网络同理：将输出逐项乘 G 后求和。不保留原始权重轴顺序、遗漏非单位的 G，都会让两个实现给出不同梯度。
