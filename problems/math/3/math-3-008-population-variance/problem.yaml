  - why: 使用样本方差的分母，单个值时还会除零。
    code: |
      def population_variance(values: list[float]) -> float:
          mean = sum(values)/len(values)
          square_sum = sum((v-mean)**2 for v in values)
          return square_sum / (len(values)-1)
