wrong_examples:
  - why: 挑分数最高者计算损失，掩盖自信的错判。
    code: |
      from math import exp, log


      def score_loss(scores: list[float], label: int) -> float:
          peak = max(scores)
          shifted = [s-peak for s in scores]
          total = sum(exp(s) for s in shifted)
          return log(total) - max(shifted)
