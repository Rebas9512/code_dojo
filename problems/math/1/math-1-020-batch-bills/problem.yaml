  - why: 每道菜都套用第一道菜的价格。
    code: |
      def batch_bills(orders: list[list[int]], prices: list[int]) -> list[int]:
          totals = []
          for row in orders:
              total = 0
              for i in range(len(prices)):
                  total += row[i] * prices[0]
              totals.append(total)
          return totals
