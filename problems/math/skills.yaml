track: math
skills:
  - id: math.vector
    name: 用有序分量表示向量
    stage: '1'
    group: 1
    prereqs:
      - py.list-basics
    card: |-
      一袋里有 2 个苹果、5 个梨。约定苹果在前，梨在后，清单就能缩成两个数。这样的一串有顺序的数叫向量，每一格叫一个分量。用量、坐标、一首歌的音量和速度都可以这样记，只要先约定各格的含义。

      向量的维数就是格数。用下标取一格，就能回答关于这个方向或这一种商品的问题。

      换位置会换掉每个数的含义。两个清单即使总数相同，也可能表示完全不同的东西。
  - id: math.vector-arithmetic
    name: 向量加减与数乘
    stage: '1'
    group: 1
    prereqs:
      - math.vector
      - py.for-range
    card: |-
      早班卖出 2 杯茶、3 杯咖啡，晚班卖出 4 杯茶、1 杯咖啡。一天卖出 6 杯茶、4 杯咖啡。两个班都按同样的顺序登记，便可以把同一位置的数相加。若晚班记录的是退货量，就逐项相减。

      数乘把同一个倍数作用在每一格。两种饮料都要备两倍时，分量个数仍然是两个。

      Python 的列表加号会拼接两份记录，列表乘整数会重复记录。先取成数字，再做加减乘。
  - id: math.dot
    name: 点积与加权求和
    stage: '1'
    group: 2
    prereqs:
      - math.vector-arithmetic
      - py.accumulator
    card: |-
      苹果每个 3 元、梨每个 5 元，买 2 个苹果和 4 个梨。苹果花 6 元，梨花 20 元，收银台最后只报一个数 26。把两列数字的对应项相乘，再把这些小计相加，这个操作叫点积。

      一列是数量，另一列是每份的价格或权重。点积也可以把几个科目的成绩按比重合成一个总分。

      得到一列小计时还差最后一步。检查结果的形状，点积返回一个数。
  - id: math.distance
    name: 向量长度与两点距离
    stage: '1'
    group: 2
    prereqs:
      - math.dot
      - math.vector-arithmetic
    card: |-
      从原点向东走 3 米，再向北走 4 米，沿街共走 7 米。拉一条直线连起点和终点，绳子只长 5 米。要比较两个位置靠得有多近，常用这条直线的长度。用坐标相减就能把任意起点移回原点。

      每个方向的差先平方，再求和，最后开平方。平方根是一个非负数，它乘自己等于原来的数。Python 中非负数的 0.5 次方就是平方根。

      加绝对值适合沿街道拐弯走。量直线时方向可以为负，平方后的贡献都是非负的。
  - id: math.matrix-shape
    name: 矩阵的行、列与形状
    stage: '1'
    group: 3
    prereqs:
      - math.vector
      - py.nested-list
      - data.shapes
    card: |-
      两家门店各上报三天客流，把每家店的记录写成一行，就有两行三列。像这样行列整齐的数表叫矩阵。只知道一共有六个数还不够，读第二家店的第一天时，必须知道哪一层表示门店。

      形状写作「行数 × 列数」。外层列表装着各行，用第一个下标选行，再用第二个下标选列。

      一行可以有很多格。看外层有几个元素数的是行，看其中任一行有几个元素数的是列。
  - id: math.transpose
    name: 转置与交换轴
    stage: '1'
    group: 3
    prereqs:
      - math.matrix-shape
    card: |-
      两家店三天的表，店长习惯按店看，调度员却想每天看一行。比如第一天两家的读数是 1 和 4，新表的第一行就写 [1, 4]。转置只改变组织方式，每个读数依然属于原来的那家店、那一天。

      原表第 r 行第 c 列的值，放到新表第 c 行第 r 列。形状也从 行 × 列 变为 列 × 行。

      转置后数一数行。沿每行倒读只会改变先后，无法让原来的列成为新行。
  - id: math.matrix-vector
    name: 矩阵乘向量
    stage: '1'
    group: 4
    prereqs:
      - math.matrix-shape
      - math.dot
    card: |-
      两张购物单分别买 [2, 1] 和 [0, 3] 件商品。若单价是 [3, 5]，第一单花 11 元，第二单花 15 元。把订单写成矩阵，一行结一次账，得到的两个总价组成一个新向量。这叫矩阵乘向量。

      每一个输出分量，是对应一行与输入向量的点积。一行有几列，输入就需要几格；有几行就得到几个结果。

      一行结束要合计，而且新的一行从零重新算。输出的长度由行数决定。
  - id: math.matrix-product
    name: 矩阵乘矩阵与形状规则
    stage: '1'
    group: 4
    prereqs:
      - math.matrix-vector
      - math.transpose
    card: |-
      两家店各有两种套餐的订单。每份套餐又需要三种食材。要算第一家店要几个蛋，先拿出该店两种套餐的销量，再沿食材表的「蛋」列查两种套餐各用几个蛋。两列对应相乘、求和，就得到新表的一格。

      左表 m × n，右表 n × p，中间的 n 表示同一批套餐。结果有 m 行 p 列。第 r 行第 c 列等于左表第 r 行与右表第 c 列的点积。

      右表要沿列读，固定的是食材，变化的是套餐。用不方的矩阵能直接看出方向错误。
  - id: math.identity
    name: 单位矩阵
    stage: '1'
    group: 4
    prereqs:
      - math.matrix-product
    card: |-
      要把两个麦克风的声音原样传给两个音箱，可以让第一个音箱只接收第一个麦克风，第二个只接收第二个。两行权重分别是 [1, 0] 和 [0, 1]。能原样传递所有分量的这张方表，叫单位矩阵。

      行列下标相等的格子写 1，其余写 0。因此一行乘一个向量时刚好保留同一位置的一项。

      如果全填 1，每个音箱收到的都是所有通道之和。沿左上到右下的主对角线保留 1 就够了。
  - id: math.function-table
    name: 用数值表看函数
    stage: '2'
    group: 1
    prereqs:
      - py.func-return
      - py.for-each
    card: |-
      骑车 0 小时付 2 元，1 小时付 5 元，2 小时付 8 元。每给一个时长，收费规则就交回一个金额。把输入变成输出的确定规则叫函数。把几个输入和各自的结果排成表，就能观察规则，也方便检查程序。

      给起步价加上每小时费用乘时长，就得到一个输出。表的一行是一对输入和输出。

      | 时长 | 费用 |
      |---|---|
      | 0 | 2 |
      | 1 | 5 |
      | 2 | 8 |

      0 小时也是一个能交给函数的输入，输出仍由规则决定。相同输入再算一次会得到相同输出。
  - id: math.slope
    name: 两点之间的平均变化率
    stage: '2'
    group: 1
    prereqs:
      - math.function-table
      - py.value-types
    card: |-
      上午 2 时的水位是 3 厘米，5 时是 9 厘米。水位一共升了 6 厘米，这段时间有 3 小时，平均每小时升 2 厘米。想比较不同时长内的变化快慢，就要把变化换成每单位输入的变化。

      斜率也叫两点间的平均变化率。用「后一个输出减前一个输出」除以「后一个输入减前一个输入」，例如 (9−3)/(5−2)。

      读数下降时斜率可以为负。输入相同会让分母为零，这样的两个点无法计算这种斜率。
  - id: math.derivative
    name: 用缩小的差商估计导数
    stage: '2'
    group: 2
    prereqs:
      - math.slope
    card: |-
      边长从 2 增到 3，正方形面积从 4 增到 9，平均每增加一单位边长，面积增加 5。如果只增到 2.1，同一个比值变成 4.1；增到 2.01，又变成 4.01。把第二个点移得越来越近，就能估计眼前这一点的变化快慢，叫导数。

      把小步长记为 h，前向差商写成 (f(x+h) − f(x)) / h。先实际算两个函数值，再除以这次用的步长。

      大步的平均值会混入较远处的变化。h 要非零；在计算机里极小的 h 也会因舍入丢掉变化。
  - id: math.slope-rules
    name: 用数值验证常见导数
    stage: '2'
    group: 2
    prereqs:
      - math.derivative
    card: |-
      固定收费 7 元，时间多一点，费用也没变，斜率是 0。每小时 3 元的费用，斜率是 3。平方函数在 x=3 输出 9，而小步测得的斜率接近 6。函数值告诉我们现在是多少，导数告诉我们输入稍微增加时变得有多快。

      常数的导数为 0，a×x+b 的导数为 a，x² 的导数为 2×x，x³ 的导数为 3×x²。可以取一个数，比较规则给的值和小步差商。

      一个点的函数值为零，斜率也可能有正有负。验算时把函数值和斜率分两列记录。
  - id: math.chain-rule
    name: 复合函数与链式法则
    stage: '2'
    group: 2
    prereqs:
      - math.slope-rules
    card: |-
      旋钮转动 1 格，滑块向前 3 厘米。染色面积等于滑块位置的平方。在位置 2 厘米附近，位置多一点，面积的变化率约为 4。问旋钮转动时面积变化多快，要把两段传动都算上：每格带来 3 厘米，每厘米约增加 4 平方厘米。

      先把输入 x 送进内层得到 u，再把 u 送进外层。总斜率 = 外层在 u 处的斜率 × 内层在 x 处的斜率，这叫链式法则。

      外层斜率的输入是 u，最后还要乘上内层的斜率。可将整条复合规则当作一个函数，用差商核对。
  - id: math.gradient
    name: 一次动一轴的偏导数与梯度
    stage: '2'
    group: 3
    prereqs:
      - math.derivative
      - math.vector
    card: |-
      一块长 3 米、宽 2 米的地毯面积是 6 平方米。只把长增加 0.1 米，面积增加 0.2；只把宽增加 0.1 米，面积增加 0.3。两种改动的影响不同，一个斜率已经说不全。

      多输入函数沿某一个输入的导数叫偏导数。测 x 时固定 y，测 y 时固定 x。按输入顺序把这些偏导数组成向量，就是梯度。

      若两轴同时动，读数混有两个方向的变化。每次都回到同一出发点再量另一个方向。
  - id: math.descent
    name: 一维梯度下降与步长
    stage: '2'
    group: 3
    prereqs:
      - math.slope-rules
    card: |-
      多订少订都会增加费用，距离合适订量越远，损失越大。设合适量是 3，当前订 5，损失是 (5−3)²=4，斜率为 4。若每次按斜率的四分之一反向走，就从 5 走到 4，损失变为 1。

      重复「求当前位置的斜率，再反向走一步」叫梯度下降。步长 rate 控制每次走多远，更新为 x − rate × slope。

      步长太大会越过最低点，甚至越离越远。看更新后的位置和损失，把不同步长放到同一起点试算。
  - id: math.descent-plane
    name: 二维梯度下降与同步更新
    stage: '2'
    group: 3
    prereqs:
      - math.gradient
      - math.descent
      - math.vector-arithmetic
    card: |-
      调两只旋钮 x、y，希望它们的和靠近 0，可以把损失写成 (x+y)²。若从 (2,1) 出发，和为 3，两根轴上的斜率都是 6。步长取 0.1，两边各减 0.6，就到了 (1.4,0.4)，损失从 9 降到 3.24。

      在同一旧位置求出两个偏导数 gx 和 gy，再分别更新为 x−rate×gx、y−rate×gy。一整个梯度对应一次移动。

      两方向会相互影响，半途重算将混入另一处的斜率。先保存整份梯度，改位置时只读这份数。
  - id: math.exp
    name: 指数增长与 exp
    stage: '3'
    group: 1
    prereqs:
      - math.function-table
    card: |-
      培养皿里有 3 个细胞，每小时数量翻倍。下一小时有 6 个，再过一小时有 12 个；第二次多出来的数量比第一次多。只要每一步都乘同一个倍数，就叫指数增长。倍数介于 0 和 1 之间时，数量会逐渐减小。

      整步翻倍可写作 3 × 2**t。连续增长常用自然指数 exp(x)，它相当于把约 2.71828 的常数 e 当作底数去算 e**x。初始量为 a、连续增长率为 k 时，t 时的数量是 a × exp(k×t)。

      增长率作用在现有数量上。exp(0) 等于 1，因此在时间 0 代入公式，能找回初始量。
  - id: math.log
    name: 自然对数与乘法变加法
    stage: '3'
    group: 1
    prereqs:
      - math.exp
    card: |-
      若 1 份经连续增长变为约 7.389 份，用自然指数试，exp(2) 就得到这个倍数。反过来，已知最终倍数想找指数，就用自然对数 log。它回答的是「e 要取几次方才得到这个正数」。

      先增长为原来的 2 倍，再增长为 3 倍，总倍数是 6。用对数记账时，log(2×3) 等于 log(2)+log(3)。log(1)=0，对小于 1 的正数取对数会得到负值。

      连乘对应的是对数的加法。对数只接收正数，倍数为 0 时不能直接取自然对数。
  - id: math.spread
    name: 总体均值、方差与标准差
    stage: '3'
    group: 2
    prereqs:
      - math.function-table
      - py.list-builtins
    card: |-
      三天的等待时间是 2、4、6 分钟。总共 12 分钟，平分到三天，均值是 4。可均值看不出等候稳不稳定。每次与均值之差是 −2、0、2，直接相加会抵消；平方后得到 4、0、4，就能量出偏离的大小。

      把这批数据看成整个总体。总体方差 = 偏差平方和 / 个数，标准差 = 方差的平方根。方差单位是分钟的平方，标准差又回到分钟。

      题目给出整批数据并要求总体方差时，分母就是 n。用样本估计总体方差时常见的 n−1 是另一种约定。
  - id: math.frequency
    name: 用固定种子模拟频率
    stage: '3'
    group: 2
    prereqs:
      - py.for-range
      - py.accumulator
    card: |-
      一枚公平硬币的正反面机会相同，理论上正面的概率是二分之一。可是实际抛 5 次，只出现 2 次正面也很平常。这次实验的正面频率就是 2/5。想知道某个事件在这次模拟里多常见，可以先计数，再除以总试验数。

      用 randint(0, 1) 等可能地产生 0 或 1，约定 1 为正面。seed 固定随机数的起点，相同种子、相同调用顺序能重放整次实验。

      每次抛之前重设种子会反复抽到同一个结果。种子在实验开头设一次，理论概率与本次的命中频率分别记录。
  - id: math.expectation
    name: 按概率加权的期望值
    stage: '3'
    group: 2
    prereqs:
      - math.dot
      - math.frequency
    card: |-
      每次抽奖有四分之一的机会得 8 元，其余时候得 0 元。玩很多次，每四次平均大约有一次拿到 8 元，把收入摊给四次，每次约 2 元。事前把每个可能结果按出现概率加权所得的平均值，叫期望值。

      把每个结果乘上它的概率，再把各项相加。概率非负、合计为 1；结果可以是负的，比如扣除成本之后的净收益。

      等可能时才能直接平均结果。期望可以是一次都不能实际抽到的数。
  - id: math.softmax
    name: 用稳定的 softmax 把分数变成概率
    stage: '3'
    group: 3
    prereqs:
      - math.exp
      - math.vector
      - py.list-builtins
    card: |-
      候选 A 和 B 的分数都是 8 时，希望它们各占一半；若 A 多得一分，就让它分得更多。softmax 先把各分数变成正权重，再除以权重总和。这样每个候选都有非负概率，合起来是 1。

      分数 [1001, 1000] 的差与 [0, −1] 一样。每个分数先减最大值，再取 exp，相当于给所有权重除以同一倍数，比值不变，也避免 exp(1001) 溢出。

      先平移再取指数。最大的一项变成 exp(0)=1，因此分母至少是 1。
  - id: math.cross-entropy
    name: 用交叉熵衡量概率预测
    stage: '3'
    group: 3
    prereqs:
      - math.log
      - math.expectation
      - math.softmax
    card: |-
      识别猫和狗时，照片的真实标签是猫，模型给猫 0.8、给狗 0.2。想给这次预测记个代价，正确类别的概率越大，代价就应越小。用自然对数算 −log(0.8) 约为 0.223。如果模型只给猫 0.2，代价约为 1.609。

      交叉熵按真实分布 q 对每项代价 −log(p) 加权求和。只有一个正确标签时，它的权重是 1，其余是 0，所以只需取出真实类别的预测概率。

      类别下标按输入约定读取。总挑自己最有信心的类别会让自信的错判也得到低损失。
