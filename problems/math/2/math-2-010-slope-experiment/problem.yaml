wrong_examples:
  - why: 步长依次变化，却一直用第一段的分母。
    code: |
      def motion_rates(t: float, steps: list[float]) -> list[float]:
          base = t ** 3 + t
          rates = []
          for h in steps:
              after = (t + h) ** 3 + (t + h)
              rates.append((after - base) / steps[0])
          return rates
