wrong_examples:
  - why: 让两个坐标一起移动。
    code: |
      def partial_y(x: float, y: float, h: float) -> float:
          base = x*y + y**2
          new_y = y + h
          after = (x+h)*new_y + new_y**2
          return (after - base)/h
