wrong_examples:
  - why: 把两个方向装入相反的格子。
    code: |
      def surface_gradient(x: float, y: float, h: float) -> list[float]:
          base = x*x + x*y
          right = (x+h)**2 + (x+h)*y
          up = x*x + x*(y+h)
          return [(up-base)/h, (right-base)/h]
