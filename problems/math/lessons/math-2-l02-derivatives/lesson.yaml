id: math-2-l02-derivatives
title: 用差商看导数
track: math
skills:
  - math.derivative
  - math.slope-rules
  - math.chain-rule
steps:
  - type: read
    skill: math.derivative
    md: |-
      边长从 2 增到 3，正方形面积从 4 增到 9，平均每增加一单位边长，面积增加 5。如果只增到 2.1，同一个比值变成 4.1；增到 2.01，又变成 4.01。把第二个点移得越来越近，就能估计眼前这一点的变化快慢，叫导数。

      把小步长记为 h，前向差商写成 (f(x+h) − f(x)) / h。先实际算两个函数值，再除以这次用的步长。

      ```python
      x = 2
      h = 0.1
      rate = ((x + h)**2 - x**2) / h
      ```

      **MM12 用远处的点估计眼前的斜率**。大步的平均值会混入较远处的变化。h 要非零；在计算机里极小的 h 也会因舍入丢掉变化。
  - type: example
    skill: math.derivative
    code: |
      # ① 选定边长，记录起始面积
      x = 2
      base = x ** 2
      # ② 缩短步长，显示到小数点后三位
      for h in [1, 0.1, 0.01]:
          print(round(((x + h) ** 2 - base) / h, 3))
      # 输出 5.0
      # 输出 4.1
      # 输出 4.01
    md: 把边长改成 3，看看三次估计靠近哪个数。
  - type: quiz
    skill: math.derivative
    q: 在 x=2 处估计平方函数斜率，h 从 1 缩到 0.01 后，差商更接近谁？
    options:
      - '4'
      - '5'
      - '0'
    answer: 0
    explain: 三次差商 5、4.1、4.01 逐渐靠近 4。（MM12 用远处的点估计眼前的斜率）
  - type: read
    skill: math.slope-rules
    md: |-
      固定收费 7 元，时间多一点，费用也没变，斜率是 0。每小时 3 元的费用，斜率是 3。平方函数在 x=3 输出 9，而小步测得的斜率接近 6。函数值告诉我们现在是多少，导数告诉我们输入稍微增加时变得有多快。

      常数的导数为 0，a×x+b 的导数为 a，x² 的导数为 2×x，x³ 的导数为 3×x²。可以取一个数，比较规则给的值和小步差商。

      ```python
      x = 3
      h = 0.01
      measured = ((x+h)**2 - x**2) / h
      rule = 2*x
      ```

      **MM13 把函数值和函数的导数混淆**。一个点的函数值为零，斜率也可能有正有负。验算时把函数值和斜率分两列记录。
  - type: example
    skill: math.slope-rules
    code: |
      # ① 观察立方函数在 x=2 处的值和规则给的斜率
      x = 2
      print([x ** 3, 3 * x ** 2])  # 输出 [8, 12]
      # ② 在同一点实际测一次
      h = 0.01
      print(round(((x + h) ** 3 - x ** 3) / h, 4))  # 输出 12.0601
    md: 把 x 改成 −2，比较立方值和斜率各自的正负。
  - type: quiz
    skill: math.slope-rules
    q: 平方函数在 x=-3 的函数值和导数依次是什么？
    options:
      - '[9, 9]'
      - '[9, -6]'
      - '[-6, 9]'
    answer: 1
    explain: 平方得到 9，斜率按 2×x 得到 −6。（MM13 把函数值和函数的导数混淆）
  - type: read
    skill: math.chain-rule
    md: |-
      旋钮转动 1 格，滑块向前 3 厘米。染色面积等于滑块位置的平方。在位置 2 厘米附近，位置多一点，面积的变化率约为 4。问旋钮转动时面积变化多快，要把两段传动都算上：每格带来 3 厘米，每厘米约增加 4 平方厘米。

      先把输入 x 送进内层得到 u，再把 u 送进外层。总斜率 = 外层在 u 处的斜率 × 内层在 x 处的斜率，这叫链式法则。

      ```python
      x = 1
      u = 3*x - 1
      slope = (2*u) * 3
      ```

      **MM14 漏乘内层的变化率**。外层斜率的输入是 u，最后还要乘上内层的斜率。可将整条复合规则当作一个函数，用差商核对。
  - type: example
    skill: math.chain-rule
    code: |
      # ① 计算中间位置，并沿两段传动合成斜率
      x = 1
      u = 3*x - 1
      print(2*u * 3)  # 输出 12
      # ② 从旋钮端挪一小格，量最终面积的变化
      h = 0.001
      after = (3*(x+h) - 1) ** 2
      print(round((after - u**2) / h, 3))  # 输出 12.009
    md: 把 h 改成 0.01，观察实测值和 12 的距离。
  - type: quiz
    skill: math.chain-rule
    q: 内层每格带来 −2 厘米，外层在当前位置每厘米增加 5 单位。总斜率是多少？
    options:
      - '5'
      - '3'
      - '-10'
    answer: 2
    explain: 传动方向相反，每格的最终变化率为 5×(−2)。（MM14 漏乘内层的变化率）
