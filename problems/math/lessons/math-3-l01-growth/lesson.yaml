id: math-3-l01-growth
title: 指数与对数
track: math
skills:
  - math.exp
  - math.log
steps:
  - type: read
    skill: math.exp
    md: |-
      培养皿里有 3 个细胞，每小时数量翻倍。下一小时有 6 个，再过一小时有 12 个；第二次多出来的数量比第一次多。只要每一步都乘同一个倍数，就叫指数增长。倍数介于 0 和 1 之间时，数量会逐渐减小。

      整步翻倍可写作 3 × 2**t。连续增长常用自然指数 exp(x)，它相当于把约 2.71828 的常数 e 当作底数去算 e**x。初始量为 a、连续增长率为 k 时，t 时的数量是 a × exp(k×t)。

      ```python
      from math import exp
      double_twice = 3 * 2**2
      amount = 3 * exp(0.2 * 2)
      ```

      **MM18 把按比例增长写成每次加同一个数**。增长率作用在现有数量上。exp(0) 等于 1，因此在时间 0 代入公式，能找回初始量。
  - type: example
    skill: math.exp
    code: |
      # ① 连续三个时刻都翻倍
      from math import exp
      for t in [0, 1, 2]:
          print(3 * 2**t)
      # 输出 3
      # 输出 6
      # 输出 12
      # ② 取零时刻和单位时间看自然指数
      print([exp(0), round(exp(1), 3)])  # 输出 [1.0, 2.718]
    md: 把整数翻倍的底数改成 3，看看相邻两个数量的比值。
  - type: quiz
    skill: math.exp
    q: 数量从 5 开始，每步乘 2。两步后是多少？
    options:
      - '15'
      - '20'
      - '10'
    answer: 1
    explain: 两次乘二得到 5×2×2。（MM18 把按比例增长写成每次加同一个数）
  - type: read
    skill: math.log
    md: |-
      若 1 份经连续增长变为约 7.389 份，用自然指数试，exp(2) 就得到这个倍数。反过来，已知最终倍数想找指数，就用自然对数 log。它回答的是「e 要取几次方才得到这个正数」。

      先增长为原来的 2 倍，再增长为 3 倍，总倍数是 6。用对数记账时，log(2×3) 等于 log(2)+log(3)。log(1)=0，对小于 1 的正数取对数会得到负值。

      ```python
      from math import exp, log
      x = log(exp(2))
      total = log(2) + log(3)
      ```

      **MM19 误以为乘积的对数等于对数之积**。连乘对应的是对数的加法。对数只接收正数，倍数为 0 时不能直接取自然对数。
  - type: example
    skill: math.log
    code: |
      # ① 从倍数反查指数
      from math import exp, log
      print(round(log(exp(2)), 3))  # 输出 2.0
      # ② 分开记两次增长，核对一次总增长
      print(round(log(2) + log(3), 3))  # 输出 1.792
      print(round(log(6), 3))  # 输出 1.792
    md: 把两个增长倍数换成 2 和 0.5，比较总倍数和它的对数。
  - type: quiz
    skill: math.log
    q: 两次变化的倍数是 1 和 4，总变化的对数是多少？
    options:
      - log(1) × log(4)
      - log(1+4)
      - log(1) + log(4)
    answer: 2
    explain: 总倍数为 1×4，对数相加得到 log(4)。（MM19 误以为乘积的对数等于对数之积）
