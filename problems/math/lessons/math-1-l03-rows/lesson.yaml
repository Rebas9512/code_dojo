id: math-1-l03-rows
title: 行、列与转置
track: math
skills:
  - math.matrix-shape
  - math.transpose
steps:
  - type: read
    skill: math.matrix-shape
    md: |-
      两家门店各上报三天客流，把每家店的记录写成一行，就有两行三列。像这样行列整齐的数表叫矩阵。只知道一共有六个数还不够，读第二家店的第一天时，必须知道哪一层表示门店。

      形状写作「行数 × 列数」。外层列表装着各行，用第一个下标选行，再用第二个下标选列。

      ```python
      visits = [[5, 4, 8], [1, 6, 2]]
      shape = [len(visits), len(visits[0])]
      ```

      **MM05 把行数和列数交换**。一行可以有很多格。看外层有几个元素数的是行，看其中任一行有几个元素数的是列。
  - type: example
    skill: math.matrix-shape
    code: |
      # ① 每家店占一行
      visits = [[5, 4, 8], [1, 6, 2]]
      # ② 数行列，再取第二家店的第一天
      print([len(visits), len(visits[0])])  # 输出 [2, 3]
      print(visits[1][0])  # 输出 1
    md: 给两行各追加一天读数，再运行看形状。
  - type: quiz
    skill: math.matrix-shape
    q: 一张表有三行，每行一个数，形状是什么？
    options:
      - 1 × 3
      - 3 × 1
      - 3 × 3
    answer: 1
    explain: 三个内层列表各占一行，每行只有一列。（MM05 把行数和列数交换）
  - type: read
    skill: math.transpose
    md: |-
      两家店三天的表，店长习惯按店看，调度员却想每天看一行。比如第一天两家的读数是 1 和 4，新表的第一行就写 [1, 4]。转置只改变组织方式，每个读数依然属于原来的那家店、那一天。

      原表第 r 行第 c 列的值，放到新表第 c 行第 r 列。形状也从 行 × 列 变为 列 × 行。

      ```python
      table = [[1, 2, 3], [4, 5, 6]]
      first_day = [row[0] for row in table]
      ```

      **MM06 把转置当作翻转每行**。转置后数一数行。沿每行倒读只会改变先后，无法让原来的列成为新行。
  - type: example
    skill: math.transpose
    code: |
      # ① 取两家店三天的数据
      a = [[1, 2, 3], [4, 5, 6]]
      # ② 每一列变成新表的一行
      out = []
      for c in range(len(a[0])):
          out.append([row[c] for row in a])
      print(out)  # 输出 [[1, 4], [2, 5], [3, 6]]
    md: 把 5 改成 50，对照它在两张表里的行号和列号。
  - type: quiz
    skill: math.transpose
    q: '[[1, 2, 3]] 转置后是什么？'
    options:
      - '[[3, 2, 1]]'
      - '[[1, 2, 3]]'
      - '[[1], [2], [3]]'
    answer: 2
    explain: 一行三列变成三行一列，数字的对应关系保持。（MM06 把转置当作翻转每行）
