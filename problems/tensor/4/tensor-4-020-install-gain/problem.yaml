wrong_examples:
  - why: 普通张量能算出前向值，却没有登记为参数。
    code: |
      import torch
      import torch.nn as nn


      class ChannelGain(nn.Module):
          def __init__(self, initial):
              nn.Module.__init__(self)
              self.gain = torch.tensor(initial, dtype=torch.float32, requires_grad=True)

          def forward(self, x):
              return x * self.gain


      def make_gain(initial):
          return ChannelGain(initial)
