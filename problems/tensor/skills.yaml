track: tensor
skills:
  - id: tensor.create
    name: 创建张量，读形状和类型
    stage: '1'
    group: 1
    prereqs:
      - wrangle.array
      - math.matrix-shape
      - py.tuple
      - py.print
    card: |-
      张量让一批同类读数共用一套坐标，便于稍后整批运算。两只温度计各测三次，可以把六个数排成两行三列。即使今天只开一只温度计，保留外层的一行，别人仍知道哪一轴表示仪器。

      `torch.tensor` 把规则的列表装进张量。`shape` 按顺序列出各轴长度，`ndim` 数轴；标量的形状是空元组。整数和浮点数能表示的读数不同，`dtype=torch.float32` 能把整数刻度也存成浮点数。

      常见误解：把一行表看成一串数。在 [8, 9] 外再套一对方括号，形状从 (2,) 变为 (1, 2)，读数仍是两个。
  - id: tensor.reshape
    name: 按读取顺序重排格子
    stage: '1'
    group: 2
    prereqs:
      - tensor.create
      - wrangle.reshape
    card: |-
      把连续的一卷标签装成小盒时，想保留它们原来的顺序。六张标签每三张装一盒，是两盒三张；同一卷每两张装一盒，就会有三盒。两种排法都恰好用完六张。

      `reshape(行数, 列数)` 或连续张量上的 `view` 都能重新分行。一个长度写 -1 时，PyTorch 用总格数除以已知长度。重排后按行读仍是原序列，无法整除时就没有这种排法。

      常见误解：把指定宽度当成行数。六张标签每行放两张，reshape(-1, 2) 得到三行两列。每行两张沿着原顺序读。
  - id: tensor.axes
    name: 交换轴与连续存储
    stage: '1'
    group: 2
    prereqs:
      - tensor.reshape
      - math.transpose
    card: |-
      同一批照片可以按「批、行、列」读，也可以先选列再找行。两行三列的编号 0、1、2 / 3、4、5 交换轴后，第一行是 0、3。原仓位里的 0 和 3 隔着两个数，新的邻居未必在内存里相邻。

      `transpose(a,b)` 交换两轴，`permute(2,0,1)` 按旧轴编号给出全部新轴。默认连续布局按末轴优先紧挨存放。`view` 要求目标形状的步幅相容，转置后直接展平常会失败。`reshape` 必要时复制；也可先 `contiguous()` 按现在的读取顺序整理，再 `view`。

      常见误解：以为换轴后的相邻格在内存里也相邻。把 0 到 5 排成两行三列再转置，第一行要读 0、3。此时 view(-1) 会报错；reshape(-1) 或 contiguous().view(-1) 得到 [0, 3, 1, 4, 2, 5]。
  - id: tensor.singleton
    name: 插入与移除单例轴
    stage: '1'
    group: 3
    prereqs:
      - tensor.axes
    card: |-
      有三次测量时，可以写成一排三格，也可以写成三行一列。插入一个长度为一的轴能标记「每行只测一个量」，同时保留全部读数。只有一批数据时，批次轴也可能恰好长一。

      `unsqueeze(0)` 在最前插轴，`unsqueeze(1)` 可在一维序列末尾插轴。`squeeze(dim)` 只在指定轴长度为一时移除它。不带参数会移除所有长度为一的轴，容易误删批次标记。

      常见误解：把所有长度为一的轴都挤掉。形状 (1, 3, 1) 只 squeeze(2) 会留下 (1, 3)；无参数 squeeze() 还会挤掉开头的一批。
  - id: tensor.broadcast
    name: 从右对齐的广播
    stage: '1'
    group: 3
    prereqs:
      - tensor.singleton
      - wrangle.broadcast
    card: |-
      广播让短表中的一个数参与多格计算。两盏灯各记录三次，要给第一盏加 10、第二盏加 20，就把两个补偿值竖着排成两行一列。每行的一个补偿值会用在该行三个时刻。

      PyTorch 与 NumPy 一样，从末尾开始配对轴。对应长度相同或其中一个为一时可以扩展，缺少的前轴也可补一。(2, 3) 加 (3,) 时沿列对齐。若每行一个补偿，要先把 (2,) 变成 (2, 1)。

      常见误解：用一维行补偿去对齐最后的列。两行两列加 [10, 20] 会给第二列加 20。若要给第二行加 20，先把补偿写成 [[10], [20]]。
  - id: tensor.reduce
    name: 沿 dim 聚合并保留轴
    stage: '1'
    group: 4
    prereqs:
      - tensor.broadcast
      - wrangle.axis
    card: |-
      聚合把一排读数浓缩为一个结果。两台仪器各测三次，要给每台算自己的平均值，六格就变成两个平均值。要继续用每个平均值校正原来的那一行，保留一个列位置会更方便。

      `dim` 指出参与汇总、会变短的轴。二维表 `sum(dim=0)` 沿行向下加，`mean(dim=1)` 给每行一个平均。均值需要浮点张量。加 `keepdim=True` 会把被汇总的轴留成长度一，使结果还能沿原轴广播。

      常见误解：漏掉 keepdim 导致行均值对齐列。两行均值是 2 和 7 时，一维的 [2, 7] 会对齐末轴。保留列轴得到 [[2], [7]]，每格才能减去本行均值。
  - id: tensor.slice
    name: 用位置与切片保留轴
    stage: '2'
    group: 1
    prereqs:
      - tensor.create
      - wrangle.slice
    card: |-
      切片让你在保留记录顺序的同时取出一段。两台相机每台拍三帧。两台都要第二帧时，可以交出两个值；如果接收方仍要「相机、时间」两个轴，就交出两行一列。

      `x[:, 1]` 的整数下标选中一格并移除该轴。`x[:, 1:2]` 按区间取数，起点包含、终点不包含，时间轴还在。步长放在第二个冒号后；如 `x[:, ::2]` 从第零列起隔一列取一次。

      常见误解：混淆取一格与切出一格宽的区间。三行两列的 x 取 x[:, 0] 得 (3,)，而 x[:, 0:1] 得 (3, 1)。
  - id: tensor.mask
    name: 用真假掩码筛选与填值
    stage: '2'
    group: 1
    prereqs:
      - tensor.slice
      - wrangle.mask
    card: |-
      给每格贴一张真假便签，就能记录哪些位置要处理。读数 [3, −1, 3] 中只有中间一格低于零。若要收集坏读数，结果只有 −1；若要交回完整记录，就得在原位置放入替代值。

      比较 `x < 0` 会逐格产生布尔张量。`x[mask]` 收集全表掩码为真的格子，得到一维结果；`x.masked_fill(mask, value)` 返回同形的新张量，仅把真的位置改为指定常数。

      常见误解：把填补坏读数做成筛掉坏读数。读数 [[3, -1, 3]] 只有一个负值。掩码取数得到 [-1]，把负数填零得到 [[3, 0, 3]]。
  - id: tensor.route
    name: 沿指定轴 gather 与 scatter
    stage: '2'
    group: 2
    prereqs:
      - tensor.slice
      - wrangle.fancy
    card: |-
      每组检测员可以指定自己的探头。两行分别写 [4, 7, 2]、[9, 6, 1]，位置单写 [[1], [0]]，就从第一行拿 7、第二行拿 9。反过来，当位置单表示目的地时，就把两笔数值写回对应的格。

      `torch.gather(x, 1, index)` 只沿列轴按单取数，结果形状与位置单相同。`torch.scatter(base, 1, index, src)` 把 src 写到 base 的指定列，结果保留底表形状。位置单用长整数，写入题中每行的目的地互异。

      常见误解：让每一行都使用第一行的地址。两行 [4, 7, 2]、[9, 6, 1] 按 [[1], [0]] 查，分别取回 7、9，第二行用自己的列号。
  - id: tensor.one-hot
    name: 用位置编码类别
    stage: '2'
    group: 2
    prereqs:
      - tensor.route
      - tensor.broadcast
      - data.quantity-vs-label
    card: |-
      类别编号是一张座位号，数字较大并不意味着这种类别更多。三类设备用 0、1、2 编号；编号 2 的设备写成 [0, 0, 1]，编号 0 写成 [1, 0, 0]。这叫独热编码，每行只有一个位置亮起。

      回看「认识数据」的数量与标签。列数来自类别目录，即使本批只出现编号 0，也要留出其余类别的列。可用每行标签与全部列号广播比较，也可在全零底表里沿列 scatter 一个 1。

      常见误解：用本批出现的类别数决定输出宽度。目录有五类时，两个标签 [1, 1] 也要编码成两行五列；四个未出现的类别各留一列。
  - id: tensor.where
    name: 按格选择两路数据
    stage: '2'
    group: 3
    prereqs:
      - tensor.mask
      - wrangle.where
    card: |-
      两只传感器同一时刻各给一个数。主探头失效时，可以让备用探头只接替那一个时刻。例如主记录 [3, −1]，备用 [8, 5]，按非负为有效的规则合成 [3, 5]。结果与输入逐格对应。

      `torch.where(条件, 真分支, 假分支)` 同时读取相应位置的两个候选值；真假与候选值都可按广播规则对齐。若每个位置都有不同的备选值，就把整个备用张量交给分支。

      常见误解：把真假分支的候选顺序颠倒。主读数 [0, -2]、备用 [6, 7]，以主读数非负为有效，真假分支依次给出 0、7。
  - id: tensor.rank
    name: 读出 topk 的值和 argmax 的位置
    stage: '2'
    group: 3
    prereqs:
      - tensor.slice
      - wrangle.rank-index
    card: |-
      挑最快的两台机器要报告速度；要给最快的一台发指令则要知道位置。[4, 9, 6] 里最高读数是 9，它的位置是 1。值、位置、名次回答三个不同的问题。

      `torch.topk(x, k, dim=1)` 每行选出 k 个最大的数，默认从大到小排列，取 .values 得分数，.indices 得原列号。并列时 topk 的列号顺序不保证。`torch.argmax(x, dim=1)` 每行给一个最大值的位置，并列时取最先出现的位置。

      常见误解：把最大值当作它的位置。读数 [7, 7, 2] 的最大值是 7，argmax 给位置 0，相同最大值选择先遇到的那格。
  - id: tensor.coordinates
    name: 从输出位置反推输入坐标
    stage: '2'
    group: 4
    prereqs:
      - tensor.broadcast
      - tensor.slice
      - wrangle.fancy
      - py.floordiv-mod
      - math.identity
    card: |-
      有些运算只是在搬格子。从结果的第 i 格出发，问它应该读原来的哪一格，就能一次写出全部地址。例如四格倒读，结果位置 0、1、2、3 分别读旧位置 3、2、1、0。两根坐标轴还可以组成每一格的行号与列号。

      `torch.arange(n)` 生成 0 到 n−1。用 `i[:, None]` 竖排行号，横排列号就能逐格比较。要合计最多八格，可以让每格先加左边距 1 的值，再用新结果加距 2、4 的值，覆盖 2、4、8 格；越过左边界的贡献乘零。

      常见误解：把目的地编号直接当成来源编号。四格右移一格时，输出第零格要读原第三格。减一步得到来源地址，超过边界用余数绕回。
  - id: tensor.contract
    name: 用 einsum 标出保留轴与求和轴
    stage: '3'
    group: 1
    prereqs:
      - tensor.reduce
      - math.matrix-product
    card: |-
      两个班各领两种材料，要算每班能装多少个小包，可以先看其中一个班。若它领了 [2, 3] 份材料，每份分别能装 4、5 包，共有 2×4 + 3×5 = 23 包。对所有班和包装规格重复这个计算，就是矩阵乘法。

      `einsum` 让每一轴有一个字母。写 ij,jk->ik 时，逗号分开两张输入表，同名 j 对齐相乘。箭头右边留下班级 i、规格 k；消失的材料轴 j 要把各项贡献加起来。用普通矩阵乘法 @ 可以核对每一格。

      常见误解：把重复字母的各项乘积当成最终结果。数量 [2, 3] 与单价 [4, 5] 的两项贡献为 8 和 15。材料轴从输出消失时，还要加成 23。
  - id: tensor.batch-contract
    name: 在每一批内单独相乘
    stage: '3'
    group: 1
    prereqs:
      - tensor.contract
    card: |-
      两天各有领料单和当天的配方。如果第一天单上的两种材料数量为 [2, 1]，当天产量是 [4, 3]，这一天共得 11。即使第二天的产量翻倍，第一天的结果也不应受影响。批次轴把各天的计算隔开。

      bij,bjk->bik 的 b 在两份输入和输出中都出现，选定某个 b 后只在这一天里把 j 加起来。显式计算可用 `torch.bmm` 逐批乘两张三维表，也可用 @ 匹配相同批次。

      常见误解：把批次字母也省掉而合并所有天。两天的产量分别为 11、22，去掉输出的批次字母会把它们合成 33，无法再分天交卷。
  - id: tensor.relabel
    name: 换字母顺序与重复下标
    stage: '3'
    group: 2
    prereqs:
      - tensor.contract
      - tensor.axes
      - tensor.slice
    card: |-
      有时只需换一种方式查看同一张表。把行、列的顺序调换就得到转置；如果两根轴都表示同一批端口，取「发件与收件编号相同」的格子就是主对角线。比如 [[3, 8], [7, 5]] 的自发自收量是 [3, 5]。

      ij->ji 重排输出轴，格子的归属随轴一起变。ii->i 在输入内部重复字母，只取两个下标相同的格子；这要求这两轴等长。ii-> 还会将选出的对角线求和，得到标量。

      常见误解：以为同一输入的重复字母会选中整张表。方表 [[3, 8], [7, 5]] 写 ii->i 只读 [3, 5]，改成 ii-> 才将它们合成 8。
  - id: tensor.pair-scores
    name: 为所有配对计算外积和注意力分数
    stage: '3'
    group: 3
    prereqs:
      - tensor.batch-contract
      - tensor.broadcast
      - math.dot
    card: |-
      外积枚举两串数的所有配对，例如 [2, 3] 与 [4, 5, 6] 会产生两行三列，第一行是 [8, 10, 12]。注意力打分也为每对位置留一格，只是每个位置携带一串特征：一个查询和一个候选键各自对应分量相乘，再把这些贡献相加。

      外积 i,j->ij 保留两个位置字母。查询 q 和键 k 共享特征轴 d，qd,kd->qk 只消掉 d。加批次可写 bqd,bkd->bqk。这里算原始点积分数；缩放、概率归一化和对值向量加权留到后续课程。

      常见误解：把键的位置也缩掉，只剩每个查询一个数。两个查询和三个键各有四个特征。每对的四项贡献压成一格，最后留下六格原始分数。
  - id: tensor.backward
    name: 记录运算并反向求导
    stage: '4'
    group: 1
    prereqs:
      - tensor.reduce
      - math.gradient
    card: |-
      梯度说明某个输入微微增加时，结果会往哪里变、变化多快。把旋钮设为 3，能耗是旋钮值的平方，此时能耗为 9，斜率为 6。要让程序自动算出这个 6，就需要记住能耗怎样从旋钮一步步算来。

      创建浮点输入时设 `requires_grad=True`，PyTorch 会记录后续可微运算的依赖，这些依赖构成计算图。从标量结果调用 `backward()` 后，在原始输入的 `.grad` 读取梯度。若传入的浮点叶子尚未记录梯度，调用 `x.requires_grad_(True)` 可就地打开开关。`.item()` 可把单格张量读成 Python 数。整数张量不能开启梯度。

      常见误解：把整数输入直接设成可求导。整数列表 [2, 4] 直接建张量无法开启求导；指定浮点存储后，平方和的梯度是 [4.0, 8.0]。
  - id: tensor.accumulate
    name: 累加与清空梯度
    stage: '4'
    group: 1
    prereqs:
      - tensor.backward
    card: |-
      同一旋钮影响两笔损失时，可能想把两笔影响相加，也可能想分开看。若第一笔的斜率是 2、第二笔是 5，一起汇报应得 7；单报第二笔就应得 5。两次测量的目标决定何时清空记录。

      每次 backward 都往叶子张量（直接创建、用来求导的输入）的 .grad 里加。计算另一笔损失时重新用 x 写前向式子，得到新图。需要独立读数就在两次反向之间写 `x.grad = None`；保存早先结果时用 .item() 取数或 .clone() 留副本。

      常见误解：以为第二次反向会自动覆盖第一次。先对 2x 反向，再对 5x 反向，未清空时读到 7；中间设 x.grad = None，第二笔就单独得到 5。
  - id: tensor.boundary
    name: 暂停记录与截断梯度
    stage: '4'
    group: 2
    prereqs:
      - tensor.accumulate
      - math.chain-rule
    card: |-
      有些读数只作目标，有些要作为旋钮继续求导。比如在 x=3 时计算 x 乘自己的参考读数 3，如果参考固定，只让第一个因子变化，斜率就是 3；两个因子同时变化时，斜率是 6。数值一样，计算路径却不同。

      `x.detach()` 取一个与原值共享存储、从此处切断求导路径的张量；改动其内容也可能影响原值。`with torch.no_grad():` 暂停记录代码块内的新运算。反向传播可能需要旧值：若前向保存了 x，即使在 no_grad 里提前原地改它，版本检查仍可能报错。先反向，再更新。

      常见误解：以为暂停记录就能随时原地改旧值。在 x=2 时保存 x*x 的计算图。如果先在 no_grad 中把 x 加 1，反向会发现版本已变；先反向可得到旧点的斜率 4。
  - id: tensor.parameter
    name: 把初值包装成 nn.Parameter
    stage: '4'
    group: 3
    prereqs:
      - tensor.backward
    card: |-
      旋钮的当前值和「这是要学习的旋钮」是两件事。一对通道的增益可从 [1, 1] 起步，今后分别调大或调小。用参数对象表达这个身份，稍后把它放到网络层的属性上，层就能找到需要训练的旋钮。

      `nn.Parameter(浮点张量)` 保留张量的形状和值，默认开启求导。普通张量即使手动开启求导，挂到层上也不会自动登记为参数。这里先练习造出参数，再在自己的层中安装它。

      常见误解：把能求导的普通张量当成已经登记的参数。把普通浮点张量和 Parameter 分别挂到模块属性上，即使两者都能求导，也只有 Parameter 会自动出现在参数清单中。
  - id: tensor.linear
    name: 用 nn.Linear 将特征映射到输出
    stage: '4'
    group: 3
    prereqs:
      - tensor.parameter
      - math.matrix-vector
      - tensor.boundary
    card: |-
      把两个特征 [2, 3] 合成一个分数时，若权重为 [4, 5]，偏置为 1，结果是 2×4 + 3×5 + 1 = 24。每个输出都可以使用自己的一组权重。线性层把这些可学习的权重和偏置收在一起，一次处理整批样本。

      `nn.Linear(输入数, 输出数)` 的 weight 形状是（输出数，输入数），每行产生一个输出。bias 为每个输出留一格，bias=False 可以省略偏置。传入（批，输入数）得到（批，输出数）。构造时会随机初始化；示例先固定种子，有指定初值时在 no_grad 中复制进去。

      常见误解：按输入数、输出数的顺序存权重。三个输入、两个输出时，每个输出需要三个系数。weight 是 (2, 3)，四个样本的输出则是 (4, 2)。
  - id: tensor.module
    name: 编写带 forward 的 nn.Module
    stage: '4'
    group: 4
    prereqs:
      - tensor.linear
      - py.class-methods
      - tensor.broadcast
    card: |-
      一层可以把「有哪些旋钮」和「读数怎样通过」放在一起。若两个通道的增益是 [2, 3]，输入 [4, 5] 通过这层便得到 [8, 15]。下一批输入还能使用同一组旋钮，无需重新创建权重。

      继承 nn.Module，在 __init__ 中先初始化父类，再把 nn.Parameter 存在 self 的属性上，框架会登记它。forward(self, x) 写输入怎样得到输出。调用 layer(x) 就会运行 forward。把普通张量存在同名属性上也能算出数值，但框架不会把它列作训练参数。

      常见误解：只写出正确的前向值，漏登记可训练参数。给 [4, 5] 乘增益 [2, 3]，普通张量与参数都能算出 [8, 15]。只有把增益作为 Parameter 挂到层上，训练时才能从参数清单找到这两个旋钮。
  - id: tensor.state
    name: 遍历参数与保存状态
    stage: '4'
    group: 4
    prereqs:
      - tensor.module
      - py.dict-iter
    card: |-
      更新参数时，要找到每个可以学习的张量；保存模型时，还要有稳定的名字以便将数值放回原处。一个从两个特征到一个输出的线性层有一张含两格的权重和一格偏置，共两个参数张量、三个标量。

      `parameters()` 给出已登记的参数，`numel()` 数张量里的标量格。`state_dict()` 是名字到张量的映射，包括参数和持久缓冲区（随层保存的辅助数值）。映射里的张量可能与原层共享存储。保存独立快照时逐项 clone；同结构层可用 load_state_dict 恢复。

      常见误解：以为 state_dict 自动冻结了旧值。权重从 2 改成 5，直接留着的 state_dict 也会读到 5；更新前单独 clone 的权重仍是 2。
