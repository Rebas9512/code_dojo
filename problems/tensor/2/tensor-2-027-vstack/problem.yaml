id: tensor-2-027-vstack
title: 合成双通道记录
track: tensor
stage: '2'
order: 270
format: write
mode: function
difficulty: 35
skills:
  requires:
    - tensor.coordinates
  introduces: null
source: original
entry: vstack
signature: 'def vstack(a, b):'
compare: checker
wrong_examples:
  - why: 直接调用现成运算，跳过了坐标构造。
    code: |
      import torch


      def vstack(a, b):
          return torch.vstack((a, b))
  - why: 把第二条记录叠在第一行。
    code: |
      import torch


      def vstack(a, b):
          row = torch.arange(2)[:, None]
          return (row == 1) * a + (row == 0) * b
constraints:
  no_loops: true
  forbid_calls:
    - torch.vstack
    - torch.stack
    - torch.cat
    - torch.concat
    - torch.concatenate
  forbid_imports:
    - numpy
    - pandas
