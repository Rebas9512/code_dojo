wrong_examples:
  - why: 直接调用现成运算，跳过了坐标构造。
    code: |
      import torch


      def eye(n):
          return torch.eye(n, dtype=torch.int64)
  - why: 点亮了编号不同的位置。
    code: |
      import torch


      def eye(n):
          i = torch.arange(n)
          return (i[:, None] != i) * 1
