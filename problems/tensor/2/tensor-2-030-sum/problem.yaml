id: tensor-2-030-sum
title: 汇报整条记录的总量
track: tensor
stage: '2'
order: 300
format: write
mode: function
difficulty: 37
skills:
  requires:
    - tensor.coordinates
  introduces: null
source: original
entry: sum_strip
signature: 'def sum_strip(x):'
compare: checker
wrong_examples:
  - why: 直接调用现成运算，跳过了坐标构造。
    code: |
      import torch


      def sum_strip(x):
          return torch.sum(x)
  - why: 取了最早的小计，只能覆盖第一个读数。
    code: |
      import torch


      def sum_strip(x):
          i = torch.arange(len(x))
          # 每轮合并两个相邻区间，左边越界的位置贡献为零。
          s2 = x + (i >= 1) * x[(i - 1) % len(x)]
          s4 = s2 + (i >= 2) * s2[(i - 2) % len(x)]
          s8 = s4 + (i >= 4) * s4[(i - 4) % len(x)]
          return s8[0]
constraints:
  no_loops: true
  forbid_calls:
    - torch.sum
    - torch.cumsum
    - torch.matmul
    - torch.Tensor.sum
    - torch.Tensor.cumsum
    - torch.Tensor.matmul
  forbid_imports:
    - numpy
    - pandas
hints:
  - 最后一格的前缀和覆盖全部读数。
