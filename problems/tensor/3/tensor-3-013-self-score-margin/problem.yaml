wrong_examples:
  - why: 每个查询应减自己的基准；换轴就成了每个键减自己的基准。
    code: |
      import torch


      def margins(x):
          scores = torch.einsum("bid,bjd->bij", x, x)
          own = torch.einsum("bii->bi", scores)
          return scores - own.unsqueeze(1)
