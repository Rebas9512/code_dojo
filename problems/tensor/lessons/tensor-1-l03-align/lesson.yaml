id: tensor-1-l03-align
title: 单例轴与广播
track: tensor
skills:
  - tensor.singleton
  - tensor.broadcast
steps:
  - type: read
    skill: tensor.singleton
    md: |-
      有三次测量时，可以写成一排三格，也可以写成三行一列。插入一个长度为一的轴能标记「每行只测一个量」，同时保留全部读数。只有一批数据时，批次轴也可能恰好长一。

      `unsqueeze(0)` 在最前插轴，`unsqueeze(1)` 可在一维序列末尾插轴。`squeeze(dim)` 只在指定轴长度为一时移除它。不带参数会移除所有长度为一的轴，容易误删批次标记。

      **TM04 常见误解：把所有长度为一的轴都挤掉**。形状 (1, 3, 1) 只 squeeze(2) 会留下 (1, 3)；无参数 squeeze() 还会挤掉开头的一批。
  - type: example
    skill: tensor.singleton
    code: |
      import torch
      # ① 明确指出只移除列轴
      x = torch.tensor([[9]])
      print(tuple(x.squeeze(1).shape))  # 输出 (1,)
      print(tuple(x.squeeze().shape))  # 输出 ()
    md: 把表改成两行一列，看两种挤压何时相同。
  - type: quiz
    skill: tensor.singleton
    q: (1, 3, 1) 只 squeeze(2) 后是什么？
    options:
      - (3,)
      - (1, 3)
      - (3, 1)
    answer: 1
    explain: 只挤掉末轴，开头的一批仍有自己的轴。（TM04）
  - type: read
    skill: tensor.broadcast
    md: |-
      广播让短表中的一个数参与多格计算。两盏灯各记录三次，要给第一盏加 10、第二盏加 20，就把两个补偿值竖着排成两行一列。每行的一个补偿值会用在该行三个时刻。

      PyTorch 与 NumPy 一样，从末尾开始配对轴。对应长度相同或其中一个为一时可以扩展，缺少的前轴也可补一。(2, 3) 加 (3,) 时沿列对齐。若每行一个补偿，要先把 (2,) 变成 (2, 1)。

      **TM05 常见误解：用一维行补偿去对齐最后的列**。两行两列加 [10, 20] 会给第二列加 20。若要给第二行加 20，先把补偿写成 [[10], [20]]。
  - type: example
    skill: tensor.broadcast
    code: |
      import torch
      # ① 让每行的同一补偿量用于多个时刻
      x = torch.tensor([[1, 2], [3, 4]])
      d = torch.tensor([10, 20])
      print((x + d).tolist())  # 输出 [[11, 22], [13, 24]]
      print((x + d.unsqueeze(1)).tolist())  # 输出 [[11, 12], [23, 24]]
    md: 把两个补偿都改成 10，看形状错误为何有时看不出。
  - type: quiz
    skill: tensor.broadcast
    q: (2, 1) 加 (1, 3)，结果几行几列？
    options:
      - 1 行 3 列
      - 2 行 1 列
      - 2 行 3 列
    answer: 2
    explain: 行轴取两行，列轴取三列，在六个配对位置各算一次。（TM05）
