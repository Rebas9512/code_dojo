id: tensor-2-l01-select
title: 切片、筛选与填值
track: tensor
skills:
  - tensor.slice
  - tensor.mask
steps:
  - type: read
    skill: tensor.slice
    md: |-
      切片让你在保留记录顺序的同时取出一段。两台相机每台拍三帧。两台都要第二帧时，可以交出两个值；如果接收方仍要「相机、时间」两个轴，就交出两行一列。

      `x[:, 1]` 的整数下标选中一格并移除该轴。`x[:, 1:2]` 按区间取数，起点包含、终点不包含，时间轴还在。步长放在第二个冒号后；如 `x[:, ::2]` 从第零列起隔一列取一次。

      **TM07 常见误解：混淆取一格与切出一格宽的区间**。三行两列的 x 取 x[:, 0] 得 (3,)，而 x[:, 0:1] 得 (3, 1)。
  - type: example
    skill: tensor.slice
    code: |
      import torch
      # ① 追踪第二帧的两个表示法
      x = torch.tensor([[1, 2, 3], [4, 5, 6]])
      print(tuple(x[:, 1].shape))  # 输出 (2,)
      print(x[:, 1:2].tolist())  # 输出 [[2], [5]]
    md: 把区间改成 1:3，比较多出哪一列。
  - type: quiz
    skill: tensor.slice
    q: 一行四列只取 x[:, 2:3] 后形状是？
    options:
      - (1,)
      - (1, 1)
      - ()
    answer: 1
    explain: 两个冒号都保留所在轴，一行一列仍有两个轴。（TM07）
  - type: read
    skill: tensor.mask
    md: |-
      给每格贴一张真假便签，就能记录哪些位置要处理。读数 [3, −1, 3] 中只有中间一格低于零。若要收集坏读数，结果只有 −1；若要交回完整记录，就得在原位置放入替代值。

      比较 `x < 0` 会逐格产生布尔张量。`x[mask]` 收集全表掩码为真的格子，得到一维结果；`x.masked_fill(mask, value)` 返回同形的新张量，仅把真的位置改为指定常数。

      **TM08 常见误解：把填补坏读数做成筛掉坏读数**。读数 [[3, -1, 3]] 只有一个负值。掩码取数得到 [-1]，把负数填零得到 [[3, 0, 3]]。
  - type: example
    skill: tensor.mask
    code: |
      import torch
      # ① 给负读数做标记，再分别提取和填补
      x = torch.tensor([[3, -1, 3]])
      bad = x < 0
      print(x[bad].tolist())  # 输出 [-1]
      print(x.masked_fill(bad, 0).tolist())  # 输出 [[3, 0, 3]]
    md: 把 -1 换为 0，观察筛选结果有几项。
  - type: quiz
    skill: tensor.mask
    q: 一张两行三列的表有四格合格，x[合格掩码] 的形状是？
    options:
      - (2, 3)
      - (4,)
      - (2, 2)
    answer: 1
    explain: 逐格掩码只抽出四个合格值，按原来行序排成一串。（TM08）
