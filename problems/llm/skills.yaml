track: llm
skills:
  - id: llm.alphabet
    name: 字符词表与双向查找
    stage: '1'
    group: 1
    prereqs:
      - py.dict-basics
      - py.sorted
    card: |-
      模型只能读数字。给每个不同的字符分配一个固定编号，就得到字符词表。编码把文字换成编号，解码沿相反方向查回字符，这样同一串文字可以来回传递。

      在 cab 中，按字符排序得到 abc，编号从 0 起。cab 对应 [2, 0, 1]；反过来读 0、2 就得到 ac。先固定整张表，再处理新的文字。

      重复字符共用编号。建表时去重，编码时每次出现都要保留。
  - id: llm.utf8
    name: 从码点到 UTF-8 字节
    stage: '1'
    group: 1
    prereqs:
      - data.text-formats
      - py.ord-chr
      - llm.alphabet
    card: |-
      文本文件在磁盘上保存的是字节，每个字节是 0 到 255 的数。字符有自己的 Unicode 码点，UTF-8 规定如何把码点写成一个或多个字节。字节词表只需预留 256 个编号，就能表示所有合法文本。

      ord("é") 是 233，chr(233) 能找回这个字符；UTF-8 为它写下 195、169 两个字节。把整串字节一起解码，才能拼回完整字符。

      按字符数截取字节可能切在一个字符中间。
  - id: llm.pair
    name: 相邻对与单次合并
    stage: '1'
    group: 2
    prereqs:
      - llm.utf8
      - py.dict-get
    card: |-
      BPE 用一个新编号代替常常挨在一起的两个编号。先让窗口每次向右挪一格，数清所有相邻对。确定要合并哪一对后，再从左往右扫描一次。

      在 [7,7,7] 里，第一二格、第二三格都是 (7,7)，因此出现两次。若用 256 代替它们，第一二格消耗后只剩第三格，结果是 [256,7]。

      计数时窗口可以重叠，替换时一格只能被使用一次。
  - id: llm.fit-bpe
    name: 在语料上学习合并表
    stage: '1'
    group: 2
    prereqs:
      - llm.pair
      - py.sort-key
    card: |-
      训练分词器就是从语料中选出值得缩短的相邻对。每轮先重新计数，选最频繁的一对，分配尚未用过的编号，再替换所有互不重叠的出现。

      用字节 1、2 表示交替出现的两类字符：[1,2,1,2] 先合并 (1,2)，变成 [256,256]；第二轮才能发现 (256,256)。同频时本课统一选字典序最小的一对，即先比左编号再比右编号。

      第一轮的频次表在替换后就过期了。
  - id: llm.apply-bpe
    name: 用学到的顺序编码
    stage: '1'
    group: 3
    prereqs:
      - llm.fit-bpe
    card: |-
      一张训练好的合并表可以带到新文本上。每条规则对应一个固定的新编号。编码时要让同一段文字在同一词表下永远变成相同的编号，不能按新文本的词频重新训练。

      表中先有 (1,2)→256，再有 (256,3)→257。输入 [1,2,3] 先变成 [256,3]，再变成 [257]。某条规则没有出现时也要保留它的编号名额。

      按表的先后次序逐条替换；倒序会错过由较早规则造出的新邻居。
  - id: llm.special
    name: 保留特殊 token
    stage: '1'
    group: 3
    prereqs:
      - llm.apply-bpe
    card: |-
      文本里的普通字母描述内容，特殊 token 还能标出文档边界。双方先约好拼写和一个超出普通词表的编号，编码器就在读到整段标记时发出这个编号。

      若 `<end>` 保留为 1000，a`<end>`b 的中间只有一个 token。先按完整标记切段，各段分别用字节词表编码；相邻的两个标记要留下两个边界。

      部分拼写如 <en 并未构成标记，应作为普通文字保留。
  - id: llm.embedding
    name: 按 token 编号查嵌入
    stage: '2'
    group: 1
    prereqs:
      - llm.alphabet
      - tensor.slice
      - tensor.route
    card: |-
      给编号 1 和 2 做加法，结果不能说明两个词的关系。模型为每个编号准备一行可以学习的数，用这行向量描述这个词。所有行叠起来就是嵌入表，nn.Embedding 做的事与按行索引相同。

      若表有三行，每行两个数，那么 [2,0,2] 会取第三行、第一行、第三行，得到三行两列。输入多一个批次轴时，查到的每行仍留在原位置。

      同一编号反复出现就反复查同一行；不能给编号排序或去重。
  - id: llm.position
    name: 按绝对位置添加嵌入
    stage: '2'
    group: 1
    prereqs:
      - llm.embedding
      - tensor.broadcast
    card: |-
      两个相同的词查到同一行，模型还需要知道它们各自在句子里的位置。再建一张按位置编号的表，给每个词向量加上所在位置的向量。批里的每句话可以共用位置表。

      若词向量是 [1,2]，位置 0、1 的向量为 [0,1]、[3,0]，两个相同的词就变成 [1,3]、[4,2]。从长文本中间接着读时，起点用已经读过的 token 数。

      要取 start 到 start+T 之前的全部 T 行；用批数截取会漏掉后面的词。
  - id: llm.attention
    name: 单头缩放点积注意力
    stage: '2'
    group: 2
    prereqs:
      - tensor.pair-scores
      - math.softmax
    card: |-
      一个位置需要从其他位置收集消息。查询 Q 表示想找什么，键 K 表示每处能匹配什么，值 V 是实际传来的内容。每个查询分别给所有键打分，再按分数给值分配权重。

      一个查询遇到两个同样匹配的键，两项权重各半。若值为 2 和 8，输出就是 5。键有 d 个分量时，点积常随宽度变大，先除以 √d，再沿键轴做 softmax，可避免权重过分集中。

      每行概率之和为 1；沿查询轴归一化会让不同查询互相争份额。
  - id: llm.causal
    name: 遮住未来的键
    stage: '2'
    group: 2
    prereqs:
      - llm.attention
      - tensor.mask
    card: |-
      语言模型用读过的词猜下一个词。把整句一次送入训练时，每个位置只能看自己和左边。可见的格子构成下三角；在算概率前把未来列的分数填成负无穷，它们的概率就恰好为零。

      三个位置的第 1 行（从 0 数）可看列 0、1。若原分数都是 0，该行的权重就是 [0.5,0.5,0]。对角线保留，首行至少可以看自己。

      填 0 仍会得到正概率。上三角是要遮住的部分，方向反过来会泄露未来。
  - id: llm.heads
    name: 拆头、分头注意与合头
    stage: '2'
    group: 3
    prereqs:
      - llm.causal
      - tensor.axes
      - tensor.reshape
    card: |-
      一个词向量可分给多个注意力头。每个头只处理自己那段特征，独自比较各个时间位置。用 B 表示批数、T 表示词数，把宽度 C 拆成 H 个头，每头 D=C/H 个分量。

      两个词各含四个数，分两头时，先把每个词的四格切成两对，得到 (B,T,H,D)，再换轴成 (B,H,T,D)。合头按相反顺序操作。

      直接 view 成目标形状也能数对格子，却可能让第一个头拿走同一个词的全部特征。
  - id: llm.norm
    name: 沿特征轴手写 LayerNorm
    stage: '3'
    group: 1
    prereqs:
      - tensor.reduce
      - math.spread
    card: |-
      一个词的特征有时整体偏大，有时相差很远。LayerNorm 在每个词内部先减去均值，再除以标准差，使后续层看到的数值尺度较稳定。归一化后，每个特征还可用自己的系数缩放、平移。

      一行 [2,6] 均值 4，偏差为 [−2,2]，平方平均为 4。两格都属于这一整行，所以分母用 2。给方差加上很小的 eps 再开方，可以处理所有数相同的一行。

      默认的样本方差会除以 n−1；与 nn.LayerNorm 对拍要用总体方差。
  - id: llm.residual
    name: 保留输入的残差连接
    stage: '3'
    group: 1
    prereqs:
      - tensor.broadcast
    card: |-
      一个网络层有时只需要修正输入的一小部分。残差连接把输入原样送到出口，再加上子层算出的改变量。这样子层输出为零时，信号仍然能穿过整个块。

      输入是 [4,2]，子层建议调整 [−1,3]，出口就得到 [3,5]。串联两次调整时，第二个分支读的是第一次相加后的结果；每条旁路都要记住它自己的入口。

      把子层输出直接传走会丢掉原输入；两项应形状相同并逐格相加。
  - id: llm.mlp
    name: 逐位置的 GELU 前馈层
    stage: '3'
    group: 2
    prereqs:
      - ml.mlp-forward
      - tensor.linear
    card: |-
      注意力把不同位置的信息混在一起，前馈层则让每个词内部的特征相互组合。先用一个线性层扩宽，再经过非线性函数 GELU，最后用另一个线性层收回原宽。每个词使用相同的两张表。

      输入宽 2，中间宽 4，输出宽 2，一句三个词会依次得到 (3,4) 和 (3,2)。GELU(x)=x·Φ(x)，其中 Φ 是标准正态分布累计概率。x 为 −1 时还能通过约 −0.159。

      用 ReLU 代替 GELU 会把负数全部截成零，和固定权重的目标模型不同。
  - id: llm.block
    name: 归一化在前的 Transformer 块
    stage: '3'
    group: 2
    prereqs:
      - llm.norm
      - llm.residual
      - llm.mlp
      - llm.heads
    card: |-
      一个 Transformer 块轮流交换两种信息：注意力从其他词取内容，前馈层在一个词里面重组特征。pre-norm 表示每个分支先把入口归一化，原输入则沿旁路保留。

      记入口为 x。注意力产生改量 a 后，先得到 y=x+a，再把归一化的 y 送入前馈层。若 x=2，两条分支依次交回 3 和 −1，出口就是 4。两次归一化各有自己的参数。

      把归一化放到残差相加之后是另一种运算顺序，即便所有形状都对，数值也会变。
  - id: llm.gpt
    name: 从权重字典还原 GPT 前向
    stage: '4'
    group: 1
    prereqs:
      - llm.block
      - llm.position
      - tensor.state
    card: |-
      语言模型读入一批 token 编号，为每个位置预测后继。输出层给词表里的每个词一个原始分数，叫 logit。保存模型时可以把每一层学到的表放进 state_dict，前向只需按名字取回这些表。

      两句各三个词、词表大小为 5，最后得到 (2,3,5)。先叠加词和位置嵌入，再经过因果块，最后一次 LayerNorm 后用输出权重给每个词打分。只有采样时才需要取概率。

      查词表和读出分数的权重都可能是 (V,C)，部件同形也不能互换；本线的两张表独立保存。
  - id: llm.greedy
    name: 用最后一格贪心续写
    stage: '4'
    group: 2
    prereqs:
      - llm.gpt
      - tensor.rank
    card: |-
      一次前向会产生多行分数。要续写当前句子，只需读最后一个位置，因为这行回答的是最后一个词之后会出现什么。贪心策略每次选该行分数最高的编号，然后把它接在句尾。

      若两行分数分别为 [9,0,1] 与 [0,4,3]，最后一行最大值位于下标 1，下一词就是 1。可直接比较 logits，softmax 不会改变它们从大到小的次序。

      最大分数本身不能当作 token；若最高分相同，本课取编号最小者。
  - id: llm.temperature
    name: 用温度调节概率
    stage: '4'
    group: 2
    prereqs:
      - llm.greedy
      - math.softmax
    card: |-
      总选最高分会让生成缺少变化。若按概率抽取，低分词也有机会出现。温度 T 在转成概率之前调节分数的间距：每个 logit 除以同一个正数 T，再做 softmax。

      分数 [0,2] 在 T=2 时变成 [0,1]，差距缩小；在 T=0.5 时变成 [0,4]，抽到高分的概率更大。温度为 1 就保留原本的概率分布。

      乘温度会把冷热效果颠倒。温度趋近于零会让概率集中，代码里不能直接用 0 作除数。
  - id: llm.top-k
    name: 按名次数量筛选与抽样
    stage: '4'
    group: 3
    prereqs:
      - llm.temperature
      - train.shuffle
    card: |-
      只有少数词与上下文搭配，给所有词抽签可能抽到很不合适的词。top-k 先按分数从高到低排队，只保留前 k 个，再在它们之间按概率抽取编号。

      若三个词得分 [1,4,2] 且 k=2，留下编号 1、2，编号 0 的概率为零。抽样用独立的 generator 保存随机状态；连续抽两次要让它往前走两步。

      排序位置不等于词表编号。并列时本线按原编号升序排；抽样使用原词表顺序的概率向量。
  - id: llm.top-p
    name: 按累计概率筛选与抽样
    stage: '4'
    group: 3
    prereqs:
      - llm.top-k
    card: |-
      固定 k 规定了留下几个词，却没有保证这些词能解释多少概率。top-p 先按概率从大到小排，从第一项起一直取到累计概率达到 p 为止。分布很尖时，一个词就可能足够。

      概率 [0.5,0.3,0.2]、p=0.7。第一项只有 0.5，加第二项才到 0.8，所以保留前两项。若 p=0.5，第一项恰达门槛，后面的都可舍去。

      决定是否取当前项，要看加入它之前的累计值是否还小于 p。筛后重新归一化，再在原词表顺序上抽样。
  - id: llm.stop
    name: 结束符与新词预算
    stage: '4'
    group: 3
    prereqs:
      - llm.greedy
      - llm.special
    card: |-
      生成循环需要两个出口。结束符 EOS 是词表中约好的“到这里结束”；最大新词数则让一直没产生 EOS 的模型也能停下来。每次接上一个词，就要立刻检查它是否为 EOS。

      提示有三个词，预算是两个新词。即使提示已长于预算，仍可生成两次；若第一抽就是 EOS，就只添加这一个。本线返回的完整序列包含这个结束符，提示已经以 EOS 结尾时直接返回。

      限制的是新增数量。按总长度截断会意外吃掉提示，看到 EOS 后再调用一次模型又会多算一步。
  - id: llm.train-lm
    name: 短文本上的下一词训练
    stage: '5'
    group: 1
    prereqs:
      - llm.gpt
      - train.ce
      - train.loop
      - llm.alphabet
    card: |-
      训练语言模型要为每个位置准备一个正确的下一词。一段长 T+1 的文本能提供 T 对输入与目标。输入取前 T 个词，目标向后错开一格。模型在同一批位置上得到多个学习信号。

      文本 abca 编成 [0,1,2,0]，输入 [0,1,2]，目标 [1,2,0]。对 logits 的词表轴算交叉熵，再用优化器更新。反复读同一小批次几十步，可用实际记录的损失检查循环是否有效。

      把输入复制成标签是在训练复述当前词；能预测后继才符合这次任务。
  - id: llm.kv
    name: 保存历史的键和值
    stage: '5'
    group: 2
    prereqs:
      - llm.gpt
      - llm.heads
      - llm.causal
      - llm.greedy
      - llm.position
    card: |-
      逐词生成时，因果掩码使旧位置看不见后来加入的词，旧键 K 和值 V 因而能保留。新查询只需与历史以及自己的键打分，再用权重读取对应的值。这份逐层保存的记录叫 KV cache。

      形状 (B,H,3,D) 的缓存加入一个新词，沿时间轴 2 拼成 (B,H,4,D)。新词的绝对位置是 3。若一次补入两个词，第一个新查询仍不能看到第二个新键。

      沿头轴拼接会改变头数；对带历史的短查询直接套从 0 起的三角掩码，又会漏掉一部分已经读过的位置。
  - id: llm.cache-cost
    name: 计算缓存节省的工作
    stage: '5'
    group: 2
    prereqs:
      - llm.kv
      - py.accumulator
    card: |-
      同一个词在没有缓存时会被重复投影。要估算节省的工作，先说明数什么：一格输入做一次投影，和一条查询对一个键算一次分数，是两种不同单位。生成一个新词需要一次前向。

      提示长 3，要生成 3 次。重算投影 3+4+5=12 格，缓存只投影 3+1+1=5 格。最后一个刚生成的词还没作为输入。即便使用缓存，第五个位置的查询仍需读取五个键。

      缓存可复用旧键值，但新词仍要读历史。计算得分对时还要约定按所有密集格还是只数因果可见格。
