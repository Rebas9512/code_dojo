wrong_examples:
  - why: 替换后只走一格，会重复消耗已经配对的右邻居。
    code: |
      def merge_once(ids, pair, fresh):
          result = []
          i = 0
          while i < len(ids):
              if ids[i:i + 2] == pair:
                  result.append(fresh)
                  i += 1
              else:
                  result.append(ids[i])
                  i += 1
          return result
