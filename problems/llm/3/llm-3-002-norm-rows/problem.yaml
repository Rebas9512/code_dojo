wrong_examples:
  - why: 用所有词的平均平方偏差会让各行互相影响。
    code: |
      import torch


      def standardize(x, eps):
          x = torch.tensor(x, dtype=torch.float32)
          delta = x - torch.mean(x, dim=-1, keepdim=True)
          variance = torch.mean(delta * delta)
          return delta / torch.sqrt(variance + eps)
