checks:
  - label: 计算销售额环比
    result: true
  - label: 七月起的新增记录
    query: |
      SELECT order_month, order_count, revenue, growth_pct
      FROM monthly_change
      WHERE order_month >= DATE '2025-07-01'
wrong_examples:
  - why: 跨过缺月取上一次有销售的记录
    sql: |
        SELECT order_month, order_count, revenue,
               ROUND(100 * (revenue - prior) / NULLIF(prior, 0), 2) AS growth_pct
        FROM (
            SELECT m.*, LAG(revenue) OVER (ORDER BY order_month) AS prior
            FROM monthly_sales AS m
        ) AS history
  - why: 用本月销售额作分母
    sql: |
        SELECT cur.order_month, cur.order_count, cur.revenue,
               ROUND(100 * (cur.revenue - prev.revenue) / NULLIF(cur.revenue, 0), 2) AS growth_pct
        FROM monthly_sales AS cur
        LEFT JOIN monthly_sales AS prev ON prev.order_month = cur.order_month - INTERVAL '1 month'
