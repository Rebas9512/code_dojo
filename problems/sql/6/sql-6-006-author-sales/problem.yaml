checks:
  - label: 结算每位作者的月度贡献
    result: true
  - label: 七月起的新增记录
    query: |
      SELECT order_month, author_id, author_revenue
      FROM author_sales
      WHERE order_month >= DATE '2025-07-01'
wrong_examples:
  - why: 给没有编号的作者也出了一张月账
    sql: |
        SELECT order_month, author_id, SUM(line_amount) AS author_revenue
        FROM line_amounts
        GROUP BY order_month, author_id
  - why: 同一作者的同额明细只加一次
    sql: |
        SELECT order_month, author_id, SUM(DISTINCT line_amount) AS author_revenue
        FROM line_amounts
        WHERE author_id IS NOT NULL
        GROUP BY order_month, author_id
