  - label: 七月起的新增记录
    query: |
      SELECT order_month, repeat_count
      FROM repeat_buyers
      WHERE order_month >= DATE '2025-07-01'
wrong_examples:
  - why: 把复购订单数当成了复购人数
    sql: |
        SELECT order_month, COUNT(*) AS repeat_count
        FROM (
            SELECT order_month, user_id,
                   ROW_NUMBER() OVER (
                       PARTITION BY user_id
                       ORDER BY order_date, order_id
                   ) AS purchase_no
            FROM valid_orders
        ) AS purchases
        WHERE purchase_no > 1
        GROUP BY order_month
  - why: 每个月都重置购买历史
    sql: |
        SELECT order_month, COUNT(DISTINCT user_id) AS repeat_count
        FROM (
            SELECT order_month, user_id,
                   ROW_NUMBER() OVER (
                       PARTITION BY user_id, order_month
                       ORDER BY order_date, order_id
                   ) AS purchase_no
            FROM valid_orders
        ) AS purchases
        WHERE purchase_no > 1
        GROUP BY order_month
