checks:
  - label: 给每月的分类销售额排名
    result: true
  - label: 七月起的新增记录
    query: |
      SELECT order_month, category, category_revenue, sales_rank
      FROM category_ranks
      WHERE order_month >= DATE '2025-07-01'
wrong_examples:
  - why: 并列后跳过了下一名
    sql: |
        SELECT order_month, category, SUM(line_amount) AS category_revenue,
               RANK() OVER (
                   PARTITION BY order_month
                   ORDER BY SUM(line_amount) DESC
               ) AS sales_rank
        FROM line_amounts
        GROUP BY order_month, category
  - why: 把各月的分类放进同一次排名
    sql: |
        SELECT order_month, category, SUM(line_amount) AS category_revenue,
               DENSE_RANK() OVER (
                   ORDER BY SUM(line_amount) DESC
               ) AS sales_rank
        FROM line_amounts
        GROUP BY order_month, category
