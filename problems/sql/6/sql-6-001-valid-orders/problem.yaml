checks:
  - label: 筛出有效订单
    result: true
  - label: 七月起的新增记录
    query: |
      SELECT order_id, user_id, order_date, order_month
      FROM valid_orders
      WHERE order_month >= DATE '2025-07-01'
wrong_examples:
  - why: 只剔除取消单，测试券仍可入账
    sql: |
        SELECT order_id, user_id, order_date,
               DATE_TRUNC('month', order_date)::date AS order_month
        FROM orders
        WHERE status <> 'cancelled'
  - why: 直接比较券码，漏掉所有未用券的订单
    sql: |
        SELECT order_id, user_id, order_date,
               DATE_TRUNC('month', order_date)::date AS order_month
        FROM orders
        WHERE status <> 'cancelled'
          AND coupon_code <> 'TEST'
