hints:
  - 先检查连接以后还剩几张不同的领卡，再去算比例。
wrong_examples:
  - why: 内连接使未返回的领卡人消失
    sql: |-
      SELECT c.issued, ROUND(1.0 * COUNT(DISTINCT t.card) / COUNT(DISTINCT c.card), 2) AS share
      FROM card_issues c JOIN card_taps t ON t.card = c.card AND t.day = c.issued + 1
      GROUP BY c.issued;
  - why: 分母按连接后的行数计算
    sql: |-
      SELECT c.issued, ROUND(1.0 * COUNT(DISTINCT t.card) / COUNT(*), 2) AS share
      FROM card_issues c LEFT JOIN card_taps t ON t.card = c.card AND t.day = c.issued + 1
      GROUP BY c.issued;
