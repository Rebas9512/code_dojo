wrong_examples:
  - why: 先把相同时长去重了
    sql: |-
      SELECT press, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY minutes) AS median_minutes
      FROM (SELECT DISTINCT press, minutes FROM bind_times) AS observations GROUP BY press;
  - why: 把未知时长按零计入
    sql: |-
      SELECT press, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY COALESCE(minutes, 0)) AS median_minutes
      FROM bind_times GROUP BY press;
