wrong_examples:
  - why: 按刷卡次数计回访
    sql: |-
      SELECT c.issued, COUNT(DISTINCT c.card) AS issued_cards, COUNT(t.card) AS returned
      FROM card_issues c LEFT JOIN card_taps t ON t.card = c.card AND t.day = c.issued + 1
      GROUP BY c.issued;
  - why: 把次日之后也算返回
    sql: |-
      SELECT c.issued, COUNT(DISTINCT c.card) AS issued_cards, COUNT(DISTINCT t.card) AS returned
      FROM card_issues c LEFT JOIN card_taps t ON t.card = c.card AND t.day >= c.issued + 1
      GROUP BY c.issued;
