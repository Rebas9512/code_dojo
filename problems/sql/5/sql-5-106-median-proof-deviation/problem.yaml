wrong_examples:
  - why: 提前和延迟的方向颠倒
    sql: |-
      SELECT route, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY promised - actual) AS median_days
      FROM delivery_notes GROUP BY route;
  - why: 偶数组只取低中点
    sql: |-
      SELECT route, PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY actual - promised) AS median_days
      FROM delivery_notes GROUP BY route;
