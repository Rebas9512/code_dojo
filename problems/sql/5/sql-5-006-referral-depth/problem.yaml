wrong_examples:
  - why: 把读者自己也算进推荐层数
    sql: |
      WITH RECURSIVE tree AS (
          SELECT user_id, 1 AS depth FROM users WHERE referrer_id IS NULL
          UNION ALL
          SELECT child.user_id, parent.depth + 1 FROM tree parent
          JOIN users child ON child.referrer_id = parent.user_id
      )
      SELECT user_id, depth FROM tree;
