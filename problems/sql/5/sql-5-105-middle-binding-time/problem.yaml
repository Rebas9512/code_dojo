hints:
  - 连续分位数会在两个中点之间插值，排序列应放在 WITHIN GROUP 中。
wrong_examples:
  - why: 拿较低的实测值
    sql: |-
      SELECT press, PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY minutes) AS median_minutes
      FROM bind_times GROUP BY press;
  - why: 使用均值
    sql: |-
      SELECT press, AVG(minutes) AS median_minutes
      FROM bind_times GROUP BY press;
