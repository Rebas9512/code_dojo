hints:
  - 每个柜台分别选出纸种、柜台名及报价，然后纵向拼接三份结果。
wrong_examples:
  - why: 丢掉合法零价
    sql: |-
      SELECT paper, 'east' AS counter, east AS price FROM quote_board WHERE east IS NOT NULL
      UNION ALL
      SELECT paper, 'west', west FROM quote_board WHERE west > 0
      UNION ALL
      SELECT paper, 'pier', pier FROM quote_board WHERE pier IS NOT NULL;
  - why: 误把西柜的价格贴到码头柜
    sql: |-
      SELECT paper, 'east' AS counter, east AS price FROM quote_board WHERE east IS NOT NULL
      UNION ALL
      SELECT paper, 'west', west FROM quote_board WHERE west IS NOT NULL
      UNION ALL
      SELECT paper, 'pier', west FROM quote_board WHERE pier IS NOT NULL;
