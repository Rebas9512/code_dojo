wrong_examples:
  - why: 只走到孩子一层
    sql: |-
      WITH RECURSIVE branch AS (
          SELECT unit, 0 AS depth FROM archive_units WHERE unit = 11
          UNION ALL
          SELECT u.unit, b.depth + 1 FROM archive_units u JOIN branch b ON u.parent = b.unit WHERE b.depth = 0
      )
      SELECT unit, depth FROM branch;
  - why: 从整棵树的根开始
    sql: |-
      WITH RECURSIVE branch AS (
          SELECT unit, 0 AS depth FROM archive_units WHERE parent IS NULL
          UNION ALL
          SELECT u.unit, b.depth + 1 FROM archive_units u JOIN branch b ON u.parent = b.unit
      )
      SELECT unit, depth FROM branch;
