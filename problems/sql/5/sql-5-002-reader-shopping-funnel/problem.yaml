id: sql-5-002-reader-shopping-funnel
title: 补全：浏览到付款还剩几位读者
track: sql
stage: '5'
order: 20
format: complete
difficulty: 66
skills:
  requires:
    - sql.distinct
    - sql.join-aggregate
    - sql.join-conditions
    - sql.multi-join
    - sql.self-join
    - sql.subquery-scalar
  introduces: sql.funnel
source: original
leetcode: null
milestones: []
datasets:
  - db:bookstore
  - db:bookstore + datasets/same-time.sql
  - db:bookstore + datasets/retry.sql
ordered: false
hints:
  - 先保留最早浏览，再找它之后最早的加购。
wrong_examples:
  - why: 同时刻也算下一步
    sql: |
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM reader_events WHERE action = 'view' GROUP BY user_id
      ), carts AS (
          SELECT v.user_id, MIN(e.happened_at) AS carted FROM views v
          JOIN reader_events e ON e.user_id = v.user_id AND e.happened_at >= v.viewed
          WHERE e.action = 'cart' GROUP BY v.user_id
      ), buyers AS (
          SELECT DISTINCT c.user_id FROM carts c JOIN reader_events e
            ON e.user_id = c.user_id AND e.happened_at > c.carted WHERE e.action = 'buy'
      )
      SELECT (SELECT COUNT(*) FROM views) AS viewers,
             (SELECT COUNT(*) FROM carts) AS cart_users,
             (SELECT COUNT(*) FROM buyers) AS buyers;
  - why: 把先买后加购也算付款
    sql: |
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM reader_events WHERE action = 'view' GROUP BY user_id
      ), carts AS (
          SELECT v.user_id, MIN(e.happened_at) AS carted FROM views v
          JOIN reader_events e ON e.user_id = v.user_id AND e.happened_at > v.viewed
          WHERE e.action = 'cart' GROUP BY v.user_id
      ), buyers AS (
          SELECT DISTINCT c.user_id FROM carts c JOIN reader_events e
            ON e.user_id = c.user_id WHERE e.action = 'buy'
      )
      SELECT (SELECT COUNT(*) FROM views) AS viewers,
             (SELECT COUNT(*) FROM carts) AS cart_users,
             (SELECT COUNT(*) FROM buyers) AS buyers;
