  - 两个员工都做了三年，平均时应该有几个 3？
wrong_examples:
  - why: 把经验年数相同的成员合并
    sql: |
      SELECT a.project_id, ROUND(AVG(DISTINCT p.years), 2) AS mean_years
      FROM assignments a
      JOIN people p ON p.person_id = a.person_id
      GROUP BY a.project_id;
  - why: 项目成员的平均从业年数忘了四舍五入
    sql: |
      SELECT a.project_id, AVG(p.years) AS mean_years
      FROM assignments a
      JOIN people p ON p.person_id = a.person_id
      GROUP BY a.project_id;
