hints:
  - 让同一张日记分别扮演今天和昨天，算出昨天对应的下一天。
wrong_examples:
  - why: 把编号相邻误作日期相邻
    sql: |
      SELECT today.log_id
      FROM weather today
      JOIN weather prev ON today.log_id = prev.log_id + 1
      WHERE today.degrees > prev.degrees;
  - why: 等温也算升温
    sql: |
      SELECT today.log_id
      FROM weather today
      JOIN weather prev ON today.day = prev.day + 1
      WHERE today.degrees >= prev.degrees;
