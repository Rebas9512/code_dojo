hints:
  - 把真实分机和默认文字分别当成第一个参数，比较哪一个能保留已分配号码。
wrong_examples:
  - why: 默认值排在真实号码前
    sql: |-
      SELECT b.badge, COALESCE('unrouted', e.dial) AS dial
      FROM binders b LEFT JOIN extensions e ON e.badge = b.badge;
  - why: 缺失号码者消失
    sql: |-
      SELECT b.badge, COALESCE(e.dial, 'unrouted') AS dial
      FROM binders b JOIN extensions e ON e.badge = b.badge;
