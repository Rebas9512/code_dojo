ordered: false
hints:
  - 先运行原稿。报错里的 ifnull 就是 SELECT 中用来处理缺失分机的函数。
  - PostgreSQL 用 COALESCE 从左到右取第一个非空值。先看真实分机，缺失时才用默认文字。
  - "把 IFNULL(e.dial, 'unrouted') 换成 COALESCE(e.dial, 'unrouted')。11 号应保留 X8，12 号应显示 unrouted。"
wrong_examples:
  - why: 默认值排在真实号码前
    sql: |-
      SELECT b.badge, COALESCE('unrouted', e.dial) AS dial
      FROM binders b LEFT JOIN extensions e ON e.badge = b.badge;
  - why: 缺失号码者消失
    sql: |-
      SELECT b.badge, COALESCE(e.dial, 'unrouted') AS dial
      FROM binders b JOIN extensions e ON e.badge = b.badge;
