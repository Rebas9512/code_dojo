ordered: false
hints:
  - 把两个事件看成同一批的两端。机器号和批号要同时相同。
wrong_examples:
  - why: 只用批号配对，混入别台机器的结束时刻
    sql: |
      SELECT s.machine_id, ROUND(AVG(e.moment - s.moment), 3) AS mean_seconds
      FROM events s
      JOIN events e ON e.batch_id = s.batch_id
      WHERE s.kind = 'start' AND e.kind = 'end'
      GROUP BY s.machine_id;
  - why: 拿最长批次作为平均用时
    sql: |
      SELECT s.machine_id, ROUND(MAX(e.moment - s.moment), 3) AS mean_seconds
      FROM events s
      JOIN events e ON e.machine_id = s.machine_id AND e.batch_id = s.batch_id
      WHERE s.kind = 'start' AND e.kind = 'end'
      GROUP BY s.machine_id;
  - why: 忘了把每台机器的平均用时四舍五入到三位小数
    sql: |
      SELECT s.machine_id, AVG(e.moment - s.moment) AS mean_seconds
      FROM events s
      JOIN events e ON e.machine_id = s.machine_id AND e.batch_id = s.batch_id
      WHERE s.kind = 'start' AND e.kind = 'end'
      GROUP BY s.machine_id;
