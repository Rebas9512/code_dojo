hints:
  - 给同一张表起两个别名，一个角色指向另一个角色的 badge。
wrong_examples:
  - why: 产量相同也入选
    sql: |-
      SELECT a.badge FROM crew_yields a
      JOIN crew_yields m ON m.badge = a.mentor
      WHERE a.daily >= m.daily;
  - why: 比较师徒的方向相反
    sql: |-
      SELECT a.badge FROM crew_yields a
      JOIN crew_yields m ON m.badge = a.mentor
      WHERE a.daily < m.daily;
