hints:
  - 用名册保留零里程员工，再用第二个排序键排好同里程者。
wrong_examples:
  - why: 无行时得到空值
    sql: |-
      SELECT b.given, SUM(r.km) AS distance
      FROM binders b LEFT JOIN route_lengths r ON r.badge = b.badge
      GROUP BY b.badge, b.given ORDER BY distance DESC, b.given;
  - why: 并列时姓名倒序
    sql: |-
      SELECT b.given, COALESCE(SUM(r.km), 0) AS distance
      FROM binders b LEFT JOIN route_lengths r ON r.badge = b.badge
      GROUP BY b.badge, b.given ORDER BY distance DESC, b.given DESC;
