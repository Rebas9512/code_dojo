wrong_examples:
  - why: 检查所有包裹，误排除只有待签包裹的工坊
    sql: |-
      SELECT s.shop FROM parcel_shops s
      LEFT JOIN parcel_log p ON p.shop = s.shop
      WHERE p.parcel IS NULL;
  - why: 查成没有寄出记录的工坊
    sql: |-
      SELECT s.shop FROM parcel_shops s
      LEFT JOIN parcel_log p ON p.shop = s.shop AND p.state = 'sent'
      WHERE p.parcel IS NULL;
