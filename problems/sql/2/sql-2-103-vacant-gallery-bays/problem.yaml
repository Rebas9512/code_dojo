wrong_examples:
  - why: 把无备注当作无作品
    sql: |-
      SELECT g.hall FROM galleries g
      LEFT JOIN exhibits e ON e.hall = g.hall
      WHERE e.memo IS NULL;
  - why: 只留有作品的厅
    sql: |-
      SELECT g.hall FROM galleries g
      LEFT JOIN exhibits e ON e.hall = g.hall
      WHERE e.work IS NOT NULL;
