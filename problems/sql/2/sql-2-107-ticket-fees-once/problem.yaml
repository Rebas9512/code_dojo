hints:
  - 先确认费用是每张工单一笔。加入零件表后，一张工单可能出现在几行？
wrong_examples:
  - why: 连接零件后，同一工单费被重复累加
    sql: |-
      SELECT p.press, COALESCE(SUM(f.fee), 0) AS fees
      FROM presses p LEFT JOIN job_fees f ON f.press = p.press
      LEFT JOIN job_parts j ON j.job = f.job
      GROUP BY p.press;
  - why: 不同工单同价就被去重
    sql: |-
      SELECT p.press, COALESCE(SUM(DISTINCT f.fee), 0) AS fees
      FROM presses p LEFT JOIN job_fees f ON f.press = p.press
      GROUP BY p.press;
