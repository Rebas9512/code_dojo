hints:
  - 先运行原稿。报错指向数字 1，它位于 DATE_ADD 的 INTERVAL 1 DAY 里。这里要从哪一天往后推？
  - PostgreSQL 的 date 列可以直接用加号加整数，整数表示往后推几天。
  - 把 DATE_ADD(p.day, INTERVAL 1 DAY) 换成 p.day + 1。保留 n.day = p.day + 1，同一台机器的 1 月 31 日就能配上 2 月 1 日。
wrong_examples:
  - why: 把加一天写成减一天
    sql: |-
      SELECT n.press, n.day FROM ink_checks n
      JOIN ink_checks p ON n.press = p.press AND n.day = p.day - 1
      WHERE n.shade > p.shade;
  - why: 只要更早便配对
    sql: |-
      SELECT n.press, n.day FROM ink_checks n
      JOIN ink_checks p ON n.press = p.press AND n.day > p.day
      WHERE n.shade > p.shade;
