hints:
  - 先搭齐全部格子，再把购买记录配到对应的用户和分类。
wrong_examples:
  - why: 一单同类多种书被计作多单
    sql: |
      SELECT u.user_id, c.category, COUNT(p.order_id) AS order_count
      FROM users u
      CROSS JOIN categories c
      LEFT JOIN purchases p ON p.user_id = u.user_id AND p.category = c.category
      GROUP BY u.user_id, c.category;
  - why: 只剩有消费的组合
    sql: |
      SELECT u.user_id, c.category, COUNT(DISTINCT p.order_id) AS order_count
      FROM users u
      CROSS JOIN categories c
      JOIN purchases p ON p.user_id = u.user_id AND p.category = c.category
      GROUP BY u.user_id, c.category;
