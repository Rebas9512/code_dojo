wrong_examples:
  - why: 把右表日期筛选移到 WHERE
    sql: |-
      SELECT w.shop, w.opened, COUNT(o.ticket) AS tickets
      FROM workshops w LEFT JOIN print_orders o
        ON w.shop = o.shop
      WHERE o.placed >= DATE '2025-01-01' AND o.placed < DATE '2026-01-01'
      GROUP BY w.shop, w.opened;
  - why: 无匹配也数为一单
    sql: |-
      SELECT w.shop, w.opened, COUNT(*) AS tickets
      FROM workshops w LEFT JOIN print_orders o
        ON w.shop = o.shop
       AND o.placed >= DATE '2025-01-01' AND o.placed < DATE '2026-01-01'
      GROUP BY w.shop, w.opened;
