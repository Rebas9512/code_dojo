hints:
  - 给每个登录日贴上该玩家的首登日。两日之差应当是多少？
wrong_examples:
  - why: 把登录天数当作玩家数
    sql: |
      WITH visits AS (
          SELECT player, day, MIN(day) OVER (PARTITION BY player) AS first_day FROM play_days
      )
      SELECT 1.0 * COUNT(CASE WHEN day = first_day + 1 THEN 1 END) / COUNT(*) AS fraction
      FROM visits;
  - why: 只要后来回来过就算
    sql: |
      WITH visits AS (
          SELECT player, day, MIN(day) OVER (PARTITION BY player) AS first_day FROM play_days
      )
      SELECT 1.0 * COUNT(CASE WHEN day > first_day THEN 1 END) / COUNT(DISTINCT player) AS fraction
      FROM visits;
