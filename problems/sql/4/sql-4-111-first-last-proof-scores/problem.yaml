id: sql-4-111-first-last-proof-scores
title: 对照同一读者的首末校样成绩
track: sql
stage: '4'
order: 98
format: combine
difficulty: 58
skills:
  requires:
    - sql.and-or
    - sql.lag-lead
    - sql.top-n-per-group
  introduces: null
source: leetcode-db
leetcode: find-students-who-improved
milestones: []
datasets:
  - datasets/sample.sql
  - datasets/sample.sql + datasets/more.sql
  - datasets/sample.sql + datasets/edge.sql
ordered: true
hints:
  - 按人和主题划分记录，先固定首末顺序，再比较两端的分数。
wrong_examples:
  - why: 持平也算提高
    sql: |-
      WITH ends AS (
          SELECT reader, topic, score,
                 FIRST_VALUE(score) OVER (PARTITION BY reader, topic ORDER BY day, trial) AS first_score,
                 ROW_NUMBER() OVER (PARTITION BY reader, topic ORDER BY day DESC, trial DESC) AS pos
          FROM proof_trials WHERE day IS NOT NULL
      )
      SELECT reader, topic, first_score, score AS last_score FROM ends
      WHERE pos = 1 AND score >= first_score ORDER BY reader, topic;
  - why: 把倒数第二次当末次
    sql: |-
      WITH ends AS (
          SELECT reader, topic, score,
                 FIRST_VALUE(score) OVER (PARTITION BY reader, topic ORDER BY day, trial) AS first_score,
                 ROW_NUMBER() OVER (PARTITION BY reader, topic ORDER BY day DESC, trial DESC) AS pos
          FROM proof_trials WHERE day IS NOT NULL
      )
      SELECT reader, topic, first_score, score AS last_score FROM ends
      WHERE pos = 2 AND score > first_score ORDER BY reader, topic;
