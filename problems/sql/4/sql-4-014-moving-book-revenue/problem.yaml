wrong_examples:
  - why: 将当天也算在七个之前以外，多取一天
    sql: |
      WITH measured AS (
          SELECT day, ROW_NUMBER() OVER (ORDER BY day) AS n,
                 AVG(amount) OVER (ORDER BY day ROWS BETWEEN 7 PRECEDING AND CURRENT ROW) AS mean_amount
          FROM shop_calendar
      )
      SELECT day, mean_amount FROM measured WHERE n >= 7 ORDER BY day;
