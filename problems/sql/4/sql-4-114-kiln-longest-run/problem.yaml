wrong_examples:
  - why: 把分开的几段加在一起
    sql: |-
      WITH days AS (
          SELECT DISTINCT kiln, day FROM kiln_checks WHERE day IS NOT NULL
      ), tagged AS (
          SELECT kiln, day, day - (ROW_NUMBER() OVER (PARTITION BY kiln ORDER BY day))::int AS block
          FROM days
      ), lengths AS (
          SELECT kiln, block, COUNT(*) AS length FROM tagged GROUP BY kiln, block
      )
      SELECT kiln, SUM(length) AS longest FROM lengths GROUP BY kiln;
  - why: 按月重置连续段
    sql: |-
      WITH days AS (
          SELECT DISTINCT kiln, day FROM kiln_checks WHERE day IS NOT NULL
      ), tagged AS (
          SELECT kiln, day, day - (ROW_NUMBER() OVER (PARTITION BY kiln ORDER BY day))::int AS block
          FROM days
      ), lengths AS (
          SELECT kiln, block, COUNT(*) AS length FROM tagged GROUP BY kiln, block, EXTRACT(MONTH FROM day)
      )
      SELECT kiln, MAX(length) AS longest FROM lengths GROUP BY kiln;
