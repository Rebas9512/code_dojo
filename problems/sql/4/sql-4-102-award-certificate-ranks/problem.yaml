hints:
  - 先对每架已知分数排名，再选择冠军；注意窗口里加入唯一编号会拆散并列。
wrong_examples:
  - why: 按行发号拆开同分
    sql: |-
      WITH awards AS (
          SELECT sheet, rack, score, ROW_NUMBER() OVER (PARTITION BY rack ORDER BY score DESC) AS place
          FROM proof_marks WHERE score IS NOT NULL
      )
      SELECT rack, sheet, score FROM awards WHERE place = 1;
  - why: 不同架一起排名
    sql: |-
      WITH awards AS (
          SELECT sheet, rack, score, RANK() OVER (ORDER BY score DESC) AS place
          FROM proof_marks WHERE score IS NOT NULL
      )
      SELECT rack, sheet, score FROM awards WHERE place = 1;
