hints:
  - 先运行原稿。报错指向逗号，回看逗号前的 rack，它两边用的是什么引号？
  - MySQL 用反引号括住列名。PostgreSQL 用双引号括住列名，像 rack 这样的全小写名称也可以直接写。
  - '把第一列改成 "rack"，保留后面的 SUM(sheets) AS total。A 架的第一列应显示 A。'
wrong_examples:
  - why: 把标识符误译成文字
    sql: SELECT 'rack', SUM(sheets) AS total FROM sheet_lots GROUP BY rack;
  - why: 只取最大的一批
    sql: SELECT "rack", MAX(sheets) AS total FROM sheet_lots GROUP BY rack;
