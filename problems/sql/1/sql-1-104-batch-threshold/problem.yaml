wrong_examples:
  - why: 先在 WHERE 丢弃单批不足七张的记录
    sql: |-
      SELECT rack, SUM(sheets) AS sheets FROM sheet_lots
      WHERE sheets >= 7 GROUP BY rack;
  - why: 漏掉恰好七张
    sql: |-
      SELECT rack, SUM(sheets) AS sheets FROM sheet_lots
      GROUP BY rack HAVING SUM(sheets) > 7;
