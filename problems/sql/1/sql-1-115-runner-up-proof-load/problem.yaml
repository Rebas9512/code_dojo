hints:
  - 先运行原稿。报错提到 LIMIT 和逗号。读一遍 LIMIT 2, 1，哪个数表示跳过几行？
  - PostgreSQL 用 LIMIT 指定取几行，用 OFFSET 指定先跳过几行。
  - 把 LIMIT 2, 1 换成 LIMIT 1 OFFSET 2。排序后跳过 P 和 Q，接下来只取 R。
wrong_examples:
  - why: 把跳过行数与返回行数写反
    sql: |-
      SELECT bench, SUM(sheets) AS total FROM load_slips
      GROUP BY bench ORDER BY total DESC, bench LIMIT 2 OFFSET 1;
  - why: 偏移只跳过第一名
    sql: |-
      SELECT bench, SUM(sheets) AS total FROM load_slips
      GROUP BY bench ORDER BY total DESC, bench LIMIT 1 OFFSET 1;
