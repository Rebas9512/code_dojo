# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "用了 <=，把正好 30 元的也算进去了"
    sql: |
      SELECT title, price FROM books WHERE price <= 30;
  - why: "方向反了"
    sql: |
      SELECT title, price FROM books WHERE price > 30;
