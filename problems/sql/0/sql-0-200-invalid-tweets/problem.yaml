  - 先数出整条原文有几个字符，再判断它有没有超过上限。
wrong_examples:
  - why: 把恰好 15 个字符也算作超长。
    sql: |
      SELECT tweet_id FROM tweets WHERE LENGTH(content) >= 15;
  - why: 先去掉首尾空格，低估了原文的长度。
    sql: |
      SELECT tweet_id FROM tweets WHERE LENGTH(TRIM(content)) > 15;
