  - 一个编号的首字符可能是整段文字的第一个字符，也可能紧跟在空格后面。
wrong_examples:
  - why: 只从整段开头找，漏掉第二个或更后面的编号。
    sql: |
      SELECT patient_id, patient_name, conditions FROM patients
      WHERE conditions LIKE 'DIAB1%';
  - why: 在编号内部也匹配了 DIAB1。
    sql: |
      SELECT patient_id, patient_name, conditions FROM patients
      WHERE conditions LIKE '%DIAB1%';
