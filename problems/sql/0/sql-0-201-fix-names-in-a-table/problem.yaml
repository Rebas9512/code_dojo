hints:
  - 把第一个字符和从第二个字符开始的部分分别处理，再拼起来。
wrong_examples:
  - why: 只改首字母，保留了后面原有的大写字母。
    sql: |
      SELECT user_id, UPPER(LEFT(name, 1)) || SUBSTRING(name FROM 2) AS name
      FROM users ORDER BY user_id;
  - why: 把名册按整理后的姓名排序。
    sql: |
      SELECT user_id, UPPER(LEFT(name, 1)) || LOWER(SUBSTRING(name FROM 2)) AS name
      FROM users ORDER BY name, user_id;
