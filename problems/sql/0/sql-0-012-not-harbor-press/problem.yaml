# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "只写 <>：publisher 为 NULL 的行比较结果是\"未知\"，被丢掉了"
    sql: |
      SELECT title, publisher FROM books WHERE publisher <> 'Harbor Press';
  - why: "只要了出版社为空的书"
    sql: |
      SELECT title, publisher FROM books WHERE publisher IS NULL;
