# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "5 本也算成了 low"
    sql: |
      SELECT title, CASE WHEN stock = 0 THEN 'sold out' WHEN stock <= 5 THEN 'low' ELSE 'in stock' END FROM books;
  - why: "4 本算成了 in stock"
    sql: |
      SELECT title, CASE WHEN stock = 0 THEN 'sold out' WHEN stock < 4 THEN 'low' ELSE 'in stock' END FROM books;
