wrong_examples:
  - why: 只写编号不等于 2，漏掉了未填推荐人的顾客。
    sql: |
      SELECT name FROM customer WHERE referee_id <> 2;
  - why: 对姓名去重，使同名的两位收件人少了一行。
    sql: |
      SELECT DISTINCT name FROM customer WHERE referee_id <> 2 OR referee_id IS NULL;
