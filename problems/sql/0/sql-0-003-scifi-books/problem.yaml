# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "大小写不对：'Scifi' 和 'scifi' 不相等"
    sql: |
      SELECT book_id, title FROM books WHERE category = 'Scifi';
  - why: "条件写反了"
    sql: |
      SELECT book_id, title FROM books WHERE category <> 'scifi';
  - why: "忘了写 WHERE"
    sql: |
      SELECT book_id, title FROM books;
