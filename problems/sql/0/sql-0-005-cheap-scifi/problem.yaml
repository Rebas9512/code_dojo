  - "两个条件都要满足，用 AND 连接。"
# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "用了 OR：只要满足一个条件就算"
    sql: |
      SELECT title, price FROM books WHERE category = 'scifi' OR price < 40;
  - why: "用了 <=，40 元整的也算进去了"
    sql: |
      SELECT title, price FROM books WHERE category = 'scifi' AND price <= 40;
