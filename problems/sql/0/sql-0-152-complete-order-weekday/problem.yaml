hints:
  - EXTRACT 可以从日期中取出一个部分。DOW 的编号从星期日的 0 开始。
wrong_examples:
  - why: 按每月几号取数，得到的是月份里的第几天。
    sql: |
      SELECT order_id, EXTRACT(DAY FROM order_date) AS weekday FROM orders;
  - why: 按星期一到星期日编号为 1 到 7，星期日会变成 7。
    sql: |
      SELECT order_id, EXTRACT(ISODOW FROM order_date) AS weekday FROM orders;
