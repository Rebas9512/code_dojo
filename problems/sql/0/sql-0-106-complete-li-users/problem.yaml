hints:
  - "% 代表任意多个字符；把空格写进模式里。"
# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "模式里没有空格，Lin、Liu 也被匹配"
    sql: |
      SELECT user_id, name FROM users WHERE name LIKE 'Li%';
  - why: "前面多了 %，名字中间的 Li 也被匹配"
    sql: |
      SELECT user_id, name FROM users WHERE name LIKE '%Li %';
  - why: "用了 ILIKE，小写的 li 也被匹配"
    sql: |
      SELECT user_id, name FROM users WHERE name ILIKE 'li %';
