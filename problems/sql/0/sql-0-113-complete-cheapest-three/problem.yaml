# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "多取了一行"
    sql: |
      SELECT book_id, title, price FROM books ORDER BY price, book_id LIMIT 4;
  - why: "跳过了第一行"
    sql: |
      SELECT book_id, title, price FROM books ORDER BY price, book_id LIMIT 3 OFFSET 1;
