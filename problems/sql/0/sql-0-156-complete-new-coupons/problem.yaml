hints:
  - 在正则里，^ 表示字符串的开头。模式是文字，两端加单引号。
wrong_examples:
  - why: 没有限定开头，RENEW10 也会匹配。
    sql: |
      SELECT order_id, coupon_code FROM orders WHERE coupon_code ~ 'NEW';
  - why: 用了忽略大小写的匹配，new 开头也会入选。
    sql: |
      SELECT order_id, coupon_code FROM orders WHERE coupon_code ~* '^NEW';
