id: sql-0-015-top3-expensive
title: 最贵的三本书
track: sql
stage: "0"
order: 260
format: write
difficulty: 11
skills: {requires: [sql.order-by, sql.limit], introduces: null}
source: original
leetcode: null
milestones: []
datasets:
  - db:bookstore
  - db:bookstore + datasets/tie-second.sql
  - db:bookstore + datasets/tie-first.sql
ordered: true
hints:
  - "先 ORDER BY 排好，再 LIMIT 3 取前三行。"
  - "并列时的决胜规则也要写进 ORDER BY。"
# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "没有 ORDER BY，拿到的是\"随便哪三行\""
    sql: |
      SELECT book_id, title, price FROM books LIMIT 3;
  - why: "同价时 book_id 排反了"
    sql: |
      SELECT book_id, title, price FROM books ORDER BY price DESC, book_id DESC LIMIT 3;
  - why: "排成了最便宜的三本"
    sql: |
      SELECT book_id, title, price FROM books ORDER BY price, book_id LIMIT 3;
