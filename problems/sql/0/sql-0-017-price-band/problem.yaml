# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "30 元整被算成 budget"
    sql: |
      SELECT title, price, CASE WHEN price <= 30 THEN 'budget' WHEN price < 50 THEN 'standard' ELSE 'premium' END FROM books;
  - why: "50 元整被算成 standard"
    sql: |
      SELECT title, price, CASE WHEN price > 50 THEN 'premium' WHEN price >= 30 THEN 'standard' ELSE 'budget' END FROM books;
