hints:
  - "SELECT 后面写要的列，用逗号隔开；FROM 后面写表名。"
# 典型错误写法（提议的可选字段）：校验时每条都必须在至少一个隐藏数据集上和参考解结果不同
wrong_examples:
  - why: "只选了书名一列"
    sql: |
      SELECT title FROM books;
  - why: "选错了列：stock 不是价格"
    sql: |
      SELECT title, stock FROM books;
  - why: "多选了一列 book_id"
    sql: |
      SELECT book_id, title, price FROM books;
