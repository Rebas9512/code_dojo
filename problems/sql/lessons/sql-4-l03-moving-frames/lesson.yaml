id: sql-4-l03-moving-frames
title: 看清窗口的帧和连续段
track: sql
skills:
  - sql.running-total
  - sql.window-frame
  - sql.gaps-islands
steps:
  - type: read
    skill: sql.running-total
    md: |
      按日翻账本，读到哪一天，就问“从开张到今天一共收了多少”。给 SUM 的窗口加日期排序后，右边界会移动。若每天只有一行，在下一行就多加一天。若同一天有两张票，窗口只按日排，默认会把同一天的两张都算进来。

      用东架价格从小到大模拟：10、30、30。只按价格累加时，到达任一张 30 都得到 70；按价格和价签号逐张翻动，才依次得到 10、40、70。先决定要按日交账，还是按笔交账。
  - type: example
    skill: sql.running-total
    db: bookstore
    patch: |
      CREATE TABLE tags(id int PRIMARY KEY, aisle text, price int);
      INSERT INTO tags VALUES (1, '东', 30), (2, '东', 30), (3, '东', 10), (4, '西', 20);
    code: |
      -- ① 只按价格累计，并列会一起进入
      -- ② 再加入唯一号码，对照逐笔的结果
      SELECT id, price, SUM(price) OVER (ORDER BY price) AS at_price,
             SUM(price) OVER (ORDER BY price, id) AS at_tag
      FROM tags WHERE aisle = '东' ORDER BY price, id;
    md: 删掉 WHERE，让西架也加入同一本账。两种累计最后相同吗？
  - type: quiz
    skill: sql.running-total
    q: 有序值 10、30、30，默认帧在第一张 30 处的累计是？
    options:
      - '40'
      - '70'
      - '30'
    answer: 1
    explain: 按 price 的默认帧包含当前排序键相同的伙伴，两张 30 都被看见。
  - type: read
    skill: sql.window-frame
    md: |
      回到两排价签。分区先把东西两个架分开，排序再按签号从小到大摆开。现在拿一张只露出两个格子的纸，右格对准当前签，左格就露出上一签。纸盖出的范围叫帧。东架的 30、30、10 在末行只看见 30 和 10，两行合计 40；西架只有一张，能看见的只有它自己。

      ROWS BETWEEN 1 PRECEDING AND CURRENT ROW 正是这张纸。第一行左边空着，只取得到一行。七日均额用七个格子之前，必须把同日小票汇成一行并补上缺失日，否则七行会横跨错误的天数。
  - type: example
    skill: sql.window-frame
    db: bookstore
    patch: |
      CREATE TABLE tags(id int PRIMARY KEY, aisle text, price int);
      INSERT INTO tags VALUES (1, '东', 30), (2, '东', 30), (3, '东', 10), (4, '西', 20);
    code: |
      -- ① 按货架分区，按签号排序
      -- ② 帧只露出当前签与紧前一签
      SELECT id, aisle, price, SUM(price) OVER (
          PARTITION BY aisle ORDER BY id ROWS BETWEEN 1 PRECEDING AND CURRENT ROW
      ) AS last_two FROM tags ORDER BY id;
    md: 改成 2 PRECEDING，观察东架最后一行从 40 变为多少。
  - type: quiz
    skill: sql.window-frame
    q: 日表只有周一和周五两行。周五的 ROWS 1 PRECEDING 会取到哪天？
    options:
      - 周四
      - 周一
      - 没有上一行
    answer: 1
    explain: ROWS 沿实际记录移动，缺失的日历日没有占位。
  - type: read
    skill: sql.gaps-islands
    md: |
      把三次登录画在日历上：1 月 30 日、1 月 31 日、2 月 2 日。把第一天看成第 0 天，日序就是 0、1、3；登录行号是 1、2、3。逐行相减得到 -1、-1、0，前两行自然归为一段，第三行自己成段。月末跨到次月只要相隔一天，同样能接起来。

      同日多次登录先去重，否则行号已经增加，日序还停在原地。不同读者的差值可能碰巧相同，所以汇总时要同时按读者和差值分组。
  - type: example
    skill: sql.gaps-islands
    db: bookstore
    code: |
      -- ① 每人每天只保留一个格
      WITH days AS (SELECT DISTINCT user_id, logged_on FROM reader_logins)
      -- ② 查看跨月时仍相同的分段键
      SELECT user_id, logged_on, (logged_on - DATE '2024-11-01')-
             ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY logged_on) AS block
      FROM days WHERE user_id = 2 ORDER BY logged_on;
    md: 改成 1 号，再去掉 DISTINCT，对照重复登录的日序与行号。
  - type: quiz
    skill: sql.gaps-islands
    q: 连续段的分组键相同，属于不同用户的行能直接合并吗？
    options:
      - 能
      - 不能
    answer: 1
    explain: 分段键只在同一个人的时间轴上有效，用户号也是分组键。
