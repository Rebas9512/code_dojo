wrong_examples:
  - why: 把完全没发过货的版本也收进来
    sql: |-
      SELECT e.edition, e.label FROM editions e
      WHERE NOT EXISTS (SELECT 1 FROM dispatches d WHERE d.edition = e.edition
                        AND (d.day < DATE '2025-03-01' OR d.day > DATE '2025-05-31'));
  - why: 最后一天也被排除
    sql: |-
      SELECT e.edition, e.label FROM editions e
      WHERE EXISTS (SELECT 1 FROM dispatches d WHERE d.edition = e.edition)
        AND NOT EXISTS (SELECT 1 FROM dispatches d WHERE d.edition = e.edition
                        AND (d.day < DATE '2025-03-01' OR d.day >= DATE '2025-05-31'));
