  - 先求左边缺右边的清单，再求右边缺左边的清单，最后合并。
wrong_examples:
  - why: 两边都做同方向的差集
    sql: |-
      WITH missing_fees AS (
          SELECT badge FROM press_badges EXCEPT SELECT badge FROM fee_cards
      ), missing_badges AS (
          SELECT badge FROM press_badges EXCEPT SELECT badge FROM fee_cards
      )
      SELECT badge FROM missing_fees UNION SELECT badge FROM missing_badges ORDER BY badge;
  - why: 第二侧误取交集
    sql: |-
      WITH missing_fees AS (
          SELECT badge FROM press_badges EXCEPT SELECT badge FROM fee_cards
      ), missing_badges AS (
          SELECT badge FROM fee_cards INTERSECT SELECT badge FROM press_badges
      )
      SELECT badge FROM missing_fees UNION SELECT badge FROM missing_badges ORDER BY badge;
