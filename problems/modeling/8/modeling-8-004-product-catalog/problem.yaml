id: modeling-8-004-product-catalog
title: 建立商品维度
track: modeling
stage: '8'
unit: 1
order: 40
format: combine
difficulty: 59
skills:
  requires:
  - modeling.identity
  - modeling.unique
  - modeling.load-select
  introduces: null
source: original
project: warehouse
part: 4
mode: script
datasets:
- db:workshop
- db:workshop + ../1/datasets/one-sale.sql
- db:workshop + ../1/datasets/empty.sql
- db:workshop + ../1/datasets/history.sql
- db:workshop + ../1/datasets/unmatched.sql
checks:
- label: 列名、类型、必填与自动编号
  query: |-
    SELECT column_name, data_type, is_nullable, identity_generation
    FROM information_schema.columns
    WHERE table_schema = 'public' AND table_name = 'dim_product'
    ORDER BY ordinal_position
  ordered: true
- label: 标识一行的主键列
  query: |-
    SELECT k.column_name
    FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'dim_product' AND c.constraint_type = 'PRIMARY KEY'
- label: 商品目录中的全部条目
  query: SELECT sku, product_name FROM dim_product
- label: 不同 SKU 可以同名
  probe: |-
    INSERT INTO dim_product (sku, product_name)
    VALUES ('probe-1', 'Pen'), ('probe-2', 'Pen')
  expect: ok
- label: 同一 SKU 不能分配两个键
  probe: |-
    INSERT INTO dim_product (sku, product_name)
    VALUES ('probe-1', 'Pen'), ('probe-1', 'Book')
  expect: error
wrong_examples:
- why: 把商品名设成唯一，拒绝不同 SKU 的同名商品
  sql: |-
    CREATE TABLE dim_product (
        product_key integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        sku text NOT NULL UNIQUE,
        product_name text NOT NULL UNIQUE
    );

    INSERT INTO dim_product (sku, product_name)
    SELECT sku, product_name
    FROM warehouse_feed.catalog;
