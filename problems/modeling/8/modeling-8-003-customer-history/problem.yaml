id: modeling-8-003-customer-history
title: 为客户等级划出有效期
track: modeling
stage: '8'
unit: 1
order: 30
format: combine
difficulty: 62
skills:
  requires:
  - modeling.history
  - modeling.identity
  - modeling.unique
  - sql.lag-lead
  - sql.partition-by
  introduces: null
source: original
project: warehouse
part: 3
mode: script
datasets:
- db:workshop
- db:workshop + ../1/datasets/one-sale.sql
- db:workshop + ../1/datasets/empty.sql
- db:workshop + ../1/datasets/history.sql
- db:workshop + ../1/datasets/unmatched.sql
checks:
- label: 列名、类型、必填与自动编号
  query: |-
    SELECT column_name, data_type, is_nullable, identity_generation
    FROM information_schema.columns
    WHERE table_schema = 'public' AND table_name = 'dim_customer'
    ORDER BY ordinal_position
  ordered: true
- label: 标识一行的主键列
  query: |-
    SELECT k.column_name
    FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'dim_customer' AND c.constraint_type = 'PRIMARY KEY'
- label: 每个客户的等级与起止日期
  query: SELECT customer_code, tier, valid_from, valid_to FROM dim_customer
- label: 同一客户可登记两个日期
  probe: |-
    INSERT INTO dim_customer (customer_code, tier, valid_from)
    VALUES ('probe', 'base', '2025-01-01'), ('probe', 'gold', '2025-02-01')
  expect: ok
- label: 同一客户同日不能登记两种等级
  probe: |-
    INSERT INTO dim_customer (customer_code, tier, valid_from)
    VALUES ('probe', 'base', '2025-01-01'), ('probe', 'gold', '2025-01-01')
  expect: error
wrong_examples:
- why: 把客户的每个版本都当成当前版本
  sql: |-
    CREATE TABLE dim_customer (
        customer_key integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        customer_code text NOT NULL,
        tier text NOT NULL,
        valid_from date NOT NULL,
        valid_to date,
        UNIQUE (customer_code, valid_from)
    );

    INSERT INTO dim_customer (customer_code, tier, valid_from, valid_to)
    SELECT customer_code, tier, valid_from,
           NULL
    FROM warehouse_feed.customers
    WHERE batch_no = 1;
