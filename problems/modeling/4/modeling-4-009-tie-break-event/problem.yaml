wrong_examples:
- why: 同版本取最早事件
  sql: |-
    INSERT INTO catalog
    SELECT DISTINCT ON (id) id,rev,tag FROM feed ORDER BY id,rev DESC,event_id ASC
    ON CONFLICT(id) DO UPDATE SET rev=excluded.rev,tag=excluded.tag;
- why: 让事件号优先于版本
  sql: |-
    INSERT INTO catalog
    SELECT DISTINCT ON (id) id,rev,tag FROM feed ORDER BY id,event_id DESC,rev DESC
    ON CONFLICT(id) DO UPDATE SET rev=excluded.rev,tag=excluded.tag;
