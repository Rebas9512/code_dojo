checks:
- label: stock 的记录
  query: SELECT * FROM stock
  ordered: false
wrong_examples:
- why: 漏掉新增商品的分支
  sql: |-
    MERGE INTO stock t USING batch s ON t.sku=s.sku
    WHEN MATCHED THEN UPDATE SET qty=s.qty
    ;
- why: 误将快照作为增量
  sql: |-
    MERGE INTO stock t USING batch s ON t.sku=s.sku
    WHEN MATCHED THEN UPDATE SET qty=t.qty+s.qty
    WHEN NOT MATCHED THEN INSERT VALUES (s.sku,s.qty);
