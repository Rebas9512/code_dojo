wrong_examples:
- why: 声明冲突目标，却没建唯一约束
  sql: |2-

    INSERT INTO codes SELECT code FROM incoming ON CONFLICT(code) DO NOTHING;
- why: 只安装约束，未载入数据
  sql: |-
    ALTER TABLE codes ADD UNIQUE (code);
    INSERT INTO codes SELECT code FROM incoming WHERE false ON CONFLICT(code) DO NOTHING;
