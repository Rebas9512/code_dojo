id: modeling-1-007-generate-ticket
title: 让数据库签发取件号
track: modeling
stage: '1'
order: 70
unit: 2
format: complete
difficulty: 15
skills:
  requires:
  - sql.select-expr
  introduces: modeling.identity
source: original
mode: script
datasets:
- db:workshop
checks:
- label: 表结构 · claims
  query: |-
    SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type,
           a.attnotnull AS required, a.attidentity AS identity_kind
    FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
    WHERE c.oid = to_regclass('public.claims') AND c.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY a.attnum
  ordered: true
- label: 主键列 · claims
  query: |-
    SELECT k.column_name FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'claims' AND c.constraint_type = 'PRIMARY KEY'
    ORDER BY k.ordinal_position
  ordered: true
- label: claims 的记录
  query: SELECT * FROM claims
  ordered: false
- label: 拒绝手工编号
  probe: INSERT INTO claims VALUES (45,'max')
  expect: error
wrong_examples:
- why: 允许普通插入覆盖编号
  sql: |-
    CREATE TABLE claims (
        id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        owner text NOT NULL
    );
    INSERT INTO claims(owner) VALUES ('ivy'),('sam');
- why: 省略主键约束
  sql: |-
    CREATE TABLE claims (
        id integer GENERATED ALWAYS AS IDENTITY,
        owner text NOT NULL
    );
    INSERT INTO claims(owner) VALUES ('ivy'),('sam');
