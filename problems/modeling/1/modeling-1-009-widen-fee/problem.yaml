checks:
- label: tariffs 的记录
  query: SELECT * FROM tariffs
  ordered: false
- label: 表结构 · tariffs
  query: |-
    SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type,
           a.attnotnull AS required, a.attidentity AS identity_kind
    FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
    WHERE c.oid = to_regclass('public.tariffs') AND c.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY a.attnum
  ordered: true
wrong_examples:
- why: 仍然只保留整元
  sql: ALTER TABLE tariffs ALTER COLUMN fee TYPE numeric(9,0);
- why: 用浮点代替精确类型
  sql: ALTER TABLE tariffs ALTER COLUMN fee TYPE double precision;
