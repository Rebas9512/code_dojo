id: modeling-1-006-location-key
title: 选仓位编号作主键
track: modeling
stage: '1'
order: 60
unit: 2
format: write
difficulty: 14
skills:
  requires: []
  introduces: modeling.primary
source: original
mode: script
datasets:
- db:workshop
checks:
- label: 表结构 · bins
  query: |-
    SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type,
           a.attnotnull AS required, a.attidentity AS identity_kind
    FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
    WHERE c.oid = to_regclass('public.bins') AND c.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY a.attnum
  ordered: true
- label: 主键列 · bins
  query: |-
    SELECT k.column_name FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'bins' AND c.constraint_type = 'PRIMARY KEY'
    ORDER BY k.ordinal_position
  ordered: true
- label: 相同标签可用于不同仓位
  probe: INSERT INTO bins VALUES (1,'West'),(2,'West')
  expect: ok
wrong_examples:
- why: 只设非空，编号仍可重复
  sql: |-
    CREATE TABLE bins (
        id integer NOT NULL,
        label text
    );
- why: 错把标签限制为唯一
  sql: |-
    CREATE TABLE bins (
        id integer PRIMARY KEY,
        label text UNIQUE
    );
