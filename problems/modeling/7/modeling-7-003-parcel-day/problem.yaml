checks:
- label: 对象是普通视图
  query: SELECT table_type FROM information_schema.tables WHERE table_schema='public' AND table_name='day_kpi'
  ordered: false
- label: day_kpi 的记录
  query: SELECT shipped_on,parcels_n,orders_n FROM day_kpi
  ordered: false
wrong_examples:
- why: 对包裹数也按订单去重
  sql: |-
    CREATE VIEW day_kpi AS
    SELECT shipped_on,COUNT(DISTINCT order_id) AS parcels_n,COUNT(DISTINCT order_id) AS orders_n
    FROM parcels GROUP BY shipped_on;
- why: 把每日件数当成包裹数
  sql: |-
    CREATE VIEW day_kpi AS
    SELECT shipped_on,SUM(units) AS parcels_n,COUNT(DISTINCT order_id) AS orders_n
    FROM parcels GROUP BY shipped_on;
