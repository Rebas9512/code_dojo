id: modeling-7-005-fulfillment-interview
title: 履约面试：从原始单到三个指标
track: modeling
stage: '7'
order: 50
unit: 1
format: combine
difficulty: 61
skills:
  requires:
  - modeling.grain
  - modeling.view
  - sql.count-distinct
  - sql.having
  - sql.join-aggregate
  - sql.self-join
  introduces: null
source: original
mode: script
datasets:
- sample.sql
- sample.sql + hidden.sql
checks:
- label: 表结构 · depots
  query: |-
    SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type,
           a.attnotnull AS required, a.attidentity AS identity_kind
    FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
    WHERE c.oid = to_regclass('public.depots') AND c.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY a.attnum
  ordered: true
- label: 主键列 · depots
  query: |-
    SELECT k.column_name FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'depots' AND c.constraint_type = 'PRIMARY KEY'
    ORDER BY k.ordinal_position
  ordered: true
- label: depots 的记录
  query: SELECT * FROM depots
  ordered: false
- label: 表结构 · parcels
  query: |-
    SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type,
           a.attnotnull AS required, a.attidentity AS identity_kind
    FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
    WHERE c.oid = to_regclass('public.parcels') AND c.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY a.attnum
  ordered: true
- label: 主键列 · parcels
  query: |-
    SELECT k.column_name FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'parcels' AND c.constraint_type = 'PRIMARY KEY'
    ORDER BY k.ordinal_position
  ordered: true
- label: parcels 的记录
  query: SELECT * FROM parcels
  ordered: false
- label: 引用关系 · parcels
  query: |-
    SELECT k.column_name, u.table_name, u.column_name FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog,constraint_schema,constraint_name,table_name)
    JOIN information_schema.constraint_column_usage u USING (constraint_catalog,constraint_schema,constraint_name)
    WHERE c.table_schema='public' AND c.constraint_type='FOREIGN KEY' AND c.table_name='parcels'
  ordered: false
- label: 普通视图 · city_kpi
  query: SELECT table_type FROM information_schema.tables WHERE table_schema='public' AND table_name='city_kpi'
  ordered: false
- label: 指标 · city_kpi
  query: SELECT city,orders_n,units_n FROM city_kpi
  ordered: false
- label: 普通视图 · day_kpi
  query: SELECT table_type FROM information_schema.tables WHERE table_schema='public' AND table_name='day_kpi'
  ordered: false
- label: 指标 · day_kpi
  query: SELECT shipped_on,parcels_n,orders_n FROM day_kpi
  ordered: false
- label: 普通视图 · splits
  query: SELECT table_type FROM information_schema.tables WHERE table_schema='public' AND table_name='splits'
  ordered: false
- label: 指标 · splits
  query: SELECT order_id,parcels_n FROM splits
  ordered: false
wrong_examples:
- why: 城市指标重复数订单
  sql: |-
    CREATE TABLE depots (id int PRIMARY KEY,city text);
    CREATE TABLE parcels (id int PRIMARY KEY,order_id int,depot_id int REFERENCES depots(id),shipped_on date,units int);
    INSERT INTO depots SELECT DISTINCT depot_id,city FROM dispatch;
    INSERT INTO parcels SELECT parcel_id,order_id,depot_id,shipped_on,units FROM dispatch;
    CREATE VIEW city_kpi AS
    SELECT d.city,COUNT(*) AS orders_n,SUM(p.units) AS units_n
    FROM parcels p JOIN depots d ON p.depot_id=d.id GROUP BY d.city;
    CREATE VIEW day_kpi AS
    SELECT shipped_on,COUNT(*) AS parcels_n,COUNT(DISTINCT order_id) AS orders_n
    FROM parcels GROUP BY shipped_on;
    CREATE VIEW splits AS
    SELECT p.order_id,COUNT(*) AS parcels_n FROM parcels p GROUP BY p.order_id HAVING COUNT(*)>1;
- why: 跨日拆包漏记
  sql: |-
    CREATE TABLE depots (id int PRIMARY KEY,city text);
    CREATE TABLE parcels (id int PRIMARY KEY,order_id int,depot_id int REFERENCES depots(id),shipped_on date,units int);
    INSERT INTO depots SELECT DISTINCT depot_id,city FROM dispatch;
    INSERT INTO parcels SELECT parcel_id,order_id,depot_id,shipped_on,units FROM dispatch;
    CREATE VIEW city_kpi AS
    SELECT d.city,COUNT(DISTINCT p.order_id) AS orders_n,SUM(p.units) AS units_n
    FROM parcels p JOIN depots d ON p.depot_id=d.id GROUP BY d.city;
    CREATE VIEW day_kpi AS
    SELECT shipped_on,COUNT(*) AS parcels_n,COUNT(DISTINCT order_id) AS orders_n
    FROM parcels GROUP BY shipped_on;
    CREATE VIEW splits AS
    SELECT p.order_id,COUNT(*) AS parcels_n FROM parcels p GROUP BY p.order_id,p.shipped_on HAVING COUNT(*)>1;
- why: 忽略维度外键
  sql: |-
