- label: splits 的记录
  query: SELECT order_id,parcels_n FROM splits
  ordered: false
wrong_examples:
- why: 把单包订单也列出来
  sql: |-
    CREATE VIEW splits AS
    SELECT p.order_id,COUNT(*) AS parcels_n FROM parcels p GROUP BY p.order_id HAVING COUNT(*)>=1;
- why: 按日期把同一订单拆开
  sql: |-
    CREATE VIEW splits AS
    SELECT p.order_id,COUNT(*) AS parcels_n FROM parcels p GROUP BY p.order_id,p.shipped_on HAVING COUNT(*)>1;
