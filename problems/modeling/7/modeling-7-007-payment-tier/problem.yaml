checks:
- label: 对象是普通视图
  query: SELECT table_type FROM information_schema.tables WHERE table_schema='public' AND table_name='assigned'
  ordered: false
- label: assigned 的记录
  query: SELECT id,tier,amount FROM assigned
  ordered: false
wrong_examples:
- why: 旧版本的最后一天被重复计入
  sql: |-
    CREATE VIEW assigned AS
    SELECT p.id,t.tier,p.amount
    FROM payments p JOIN tiers t ON p.member_id=t.member_id
     AND p.day>=t.since AND (t.until_day IS NULL OR p.day<=t.until_day);
- why: 把所有交易归给当前等级
  sql: |-
    CREATE VIEW assigned AS
    SELECT p.id,t.tier,p.amount
    FROM payments p JOIN tiers t ON p.member_id=t.member_id
     AND t.is_current;
