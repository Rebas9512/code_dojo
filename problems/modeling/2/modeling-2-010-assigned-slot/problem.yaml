id: modeling-2-010-assigned-slot
title: 预约同仓同日只登记一次
track: modeling
stage: '2'
order: 100
unit: 2
format: fix
difficulty: 26
skills:
  requires:
  - modeling.composite
  - modeling.foreign
  introduces: null
source: original
mode: script
datasets:
- sample.sql
checks:
- label: 表结构 · slots
  query: |-
    SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type,
           a.attnotnull AS required, a.attidentity AS identity_kind
    FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid
    WHERE c.oid = to_regclass('public.slots') AND c.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY a.attnum
  ordered: true
- label: 主键列 · slots
  query: |-
    SELECT k.column_name FROM information_schema.table_constraints c
    JOIN information_schema.key_column_usage k USING (constraint_catalog, constraint_schema, constraint_name, table_name)
    WHERE c.table_schema = 'public' AND c.table_name = 'slots' AND c.constraint_type = 'PRIMARY KEY'
    ORDER BY k.ordinal_position
  ordered: true
- label: 同仓可跨日登记
  probe: INSERT INTO slots VALUES (4,'2025-06-01'),(4,'2025-06-02')
  expect: ok
- label: 拒绝未知仓库
  probe: INSERT INTO slots VALUES (99,'2025-06-01')
  expect: error
- label: 同日可有不同仓库
  probe: INSERT INTO slots VALUES (4,'2025-06-01'),(8,'2025-06-01')
  expect: ok
wrong_examples:
- why: 只按仓库判重
  sql: |-
    CREATE TABLE slots (
        depot_id int REFERENCES depots(id),
        day date,
        PRIMARY KEY(depot_id)
    );
- why: 没有检查父仓库
  sql: |-
    CREATE TABLE slots (
        depot_id int,
        day date,
        PRIMARY KEY(depot_id,day)
    );
