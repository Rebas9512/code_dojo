wrong_examples:
  - why: 借出减归还，方向相反。
    code: |
      import pandas as pd


      def elapsed(loans, returns):
          paired = loans.merge(returns, on='id')
          paired['days'] = (pd.to_datetime(paired['start']) - pd.to_datetime(paired['end'])).dt.days
          return paired[['id', 'days']]
