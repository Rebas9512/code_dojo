id: wrangle-1-l03-axes
title: 重排形状与沿轴汇总
track: wrangle
skills:
  - wrangle.reshape
  - wrangle.axis
steps:
  - type: read
    skill: wrangle.reshape
    md: |-
      一串标签可以按固定宽度排成多行，便于每行交给一个货架。六张标签每行三张，可以排成两行；每行两张，就有三行。无论选哪种排列，一张都不能凭空增加或丢失。

      reshape(行数, 列数) 按原先的读取顺序依次填行。可以把一个长度写成 -1 让 NumPy 算出它。总数必须能被给定宽度整除。

      **WM05 行数和列数调换仍是同一排法**。六张标签每行三张只能排两行，reshape(-1, 3) 的第二项锁定宽度。
  - type: example
    skill: wrangle.reshape
    code: |
      import numpy as np
      # ① 六个连续的货号
      ids = np.array([8, 5, 1, 7, 2, 9])
      # ② 每行分三张
      print(ids.reshape(-1, 3).tolist())  # 输出 [[8, 5, 1], [7, 2, 9]]
    md: 改成每行两张，再数行数。
  - type: quiz
    skill: wrangle.reshape
    q: 12 个数 reshape(3, -1) 后每行几个？
    options:
      - '3'
      - '12'
      - '4'
    answer: 2
    explain: 总数 12 除以行数 3，每行放 4 个。（WM05）
  - type: read
    skill: wrangle.axis
    md: |-
      聚合把一组数缩成一个数。甲店三天卖了 2、4、6 本，乙店卖了 1、3、5 本。想知道每天两店共卖几本，就沿行向下加，得到 3、7、11；想看各店总数，就沿各行横向加。

      轴号指出被压缩的维度。二维数组 axis=0 压掉行轴、保留每列一个结果，axis=1 压掉列轴、保留每行一个结果。求和、平均值和最值都可以这样指定方向。

      **WM06 把 axis 当成要保留的方向**。两店三天的表沿 axis=0 汇总后，每一天留下一个数，共三个。
  - type: example
    skill: wrangle.axis
    code: |
      import numpy as np
      # ① 两行分别是一家店
      x = np.array([[2, 4, 6], [1, 3, 5]])
      # ② 汇总各店，再汇总每天
      print(np.sum(x, axis=1).tolist())  # 输出 [12, 9]
      print(np.sum(x, axis=0).tolist())  # 输出 [3, 7, 11]
    md: 把第二行改成零，比较两个方向的结果。
  - type: quiz
    skill: wrangle.axis
    q: 四家店各报两天，按 axis=0 求和得到几个数？
    options:
      - '2'
      - '4'
      - '8'
    answer: 0
    explain: 消掉四家店所在的轴，留下两天。（WM06）
