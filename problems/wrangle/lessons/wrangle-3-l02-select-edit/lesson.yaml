id: wrangle-3-l02-select-edit
title: 选行、排序与更新列
track: wrangle
skills:
  - wrangle.loc
  - wrangle.filter-sort
  - wrangle.columns
steps:
  - type: read
    skill: wrangle.loc
    md: |-
      行标签像票号，位置像排队次序。票号为 20、10 的两个人依次排队，第一个人的票号是 20。查“票号 10”与查“排第一的人”会得到不同记录。普通索引从 0 开始时，两者容易混淆。

      loc[标签, 列名] 按名字找，iloc[行位置, 列位置] 从零开始数。loc 切片包含结束标签，iloc 切片在结束位置之前停。行标签由输入表提供。

      **WM14 把行标签当成位置**。票号 10 可以排在第零位；按票号找用 loc，按排队次序找用 iloc。
  - type: example
    skill: wrangle.loc
    code: |
      import pandas as pd
      # ① 票号故意与位置不同
      t = pd.DataFrame({"stock": [7, 2]}, index=[20, 10])
      # ② 查票号，再查队首
      print(t.loc[10, "stock"])  # 输出 2
      print(t.iloc[0, 0])  # 输出 7
    md: 调换两个行标签，分别看看两个读数有没有变化。
  - type: quiz
    skill: wrangle.loc
    q: 索引为 [7, 0, 2]，iloc[0] 取哪个标签的行？
    options:
      - '0'
      - '2'
      - '7'
    answer: 2
    explain: 排在最前的行带标签 7。（WM14）
  - type: read
    skill: wrangle.filter-sort
    md: |-
      筛选决定哪些记录留下，排序决定这些记录怎样排列。库存 3、0、6 的三本书中，有货的是第一本和第三本；若要优先补较少的库存，就把 3 放到 6 前面。筛完再排序也能保留原来的书号。

      把整列比较产生的掩码放在 loc 的行位置。sort_values 按给定列排序，ascending=False 表示从大到小。若主键并列，继续比较第二个排序键，各键可以有自己的方向。

      **WM15 同价时第二排序键也必须降序**。价高优先、同价小书号优先，需要分别给价格和书号指定方向。
  - type: example
    skill: wrangle.filter-sort
    code: |
      import pandas as pd
      # ① 筛出还有库存的书
      t = pd.DataFrame({"id": [3, 1, 2], "stock": [4, 0, 4]})
      ok = t.loc[t["stock"] > 0]
      # ② 同库存按书号从小到大
      print(ok.sort_values(["stock", "id"])["id"].tolist())  # 输出 [2, 3]
    md: 把最小书号那本的库存改成 4，再看它排在哪里。
  - type: quiz
    skill: wrangle.filter-sort
    q: 要求贵的先看，同价小书号先看。两个排序方向是？
    options:
      - 降序、升序
      - 两个都降序
      - 两个都升序
    answer: 0
    explain: 价格越大越靠前，同价时书号越小越靠前。（WM15）
  - type: read
    skill: wrangle.columns
    md: |-
      新列把每条记录的计算结果放回同一行。两单分别买 2 本和 3 本，每本 5 元和 4 元，小计就是 10 元和 12 元。两个同表的列参与运算时，相同标签的值会对齐。

      用 t['新列'] = 整列结果 添加一列。只改选中的行时，一步写 t.loc[条件, 列名] = 值。先筛出子表、再对子表赋值是链式赋值（旧版本常提示 SettingWithCopy）；在这里使用的 pandas 里，这样无法更新原表。

      **WM16 链式赋值会改到原表**。在筛出来的临时表上再改列，原库存可能仍是负数。让 loc 在原表上一次选定行和列。
  - type: example
    skill: wrangle.columns
    code: |
      import pandas as pd
      # ① 只给零库存行加上到货数
      t = pd.DataFrame({"n": [0, 4]})
      t.loc[t["n"] == 0, "n"] = 2
      # ② 再给每行算整箱册数
      t["double"] = t["n"] * 2
      print(t["double"].tolist())  # 输出 [4, 8]
    md: 把条件从 == 0 改成 > 0，比较哪行被更新。
  - type: quiz
    skill: wrangle.columns
    q: 要改原表中 n 小于 0 的格子，应该把条件放在哪里？
    options:
      - 先取一份筛出的子表
      - t.loc[条件, 'n'] 的同一次赋值
      - 列名拼成字符串
    answer: 1
    explain: 一次定位同时选定原表的行和列。（WM16）
