id: analytics-3-009-matrix-rate
title: 比较第二周的留存份额
track: analytics
stage: '3'
unit: 2
order: 90
format: combine
difficulty: 46
skills:
  requires:
    - sql.round-cast
    - sql.join-aggregate
    - analytics.fixed-return
    - analytics.cohort-matrix
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 用注册周的周一标记批次，用周一之间的差划分观察周。同一个读者在一格中只出现一次。
wrong_examples:
  - why: 累计后续周
    sql: |-
      WITH cohorts AS (
          SELECT user_id, DATE_TRUNC('week', joined_on)::date AS cohort FROM readers
      ), marks AS (
          SELECT c.cohort, c.user_id,
                 (DATE_TRUNC('week', l.logged_at)::date - c.cohort) / 7 AS wk
          FROM cohorts c LEFT JOIN logins l USING (user_id)
          WHERE c.cohort + 20 <= DATE '2025-03-14'
      )
      SELECT cohort, ROUND(COUNT(DISTINCT user_id) FILTER (WHERE wk>=2)::numeric
             / COUNT(DISTINCT user_id), 4) AS w2_rate
      FROM marks GROUP BY cohort ORDER BY cohort;
  - why: 对人数做整数除法
    sql: |-
      WITH cohorts AS (
          SELECT user_id, DATE_TRUNC('week', joined_on)::date AS cohort FROM readers
      ), marks AS (
          SELECT c.cohort, c.user_id,
                 (DATE_TRUNC('week', l.logged_at)::date - c.cohort) / 7 AS wk
          FROM cohorts c LEFT JOIN logins l USING (user_id)
          WHERE c.cohort + 20 <= DATE '2025-03-14'
      )
      SELECT cohort, ROUND(COUNT(DISTINCT user_id) FILTER (WHERE wk=2)::integer
             / COUNT(DISTINCT user_id), 4) AS w2_rate
      FROM marks GROUP BY cohort ORDER BY cohort;
