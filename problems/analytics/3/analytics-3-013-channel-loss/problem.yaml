id: analytics-3-013-channel-loss
title: 按渠道核对流失率
track: analytics
stage: '3'
unit: 3
order: 130
format: combine
difficulty: 47
skills:
  requires:
    - sql.self-join
    - sql.round-cast
    - sql.multi-join
    - sql.join-aggregate
    - sql.and-or
    - analytics.active-reach
    - analytics.churn-risk
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 快照按截止日向前找最后登录。区间流失率先固定上期活跃名单，再数本期完全没有出现的人。
wrong_examples:
  - why: 以全体注册者为分母
    sql: |-
      WITH roster AS (
          SELECT DISTINCT user_id FROM logins WHERE logged_at >= DATE '2025-01-01' AND logged_at < DATE '2025-02-01'
      ), feb AS (
          SELECT DISTINCT user_id FROM logins WHERE logged_at >= DATE '2025-02-01' AND logged_at < DATE '2025-03-01'
      )
      SELECT channel, COUNT(*) AS at_risk, COUNT(*) - COUNT(f.user_id) AS lost,
             ROUND((COUNT(*) - COUNT(f.user_id))::numeric / (SELECT COUNT(*) FROM readers), 4) AS churn_rate
      FROM roster r LEFT JOIN feb f USING (user_id) JOIN readers u ON u.user_id = r.user_id GROUP BY channel ORDER BY channel;
  - why: 连接时先丢掉了流失者
    sql: |-
      WITH roster AS (
          SELECT DISTINCT user_id FROM logins WHERE logged_at >= DATE '2025-01-01' AND logged_at < DATE '2025-02-01'
      ), feb AS (
          SELECT DISTINCT user_id FROM logins WHERE logged_at >= DATE '2025-02-01' AND logged_at < DATE '2025-03-01'
      )
      SELECT channel, COUNT(*) AS at_risk, COUNT(*) - COUNT(f.user_id) AS lost,
             ROUND((COUNT(*) - COUNT(f.user_id))::numeric / COUNT(*), 4) AS churn_rate
      FROM roster r JOIN feb f USING (user_id) JOIN readers u ON u.user_id = r.user_id GROUP BY channel ORDER BY channel;
