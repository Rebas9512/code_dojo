id: analytics-3-007-week-matrix
title: 把三周活跃人数横排
track: analytics
stage: '3'
unit: 2
order: 70
format: write
difficulty: 45
skills:
  requires:
    - sql.round-cast
    - sql.join-aggregate
    - analytics.cohort-matrix
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 用注册周的周一标记批次，用周一之间的差划分观察周。同一个读者在一格中只出现一次。
wrong_examples:
  - why: 按登录条数填格
    sql: |-
      WITH cohorts AS (
          SELECT user_id, DATE_TRUNC('week', joined_on)::date AS cohort FROM readers
      ), marks AS (
          SELECT c.cohort, c.user_id,
                 (DATE_TRUNC('week', l.logged_at)::date - c.cohort) / 7 AS wk
          FROM cohorts c LEFT JOIN logins l USING (user_id)
          WHERE c.cohort + 20 <= DATE '2025-03-14'
      )
      SELECT cohort, COUNT(user_id) AS readers_n,
             COUNT(user_id) FILTER (WHERE wk=0) AS w0,
             COUNT(user_id) FILTER (WHERE wk=1) AS w1,
             COUNT(user_id) FILTER (WHERE wk=2) AS w2
      FROM marks GROUP BY cohort ORDER BY cohort;
  - why: 把更晚的活跃累计进第二周
    sql: |-
      WITH cohorts AS (
          SELECT user_id, DATE_TRUNC('week', joined_on)::date AS cohort FROM readers
      ), marks AS (
          SELECT c.cohort, c.user_id,
                 (DATE_TRUNC('week', l.logged_at)::date - c.cohort) / 7 AS wk
          FROM cohorts c LEFT JOIN logins l USING (user_id)
          WHERE c.cohort + 20 <= DATE '2025-03-14'
      )
      SELECT cohort, COUNT(DISTINCT user_id) AS readers_n,
             COUNT(DISTINCT user_id) FILTER (WHERE wk=0) AS w0,
             COUNT(DISTINCT user_id) FILTER (WHERE wk=1) AS w1,
             COUNT(DISTINCT user_id) FILTER (WHERE wk>=2) AS w2
      FROM marks GROUP BY cohort ORDER BY cohort;
