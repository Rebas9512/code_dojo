id: analytics-4-004-session-duration
title: 算出每段会话的分钟数
track: analytics
stage: '4'
unit: 1
order: 40
format: combine
difficulty: 49
skills:
  requires:
    - sql.round-cast
    - sql.date-funcs
    - sql.cte
    - sql.case
    - analytics.session-boundary
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 每人单独按时间、事件编号排序。首条或距上条至少三十分钟就开启新会话，起点标记的累计和是会话号。
wrong_examples:
  - why: 上一次操作串到了其他人
    sql: |-
      WITH neighbors AS (
          SELECT e.*, LAG(happened_at) OVER ( ORDER BY happened_at, event_id) AS prev_at
          FROM events e
      ), starts AS (
          SELECT neighbors.*, CASE WHEN prev_at IS NULL OR happened_at - prev_at >= INTERVAL '30 minutes'
                                   THEN 1 ELSE 0 END AS is_start FROM neighbors
      ), numbered AS (
          SELECT starts.*, SUM(is_start) OVER (PARTITION BY user_id ORDER BY happened_at, event_id) AS session_no
          FROM starts
      )
      SELECT user_id, session_no, ROUND(EXTRACT(EPOCH FROM MAX(happened_at)-MIN(happened_at))/60, 2) AS minutes
      FROM numbered GROUP BY user_id, session_no ORDER BY user_id, session_no;
  - why: 漏掉恰好三十分钟的起点
    sql: |-
      WITH neighbors AS (
          SELECT e.*, LAG(happened_at) OVER (PARTITION BY user_id ORDER BY happened_at, event_id) AS prev_at
          FROM events e
      ), starts AS (
          SELECT neighbors.*, CASE WHEN prev_at IS NULL OR happened_at - prev_at > INTERVAL '30 minutes'
                                   THEN 1 ELSE 0 END AS is_start FROM neighbors
      ), numbered AS (
          SELECT starts.*, SUM(is_start) OVER (PARTITION BY user_id ORDER BY happened_at, event_id) AS session_no
          FROM starts
      )
      SELECT user_id, session_no, ROUND(EXTRACT(EPOCH FROM MAX(happened_at)-MIN(happened_at))/60, 2) AS minutes
      FROM numbered GROUP BY user_id, session_no ORDER BY user_id, session_no;
