id: analytics-2-006-ordered-counts
title: 严格三步漏斗
track: analytics
stage: '2'
unit: 2
order: 60
format: write
difficulty: 40
skills:
  requires:
    - sql.self-join
    - sql.multi-join
    - sql.join-conditions
    - sql.join-aggregate
    - analytics.ordered-path
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: false
hints:
  - 选最早的入口，然后只在严格晚于入口的动作中选下一步。每一步拿到的时刻都属于同一个人。
wrong_examples:
  - why: 跳过加购时间的约束
    sql: |-
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM events WHERE action = 'view' GROUP BY user_id
      ), carts AS (
          SELECT p.*, MIN(e.happened_at) AS carted FROM views p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'cart' AND e.happened_at > p.viewed
          GROUP BY p.user_id, p.viewed
      ), orders AS (
          SELECT p.*, MIN(e.happened_at) AS ordered_at FROM carts p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'order' AND e.happened_at > p.viewed
          GROUP BY p.user_id, p.viewed, p.carted
      )
      SELECT COUNT(*) AS viewers, COUNT(carted) AS carts, COUNT(ordered_at) AS orders FROM orders;
  - why: 把下单当成了加购
    sql: |-
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM events WHERE action = 'view' GROUP BY user_id
      ), carts AS (
          SELECT p.*, MIN(e.happened_at) AS carted FROM views p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'order' AND e.happened_at > p.viewed
          GROUP BY p.user_id, p.viewed
      ), orders AS (
          SELECT p.*, MIN(e.happened_at) AS ordered_at FROM carts p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'order' AND e.happened_at > p.carted
          GROUP BY p.user_id, p.viewed, p.carted
      )
      SELECT COUNT(*) AS viewers, COUNT(carted) AS carts, COUNT(ordered_at) AS orders FROM orders;
