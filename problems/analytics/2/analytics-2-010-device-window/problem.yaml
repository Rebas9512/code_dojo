id: analytics-2-010-device-window
title: 不同设备的限时转化率
track: analytics
stage: '2'
unit: 3
order: 100
format: write
difficulty: 41
skills:
  requires:
    - sql.self-join
    - sql.round-cast
    - sql.multi-join
    - sql.join-conditions
    - sql.join-aggregate
    - analytics.ordered-path
    - analytics.conversion-window
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 先锁定首个浏览到首个后续订单的时间差，再检查截止时刻。中位数只在符合窗口的转化者中计算。
wrong_examples:
  - why: 整数相除损失小数
    sql: |-
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM events WHERE action = 'view' GROUP BY user_id
      ), orders AS (
          SELECT p.*, MIN(e.happened_at) AS ordered_at FROM views p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'order' AND e.happened_at > p.viewed
          GROUP BY p.user_id, p.viewed
      )
      SELECT device, COUNT(*) AS viewers, COUNT(*) FILTER (WHERE ordered_at <= viewed + INTERVAL '24 hours') AS buyers,
             ROUND(COUNT(*) FILTER (WHERE ordered_at <= viewed + INTERVAL '24 hours')::integer / COUNT(*), 4) AS rate
      FROM orders JOIN readers USING (user_id) GROUP BY device ORDER BY device;
  - why: 漏掉截止时刻
    sql: |-
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM events WHERE action = 'view' GROUP BY user_id
      ), orders AS (
          SELECT p.*, MIN(e.happened_at) AS ordered_at FROM views p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'order' AND e.happened_at > p.viewed
          GROUP BY p.user_id, p.viewed
      )
      SELECT device, COUNT(*) AS viewers, COUNT(*) FILTER (WHERE ordered_at < viewed + INTERVAL '24 hours') AS buyers,
             ROUND(COUNT(*) FILTER (WHERE ordered_at < viewed + INTERVAL '24 hours')::numeric / COUNT(*), 4) AS rate
      FROM orders JOIN readers USING (user_id) GROUP BY device ORDER BY device;
