wrong_examples:
  - why: 忽略加购的时间顺序
    sql: "WITH views AS (\n    SELECT user_id, MIN(happened_at) AS viewed FROM events WHERE action = 'view' GROUP BY user_id\n\
      ), carts AS (\n    SELECT p.*, MIN(e.happened_at) AS carted FROM views p LEFT JOIN events e\n      ON e.user_id = p.user_id\
      \ AND e.action = 'cart' \n    GROUP BY p.user_id, p.viewed\n)\nSELECT channel, COUNT(*) AS viewers, COUNT(carted) AS\
      \ carts FROM carts JOIN readers USING (user_id) GROUP BY channel ORDER BY channel;"
  - why: 把下单当成了加购
    sql: |-
      WITH views AS (
          SELECT user_id, MIN(happened_at) AS viewed FROM events WHERE action = 'view' GROUP BY user_id
      ), carts AS (
          SELECT p.*, MIN(e.happened_at) AS carted FROM views p LEFT JOIN events e
            ON e.user_id = p.user_id AND e.action = 'order' AND e.happened_at > p.viewed
          GROUP BY p.user_id, p.viewed
      )
      SELECT channel, COUNT(*) AS viewers, COUNT(carted) AS carts FROM carts JOIN readers USING (user_id) GROUP BY channel ORDER BY channel;
