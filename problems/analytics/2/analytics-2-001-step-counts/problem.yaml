id: analytics-2-001-step-counts
title: 补全：多少人做过这三种动作
track: analytics
stage: '2'
unit: 1
order: 10
format: complete
difficulty: 38
skills:
  requires: []
  introduces: analytics.step-reach
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: false
hints:
  - 每步各数做过该动作的人。同一人能进入多列，同一列只算一次。
wrong_examples:
  - why: 用事件条数代替触达人数
    sql: |-
      SELECT COUNT(e.user_id) FILTER (WHERE e.action = 'view') AS view_users,
             COUNT(e.user_id) FILTER (WHERE e.action = 'cart') AS cart_users,
             COUNT(e.user_id) FILTER (WHERE e.action = 'order') AS order_users
      FROM events e;
  - why: 把另一种动作计入本步骤
    sql: |-
      SELECT COUNT(DISTINCT e.user_id) FILTER (WHERE e.action = 'view') AS view_users,
             COUNT(DISTINCT e.user_id) FILTER (WHERE e.action = 'search') AS cart_users,
             COUNT(DISTINCT e.user_id) FILTER (WHERE e.action = 'order') AS order_users
      FROM events e;
