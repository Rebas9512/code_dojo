id: analytics-2-003-device-reach
title: 改错：修正设备付款人数
track: analytics
stage: '2'
unit: 1
order: 30
format: fix
difficulty: 39
skills:
  requires:
    - sql.left-join
    - sql.join-aggregate
    - analytics.step-reach
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 每步各数做过该动作的人。同一人能进入多列，同一列只算一次。
wrong_examples:
  - why: 用事件条数代替触达人数
    sql: |-
      SELECT device, COUNT(e.user_id) FILTER (WHERE e.action = 'order') AS order_users,
             COUNT(e.user_id) FILTER (WHERE e.action = 'pay') AS pay_users
      FROM readers r LEFT JOIN events e USING (user_id)
      GROUP BY device ORDER BY device;
  - why: 把另一种动作计入本步骤
    sql: |-
      SELECT device, COUNT(DISTINCT e.user_id) FILTER (WHERE e.action = 'order') AS order_users,
             COUNT(DISTINCT e.user_id) FILTER (WHERE e.action = 'search') AS pay_users
      FROM readers r LEFT JOIN events e USING (user_id)
      GROUP BY device ORDER BY device;
