id: analytics-5-001-growth-roster
title: 补全：逐人标记三月状态
track: analytics
stage: '5'
unit: 1
order: 10
format: complete
difficulty: 53
skills:
  requires:
    - sql.round-cast
  introduces: analytics.growth-ledger
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 本月活跃的人依次分为首次活跃、与上月连续活跃、早于上月活跃后回流。流失单列在上月名单。
wrong_examples:
  - why: 把连续活跃归入回流
    sql: |-
      WITH flags AS (
          SELECT user_id, MIN(logged_at)::date AS first_day,
                 COUNT(*) FILTER (WHERE logged_at >= DATE '2025-03-01' - INTERVAL '1 month'
                                    AND logged_at < DATE '2025-03-01') AS prev_n,
                 COUNT(*) FILTER (WHERE logged_at >= DATE '2025-03-01') AS now_n
          FROM logins WHERE logged_at < DATE '2025-03-01' + INTERVAL '1 month' GROUP BY user_id
      ), ledger AS (
          SELECT user_id, CASE WHEN now_n=0 THEN 'lost' WHEN prev_n>0 THEN 'reactivated'
                               WHEN first_day >= DATE '2025-03-01' THEN 'new' ELSE 'reactivated' END AS status
          FROM flags WHERE prev_n>0 OR now_n>0
      )
      SELECT user_id, status FROM ledger ORDER BY user_id;
  - why: 把首次来访和回流对调
    sql: |-
      WITH flags AS (
          SELECT user_id, MIN(logged_at)::date AS first_day,
                 COUNT(*) FILTER (WHERE logged_at >= DATE '2025-03-01' - INTERVAL '1 month'
                                    AND logged_at < DATE '2025-03-01') AS prev_n,
                 COUNT(*) FILTER (WHERE logged_at >= DATE '2025-03-01') AS now_n
          FROM logins WHERE logged_at < DATE '2025-03-01' + INTERVAL '1 month' GROUP BY user_id
      ), ledger AS (
          SELECT user_id, CASE WHEN now_n=0 THEN 'lost' WHEN prev_n>0 THEN 'retained'
                               WHEN first_day >= DATE '2025-03-01' THEN 'reactivated' ELSE 'new' END AS status
          FROM flags WHERE prev_n>0 OR now_n>0
      )
      SELECT user_id, status FROM ledger ORDER BY user_id;
