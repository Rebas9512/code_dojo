id: analytics-5-008-device-arppu
title: 按设备看付费人均收入
track: analytics
stage: '5'
unit: 2
order: 80
format: combine
difficulty: 55
skills:
  requires:
    - sql.round-cast
    - sql.multi-join
    - sql.cte
    - sql.conditional-agg
    - analytics.active-reach
    - analytics.revenue-per-user
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
  - db:readerapp + datasets/without-payers.sql
ordered: true
hints:
  - ARPU 用全部当期活跃人数，ARPPU 用其中有正向收款的人数。净收入要扣除退款，付费资格与净额正负分开判断。
wrong_examples:
  - why: 把全部活跃读者当付费者
    sql: |-
      WITH active AS (
          SELECT DISTINCT user_id FROM logins WHERE logged_at >= DATE '2025-02-01' AND logged_at < DATE '2025-03-01'
      ), money AS (
          SELECT user_id, SUM(amount) AS net, COUNT(*) FILTER (WHERE amount>0) AS charges FROM payments
          WHERE paid_at >= DATE '2025-02-01' AND paid_at < DATE '2025-03-01' GROUP BY user_id
      )
      SELECT device, ROUND(SUM(COALESCE(net, 0)) / NULLIF(COUNT(*), 0), 2) AS arppu
      FROM active LEFT JOIN money USING (user_id) JOIN readers USING (user_id) GROUP BY device ORDER BY device;
  - why: 把退款也加成正收入
    sql: |-
      WITH active AS (
          SELECT DISTINCT user_id FROM logins WHERE logged_at >= DATE '2025-02-01' AND logged_at < DATE '2025-03-01'
      ), money AS (
          SELECT user_id, SUM(ABS(amount)) AS net, COUNT(*) FILTER (WHERE amount>0) AS charges FROM payments
          WHERE paid_at >= DATE '2025-02-01' AND paid_at < DATE '2025-03-01' GROUP BY user_id
      )
      SELECT device, ROUND(SUM(COALESCE(net, 0)) / NULLIF(COUNT(*) FILTER (WHERE charges>0), 0), 2) AS arppu
      FROM active LEFT JOIN money USING (user_id) JOIN readers USING (user_id) GROUP BY device ORDER BY device;
