id: analytics-6-005-expected-split
title: 补全：按计划分配期望人数
track: analytics
stage: '6'
unit: 2
order: 50
format: complete
difficulty: 59
skills:
  requires:
    - sql.round-cast
    - sql.left-join
    - sql.join-aggregate
    - sql.cte
  introduces: analytics.split-balance
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
  - db:readerapp + datasets/empty.sql
ordered: true
hints:
  - 期望人数等于总人数乘计划份额。卡方统计量为各组 (实际−期望)²/期望 之和，用来量化分流偏离。
wrong_examples:
  - why: 擅自把 A 组计划改成均分
    sql: |-
      WITH clean AS (
          SELECT user_id, MIN(arm) AS arm, MIN(assigned_at) AS entered FROM assignments
          WHERE experiment='cover' GROUP BY user_id HAVING COUNT(DISTINCT arm)=1
      ), plan(arm, target) AS (VALUES ('A', 0.50), ('B', 0.40)), sizes AS (
          SELECT p.arm, p.target, COUNT(c.user_id) AS observed FROM plan p LEFT JOIN clean c ON c.arm=p.arm
          GROUP BY p.arm, p.target
      ), expected AS (
          SELECT arm, observed, SUM(observed) OVER () * target AS expected_n FROM sizes
      )
      SELECT arm, observed, ROUND(expected_n, 2) AS expected_n FROM expected ORDER BY arm;
  - why: 把同组重报者也误删
    sql: |-
      WITH clean AS (
          SELECT user_id, MIN(arm) AS arm, MIN(assigned_at) AS entered FROM assignments
          WHERE experiment='cover' GROUP BY user_id HAVING COUNT(*)=1
      ), plan(arm, target) AS (VALUES ('A', 0.60), ('B', 0.40)), sizes AS (
          SELECT p.arm, p.target, COUNT(c.user_id) AS observed FROM plan p LEFT JOIN clean c ON c.arm=p.arm
          GROUP BY p.arm, p.target
      ), expected AS (
          SELECT arm, observed, SUM(observed) OVER () * target AS expected_n FROM sizes
      )
      SELECT arm, observed, ROUND(expected_n, 2) AS expected_n FROM expected ORDER BY arm;
