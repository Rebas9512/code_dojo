id: analytics-6-009-arm-conversion
title: 补全：各组多少人买了书
track: analytics
stage: '6'
unit: 3
order: 90
format: complete
difficulty: 61
skills:
  requires:
    - sql.round-cast
    - sql.left-join
    - sql.join-conditions
    - sql.join-aggregate
  introduces: analytics.experiment-effect
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 每人最多转化一次。相对提升=(pB−pA)/pA。两比例 z 检验用总成功数除以总人数得到合并比例 p，再用差值除以标准误。
wrong_examples:
  - why: 整数相除丢失小数
    sql: |-
      WITH clean AS (
          SELECT user_id, MIN(arm) AS arm, MIN(assigned_at) AS entered FROM assignments
          WHERE experiment='cover' GROUP BY user_id HAVING COUNT(DISTINCT arm)=1
      ), person AS (
          SELECT c.user_id, c.arm, BOOL_OR(p.amount>0) AS converted FROM clean c LEFT JOIN payments p
            ON p.user_id=c.user_id AND p.paid_at >= c.entered AND p.paid_at < c.entered + INTERVAL '7 days'
          GROUP BY c.user_id, c.arm
      ), rates AS (
          SELECT arm, COUNT(*) AS n, COUNT(*) FILTER (WHERE converted) AS x FROM person GROUP BY arm
      )
      SELECT arm, n, x, ROUND(x/n, 4) AS rate FROM rates ORDER BY arm;
  - why: 把同组重报者也误删
    sql: |-
      WITH clean AS (
          SELECT user_id, MIN(arm) AS arm, MIN(assigned_at) AS entered FROM assignments
          WHERE experiment='cover' GROUP BY user_id HAVING COUNT(*)=1
      ), person AS (
          SELECT c.user_id, c.arm, BOOL_OR(p.amount>0) AS converted FROM clean c LEFT JOIN payments p
            ON p.user_id=c.user_id AND p.paid_at >= c.entered AND p.paid_at < c.entered + INTERVAL '7 days'
          GROUP BY c.user_id, c.arm
      ), rates AS (
          SELECT arm, COUNT(*) AS n, COUNT(*) FILTER (WHERE converted) AS x FROM person GROUP BY arm
      )
      SELECT arm, n, x, ROUND(x::numeric/n, 4) AS rate FROM rates ORDER BY arm;
