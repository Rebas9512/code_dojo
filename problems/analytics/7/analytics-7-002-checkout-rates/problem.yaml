hints:
  - 同一批访问先数到达各步的次数，再用相邻两步作为分子、分母。比较两周的步骤变化，随后按设备验证。
wrong_examples:
  - why: 第二步也除以全部访问
    sql: |-
      WITH weekly AS (
          SELECT DATE_TRUNC('week', viewed_at)::date AS week_start,
                 COUNT(*) AS visits,
                 COUNT(*) FILTER (WHERE carted_at>viewed_at) AS carts,
                 COUNT(*) FILTER (WHERE carted_at>viewed_at AND ordered_at>carted_at) AS orders
          FROM checkout_visits GROUP BY week_start
      )
      SELECT week_start, ROUND(carts::numeric/visits, 4) AS view_cart,
             ROUND(orders::numeric/visits, 4) AS cart_order FROM weekly ORDER BY week_start;
  - why: 比例做整数除法
    sql: |-
      WITH weekly AS (
          SELECT DATE_TRUNC('week', viewed_at)::date AS week_start,
                 COUNT(*) AS visits,
                 COUNT(*) FILTER (WHERE carted_at>viewed_at) AS carts,
                 COUNT(*) FILTER (WHERE carted_at>viewed_at AND ordered_at>carted_at) AS orders
          FROM checkout_visits GROUP BY week_start
      )
      SELECT week_start, ROUND(carts::integer/visits, 4) AS view_cart,
             ROUND(orders::integer/NULLIF(carts, 0), 4) AS cart_order FROM weekly ORDER BY week_start;
