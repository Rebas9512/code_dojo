id: analytics
name: 产品分析 SQL
summary: 用书店 App 的登录、交易和实验记录，回答产品团队的问题。
order: 10
language: sql
runtime: pglite
status: active
requires:
  - sql
skill_prefix: analytics
stages:
  - id: '1'
    name: 指标基础
    units:
      1: 活跃人数与粘性
      2: 完整日历与移动平均
      3: 占比与跨期比较
  - id: '2'
    name: 漏斗与转化
    units:
      1: 每一步触达的人数
      2: 按时间推进漏斗
      3: 限时转化与等待时长
  - id: '3'
    name: 留存与流失
    units:
      1: 固定日与滚动留存
      2: 注册周与批次矩阵
      3: 流失快照与风险人群
  - id: '4'
    name: 会话与连续行为
    units:
      1: 三十分钟切分会话
      2: 连续登录段与并列
      3: 首末行为与购买间隔
  - id: '5'
    name: 增长核算与用户价值
    units:
      1: 月活的新增、留存、回流与流失
      2: 活跃人均收入与付费人均收入
      3: 批次累计价值与复购
      4: 订阅月费与 MRR 变动
  - id: '6'
    name: 实验分析
    units:
      1: 实验分组与污染
      2: 分流比例与卡方检查
      3: 实验转化、提升与两比例检验
  - id: '7'
    name: 综合案例
    units:
      1: 案例一 · 结账改版后少了哪一步
      2: 案例二 · 续费下降与套餐构成
