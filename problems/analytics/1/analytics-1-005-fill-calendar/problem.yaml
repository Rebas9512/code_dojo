id: analytics-1-005-fill-calendar
title: 补全：填上没有登录的日期
track: analytics
stage: '1'
unit: 2
order: 50
format: complete
difficulty: 34
skills:
  requires:
    - sql.round-cast
    - sql.join-aggregate
    - sql.cte
  introduces: analytics.calendar-average
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 让日历放在 LEFT JOIN 左边。每天一行之后，今天和前六行才覆盖七个自然日。
wrong_examples:
  - why: 空日被筛掉
    sql: |-
      WITH days AS (
          SELECT generate_series(DATE '2025-01-01', DATE '2025-01-14', INTERVAL '1 day')::date AS day
      ), daily AS (
          SELECT day, COUNT(DISTINCT l.user_id) AS dau
          FROM days JOIN logins l ON l.logged_at::date = day GROUP BY day
      )
      SELECT day, dau FROM daily ORDER BY day;
  - why: 补出的空行也被计数
    sql: |-
      WITH days AS (
          SELECT generate_series(DATE '2025-01-01', DATE '2025-01-14', INTERVAL '1 day')::date AS day
      ), daily AS (
          SELECT day, COUNT(*) AS dau
          FROM days LEFT JOIN logins l ON l.logged_at::date = day GROUP BY day
      )
      SELECT day, dau FROM daily ORDER BY day;
