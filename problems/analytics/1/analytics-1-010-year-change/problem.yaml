id: analytics-1-010-year-change
title: 与去年同月比较
track: analytics
stage: '1'
unit: 3
order: 100
format: write
difficulty: 36
skills:
  requires:
    - sql.self-join
    - sql.round-cast
    - sql.left-join
    - analytics.period-change
  introduces: null
source: original
datasets:
  - datasets/sample.sql
  - datasets/sample.sql + datasets/edge.sql
ordered: true
hints:
  - 占比用部分除以整体。增长率用本期与基期之差除以基期，基期为零时没有可定义的增长率。
wrong_examples:
  - why: 用本期人数做分母
    sql: |-
      SELECT a.month_start, ROUND((a.readers_n - b.readers_n)::numeric / NULLIF(a.readers_n, 0), 4) AS growth_rate
      FROM monthly a LEFT JOIN monthly b ON b.month_start = a.month_start - INTERVAL '1 year'
      ORDER BY a.month_start;
  - why: 没有基期就丢掉本期
    sql: |-
      SELECT a.month_start, ROUND((a.readers_n - b.readers_n)::numeric / NULLIF(b.readers_n, 0), 4) AS growth_rate
      FROM monthly a JOIN monthly b ON b.month_start = a.month_start - INTERVAL '1 year'
      ORDER BY a.month_start;
