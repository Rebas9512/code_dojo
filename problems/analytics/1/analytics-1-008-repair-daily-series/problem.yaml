id: analytics-1-008-repair-daily-series
title: 改错：修好缺行的周报
track: analytics
stage: '1'
unit: 2
order: 80
format: fix
difficulty: 35
skills:
  requires:
    - sql.round-cast
    - sql.join-aggregate
    - sql.cte
    - analytics.calendar-average
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 让日历放在 LEFT JOIN 左边。每天一行之后，今天和前六行才覆盖七个自然日。
wrong_examples:
  - why: 以登录为保留侧，缺失日期消失
    sql: |-
      WITH days AS (
          SELECT generate_series(DATE '2025-01-01', DATE '2025-01-14', INTERVAL '1 day')::date AS day
      ), daily AS (
          SELECT day, COUNT(DISTINCT l.user_id) AS dau
          FROM days RIGHT JOIN logins l ON l.logged_at::date = day GROUP BY day
      )
      SELECT day, dau FROM daily WHERE day <= DATE '2025-01-07' ORDER BY day;
  - why: 同一人多次登录重复计数
    sql: |-
      WITH days AS (
          SELECT generate_series(DATE '2025-01-01', DATE '2025-01-14', INTERVAL '1 day')::date AS day
      ), daily AS (
          SELECT day, COUNT(l.user_id) AS dau
          FROM days LEFT JOIN logins l ON l.logged_at::date = day GROUP BY day
      )
      SELECT day, dau FROM daily WHERE day <= DATE '2025-01-07' ORDER BY day;
