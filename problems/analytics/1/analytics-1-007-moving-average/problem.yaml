id: analytics-1-007-moving-average
title: 七日活跃均值
track: analytics
stage: '1'
unit: 2
order: 70
format: variant
difficulty: 35
skills:
  requires:
    - sql.round-cast
    - sql.join-aggregate
    - sql.cte
    - analytics.calendar-average
  introduces: null
source: original
datasets:
  - db:readerapp
  - db:readerapp + datasets/edge.sql
ordered: true
hints:
  - 让日历放在 LEFT JOIN 左边。每天一行之后，今天和前六行才覆盖七个自然日。
wrong_examples:
  - why: 窗口多取一天
    sql: |-
      WITH days AS (
          SELECT generate_series(DATE '2025-01-01', DATE '2025-01-14', INTERVAL '1 day')::date AS day
      ), daily AS (
          SELECT day, COUNT(DISTINCT l.user_id) AS dau
          FROM days LEFT JOIN logins l ON l.logged_at::date = day GROUP BY day
      ), rolling AS (
          SELECT day, AVG(dau) OVER (ORDER BY day ROWS BETWEEN 7 PRECEDING AND CURRENT ROW) AS mean_dau
          FROM daily
      )
      SELECT day, ROUND(mean_dau, 2) AS mean_dau FROM rolling
      WHERE day >= DATE '2025-01-07' ORDER BY day;
  - why: 均值跳过空日
    sql: |-
      WITH days AS (
          SELECT generate_series(DATE '2025-01-01', DATE '2025-01-14', INTERVAL '1 day')::date AS day
      ), daily AS (
          SELECT day, COUNT(DISTINCT l.user_id) AS dau
          FROM days JOIN logins l ON l.logged_at::date = day GROUP BY day
      ), rolling AS (
          SELECT day, AVG(dau) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS mean_dau
          FROM daily
      )
      SELECT day, ROUND(mean_dau, 2) AS mean_dau FROM rolling
      WHERE day >= DATE '2025-01-07' ORDER BY day;
