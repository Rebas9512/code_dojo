  - why: "闭区间的右端少取一天。"
    code: |
      def range_totals(nums: list[int], queries: list[list[int]]) -> list[int]:
          pre = [0]
          for value in nums:
              pre.append(pre[-1] + value)
          totals = []
          for left, right in queries:
              totals.append(pre[right] - pre[left])
          return totals
