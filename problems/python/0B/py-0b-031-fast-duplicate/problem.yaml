wrong_examples:
  - why: "PM76：每个编号都在越来越长的列表里逐项查找，大规模无重复输入超时。"
    code: |
      def has_duplicate(badges: list[int]) -> bool:
          seen = []
          for badge in badges:
              if badge in seen:
                  return True
              seen.append(badge)
          return False


      def run_case(n: int, tail: list[int]) -> bool:
          badges = list(range(n))
          badges.extend(tail)
          return has_duplicate(badges)
