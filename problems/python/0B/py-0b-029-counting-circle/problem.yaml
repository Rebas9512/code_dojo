wrong_examples:
  - why: "轮到第 k 个人时又把他移到队尾，实际淘汰了下一位。"
    code: |
      from collections import deque


      def last_child(n: int, k: int) -> int:
          line = deque(range(1, n + 1))
          while len(line) > 1:
              for _ in range(k):
                  line.append(line.popleft())
              line.popleft()
          return line[0]
