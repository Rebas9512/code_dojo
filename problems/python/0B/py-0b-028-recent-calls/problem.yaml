  - why: "PM75：错误地把刚好三千毫秒前的请求排除了。"
    code: |
      from collections import deque


      class RecentCounter:
          def __init__(self):
              self.times = deque()

          def ping(self, t: int) -> int:
              self.times.append(t)
              while self.times[0] <= t - 3000:
                  self.times.popleft()
              return len(self.times)
