wrong_examples:
  - why: "方阵边长为奇数时重复计算中心格。"
    code: |
      def diagonal_total(grid: list[list[int]]) -> int:
          n = len(grid)
          total = 0
          for row in range(n):
              other = n - 1 - row
              total += grid[row][row]
              total += grid[row][other]
          return total
