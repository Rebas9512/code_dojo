wrong_examples:
  - why: "把被遮住的数也算入右侧。"
    code: |
      def pivot_position(nums: list[int]) -> int:
          total = sum(nums)
          left = 0
          for i, value in enumerate(nums):
              right = total - left
              if left == right:
                  return i
              left += value
          return -1
