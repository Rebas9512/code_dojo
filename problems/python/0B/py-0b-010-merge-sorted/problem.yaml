wrong_examples:
  - why: "左列先用完时漏掉右列的尾巴。"
    code: |
      def merge_sorted(a: list[int], b: list[int]) -> list[int]:
          result = []
          i = j = 0
          while i < len(a) and j < len(b):
              if a[i] <= b[j]:
                  result.append(a[i])
                  i += 1
              else:
                  result.append(b[j])
                  j += 1
          result.extend(a[i:])
          return result
