  - why: "把两位次数写进一个位置，占用格数和存入的字符都不对。"
    code: |
      def compress(chars: list[str]) -> int:
          read = write = 0
          while read < len(chars):
              start = read
              letter = chars[read]
              while read < len(chars) and chars[read] == letter:
                  read += 1
              chars[write] = letter
              write += 1
              count = read - start
              if count > 1:
                  if count >= 10:
                      chars[write] = str(count)
                      write += 1
                      continue
                  for digit in str(count):
                      chars[write] = digit
                      write += 1
          return write


      def run_case(chars: list[str]) -> list:
          size = compress(chars)
          return [size, chars[:size]]
