entry: run_case
signature: 'def run_case(nums: list[int], left: int, right: int) -> list[int]:'
compare: exact
wrong_examples:
  - why: "把右边界当成切片的开区间，漏掉最后一个位置。"
    code: |
      def reverse_part(nums: list[int], left: int, right: int) -> None:
          right -= 1
          while left < right:
              nums[left], nums[right] = nums[right], nums[left]
              left += 1
              right -= 1


      def run_case(nums: list[int], left: int, right: int) -> list[int]:
          reverse_part(nums, left, right)
          return nums
