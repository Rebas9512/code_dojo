wrong_examples:
  - why: "把行数当成列数，长方形表会缺列或越界。"
    code: |
      def transpose(grid: list[list[int]]) -> list[list[int]]:
          if not grid:
              return []
          result = []
          for col in range(len(grid)):
              new_row = []
              for row in grid:
                  new_row.append(row[col])
              result.append(new_row)
          return result
