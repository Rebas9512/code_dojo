wrong_examples:
  - why: "PM70：取出了互异的编号，实际要比较的是次数。"
    code: |
      def unique_counts(records: list[int]) -> bool:
          counts = {}
          for badge in records:
              counts[badge] = counts.get(badge, 0) + 1
          frequencies = set(counts)
          return len(frequencies) == len(counts)
