wrong_examples:
  - why: "只登记某行出现过，遇到相同内容的多行会漏算。"
    code: |
      def equal_lines(grid: list[list[int]]) -> int:
          row_counts = {}
          for row in grid:
              key = tuple(row)
              row_counts[key] = 1
          pairs = 0
          for c in range(len(grid)):
              column = []
              for row in grid:
                  column.append(row[c])
              pairs += row_counts.get(tuple(column), 0)
          return pairs
