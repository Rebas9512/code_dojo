  - why: 只查小写，遗漏大写元音。
    code: |
      def is_vowel(ch: str) -> bool:
          return ch in "aeiou"


      def vowel_count(text: str) -> int:
          count = 0
          for ch in text:
              if is_vowel(ch):
                  count += 1
          return count
