wrong_examples:
  - why: 同分也替换冠军，取到后来才出现的歌。
    code: |
      def favorite(log: list[str]) -> str:
          counts = {}
          for song in log:
              counts[song] = counts.get(song, 0) + 1
          best = ""
          maximum = 0
          for song, count in counts.items():
              if count >= maximum:
                  best = song
                  maximum = count
          return best
