  - why: 用集合保存每人的点单，重复菜品丢失。
    code: |
      def orders(rows: list[list[str]]) -> dict[str, list[str]]:
          book = {}
          for guest, dish in rows:
              if guest not in book:
                  book[guest] = set()
              book[guest].add(dish)
          return book
