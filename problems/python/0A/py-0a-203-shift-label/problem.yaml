wrong_examples:
  - why: 直接加位移，越过字母表末端时走进了别的字符。
    code: |
      def shift_char(ch: str, step: int) -> str:
          offset = ord(ch) - ord("a") + step
          return chr(ord("a") + offset)


      def shift_label(text: str, step: int) -> str:
          result = ""
          for ch in text:
              result += shift_char(ch, step)
          return result
