  - why: 最后一段仍从原起点出发，临时柱上的圆盘没有被搬走。
    code: |
      def hanoi(n: int, start: str, spare: str, end: str) -> list[str]:
          if n == 0:
              return []
          before = hanoi(n - 1, start, end, spare)
          move = [start + "→" + end]
          after = hanoi(n - 1, start, spare, end)
          return before + move + after
