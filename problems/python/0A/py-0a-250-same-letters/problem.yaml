wrong_examples:
  - why: 只记一种字母有没有出现，忽略枚数。
    code: |
      def amounts(text: str) -> dict[str, int]:
          counts = {}
          for ch in text:
              counts[ch] = 1
          return counts


      def same_letters(a: str, b: str) -> bool:
          return amounts(a) == amounts(b)
