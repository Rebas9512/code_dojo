  - why: 每加入一个成员就把整组替换掉。
    code: |
      def by_size(words: list[str]) -> dict[str, list[str]]:
          groups = {}
          for word in words:
              key = str(len(word))
              if key not in groups:
                  groups[key] = []
              groups[key] = [word]
          return groups
