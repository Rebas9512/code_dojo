id: py-0a-l01-basics
title: 函数、整除和格式化
track: python
skills: [py.func-return, py.floordiv-mod, py.fstring]
steps:
  - type: read
    skill: py.func-return
    md: |
      **函数**是一段有名字、可以反复使用的代码，像一份菜谱：给它原料（**参数**），它按步骤做完，把成品交回来（**返回值**）。

      ```python
      def double(x):
          return x * 2
      ```
      - `def` 开头定义函数，`double` 是名字，括号里的 `x` 是参数；
      - 冒号后面**缩进 4 个空格**的几行是函数体；
      - `return` 把结果交回给调用它的地方。

      定义只是写好菜谱，并不会运行。写 `double(5)` 才是**调用**：x 变成 5，运行函数体，`double(5)` 这个整体就等于返回值 10。

      code-dojo 的大多数题是"函数题"：题目给出第一行（签名），你在函数体里算出结果并 `return`，判题程序直接调用你的函数、检查返回值。签名里的 `: int`、`-> int` 只是说明类型，不影响运行。

      常见误解：
      - **"print 就是返回"**：函数里的 print 只是显示给人看，调用的地方拿不到这个值；判题看的是 return。
      - **"定义完就运行了"**：不调用就不运行。
  - type: example
    skill: py.func-return
    code: |
      # ① 定义函数：参数 width、height，返回面积
      def rectangle_area(width, height):
          area = width * height
          return area

      # ② 调用函数，用变量接住返回值
      a = rectangle_area(3, 4)
      print(a)
      # ③ 返回值也可以直接拿去计算
      print(rectangle_area(2, 5) + 1)
    md: "再加一行 `rectangle_area(10, 10)`（不 print），运行后屏幕上多了什么？为什么？"
  - type: quiz
    skill: py.func-return
    q: "函数题里，结果应该怎样交给判题程序？"
    options: ["用 print 把结果显示出来", "用 return 把结果返回", "把结果存进一个叫 result 的变量就行"]
    answer: 1
    explain: "判题程序调用你的函数、检查它的返回值。只 print 的话，函数的返回值是空的（None）。"
  - type: read
    skill: py.floordiv-mod
    md: |
      除法有三种结果：`7 / 2` 是 3.5（带小数）；`7 // 2` 是 **3**（整除：只要整数部分）；`7 % 2` 是 **1**（取余：除不尽剩下的）。它们总满足 `7 == (7 // 2) * 2 + 7 % 2`。

      为什么常用？很多"拆分"问题都靠它们：
      - 分钟换算：`125 // 60` 是 2 小时，`125 % 60` 是 5 分钟；
      - 拆数字：`1234 % 10` 是个位 4，`1234 // 10` 是去掉个位的 123；
      - 判断奇偶：`n % 2 == 0` 就是偶数（`==` 表示"等于"）。

      常见误解：
      - **"整除就是去掉小数点"**：对负数不对。`//` 是**向下**取整，往更小的方向走：`-7 // 2` 是 **-4**，不是 -3；对应地 `-7 % 2` 是 1。
      - **"% 是百分号"**：在 Python 里它是取余。
  - type: example
    skill: py.floordiv-mod
    code: |
      # ① 把总分钟拆成小时和分钟
      total = 125
      hours = total // 60
      minutes = total % 60
      print(hours, minutes)
      # ② 拆出三位数的每一位：百位、十位、个位
      n = 472
      print(n // 100, n // 10 % 10, n % 10)
      # ③ 负数向下取整
      print(-7 // 2, -7 % 2)
    md: "把 total 改成 59、60、61 分别运行，看小时和分钟怎么变。"
  - type: quiz
    skill: py.floordiv-mod
    q: "`-7 // 2` 的结果是？"
    options: ["-3", "-4", "-3.5"]
    answer: 1
    explain: "`//` 向下取整：-3.5 往更小的方向取整是 -4。"
  - type: read
    skill: py.fstring
    md: |
      经常要把文字和变量的值拼成一句话，比如"Lin is 30 years old"。最方便的写法是 **f-string**：在字符串的引号前加一个 `f`，花括号 `{}` 里写变量或表达式，运行时会被替换成它的值。

      ```python
      name = "Lin"
      age = 30
      f"{name} is {age} years old"      # 'Lin is 30 years old'
      f"next year: {age + 1} years old"         # 花括号里可以计算
      ```
      小数想保留几位，在花括号里加格式：`{price:.2f}` 保留 2 位小数。

      为什么不用 `+` 拼？`"age: " + age` 会报错（文字和数字是不同的类型，不能直接相加），f-string 会自动把数字变成文字。

      常见误解：
      - **"花括号自己会替换"**：忘了开头的 `f`，结果就是字面上的 `{name}`。
      - **"`:.2f` 会改变变量"**：它只影响显示出来的样子，变量本身不变。
  - type: example
    skill: py.fstring
    code: |
      # ① 准备数据
      item = "notebook"
      price = 12.5
      count = 3
      # ② 用 f-string 拼出一句话，金额保留两位小数
      line = f"{item} x{count}, total {price * count:.2f} yuan"
      print(line)
      # ③ 忘了 f 会怎样
      print("{item} x{count}")
    md: "把 `.2f` 改成 `.1f`、`.0f` 试试；再给第 ③ 步的字符串前面加上 f。"
  - type: quiz
    skill: py.fstring
    q: "`x = 3` 之后，`print(\"x = {x}\")` 显示什么？"
    options: ["x = 3", "x = {x}", "会报错"]
    answer: 1
    explain: "字符串前面没有 f，花括号原样保留。写成 `f\"x = {x}\"` 才会显示 x = 3。"
