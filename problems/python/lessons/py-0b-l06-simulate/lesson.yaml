id: py-0b-l06-simulate
title: 走一步，记一次状态
track: python
skills: [py.simulation]
steps:
  - type: read
    skill: py.simulation
    md: |
      棋子停在哪一格、已经跳了几次，这对数足以描述游戏此刻的状态。格子里写的是相对距离。一次行动先读脚下的数字，再把它加到当前位置，最后把跳数加一。即使这一步直接离开棋盘，也已经走了一步。

      **不变式**：每次检查循环条件时，pos 都是完成 steps 跳后的位置。条件先查看位置是否仍在棋盘内，然后才允许取数。若把距离当作下一格的绝对下标，棋子可能原地打转（PM73）。
  - type: example
    skill: py.simulation
    code: |
      # ① 起点和已走步数
      jumps = [2, 3, 1, 2]
      pos = steps = 0
      # ② 仍在棋盘时读取脚下的距离
      while pos < len(jumps):
          distance = jumps[pos]
          pos += distance
          steps += 1
          print(steps, pos)
    md: |
      | 跳之前 | 距离 | 跳之后 | 累计跳数 |
      |---:|---:|---:|---:|
      | 0 | 2 | 2 | 1 |
      | 2 | 1 | 3 | 2 |
      | 3 | 2 | 5 | 3 |

      把第一格改成 4，运行前先判断会打印几行。
  - type: quiz
    skill: py.simulation
    q: "棋子在下标 2 的格子，脚下写 3。下一步到哪个下标？"
    options:
      - "3"
      - "5"
      - "6"
    answer: 1
    explain: "从 2 向前数三格，落在 5；这一步的距离是 3。"
