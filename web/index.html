<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>code-dojo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23191714'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23e8b45e'/%3E%3C/svg%3E" />
    <script>
      // 在首屏渲染前定主题，避免闪一下
      try {
        const t = localStorage.getItem('dojo-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
